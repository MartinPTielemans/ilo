; Bumped together each Chromium release. The ungoogled-chromium-macos, -windows and
; ungoogled-chromium-portablelinux tags each name the ungoogled-chromium commit they build, and that
; names the Chromium version; setup.sh and linux/prepare.sh check both. A platform tag may build a
; later ungoogled-chromium commit than the tag, which fixes its patches. A platform whose repository
; hasn't tagged a Chromium major within a few days of Stable builds on ungoogled-chromium's tag with
; its last platform patches, and goes back to the platform's tag when one appears: its tag here
; stays its last, and ilo's rebased copies of the files that need it are in
; engine/patches/<repository>/ (tree.sh). The Mac never waits for a point release: a platform whose
; tag lags it on the same major stays on the Chromium its tag names, checked alone.
[chromium]
	version = 157.0.8103.78

[ungoogled-chromium]
	tag = 157.0.8103.78-1

[ungoogled-chromium-macos]
	tag = 156.0.8078.79

[ungoogled-chromium-portablelinux]
	tag = 156.0.8078.79-1

[ungoogled-chromium-windows]
	tag = 157.0.8103.78-1.1
