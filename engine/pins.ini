; Bumped together each Chromium release. The ungoogled-chromium-macos, -windows and
; ungoogled-chromium-portablelinux tags each name the ungoogled-chromium commit they build, and that
; names the Chromium version; setup.sh and linux/prepare.sh check both. A platform tag may build a
; later ungoogled-chromium commit than the tag, which fixes its patches. [chromium] is the Mac's,
; which never waits on another platform: a platform whose tag names another version, behind the
; Mac's or ahead of it, is on the Chromium its tag names, checked alone.
[chromium]
	version = 156.0.8078.79

[ungoogled-chromium]
	tag = 156.0.8078.79-1

[ungoogled-chromium-macos]
	tag = 156.0.8078.79

[ungoogled-chromium-portablelinux]
	tag = 156.0.8078.79-1

[ungoogled-chromium-windows]
	tag = 157.0.8103.38-1.1
