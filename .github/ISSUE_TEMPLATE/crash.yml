name: Crash or hang
description: ilo quit unexpectedly, or stopped responding.
labels:
  - crash
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        **macOS.** For a crash, macOS keeps a report in `~/Library/Logs/DiagnosticReports`
        (Console → Crash Reports shows the same). Take the `.ips` file from the time of the crash
        whose name starts with `Browser`, or a Helper's name if a page or the GPU process crashed.
        For a hang, sample the browser for 10 seconds while it's stuck:
        ```
        sample "$(pgrep -x Browser)" 10 -file ~/Desktop/ilo-hang.txt
        ```

        **Linux.** The next time ilo starts after a crash, it offers to send the crash's report:
        send it, and say below when the crash happened. For a hang, or a crash you can repeat, start
        ilo from a terminal (`flatpak run app.ilo.browser`) and upload what it prints.

        **Windows.** Event Viewer › Windows Logs › Application has an Application Error entry for a
        crash, or an Application Hang entry once Windows closes a hung ilo, naming `chrome.exe`.
        Copy the text of that entry's General tab.

        These hold file paths with your user name, and can hold URLs. Replace your user name and
        anything private before uploading.

  - type: dropdown
    id: kind
    attributes:
      label: What happened
      options:
        - The whole browser quit
        - A page crashed ("Aw, Snap" or a blank page)
        - The browser stopped responding
        - A page stopped responding
    validations:
      required: true

  - type: textarea
    id: doing
    attributes:
      label: What you were doing
      description: The last few things before it happened, when it happened, and whether you can make it happen again. Public URLs only.
    validations:
      required: true

  - type: upload
    id: report
    attributes:
      label: Crash report, sample or log
      description: The sample or the `.ips` file zipped or renamed to `.txt` (GitHub won't take `.ips`), the terminal's output, or the event's text, redacted.
    validations:
      required: false
      accept: ".txt,.log,.json,.zip"

  - type: input
    id: version
    attributes:
      label: ilo version
      description: Help › Troubleshooting › Copy Build Info copies it, with the Chromium version and the system. Built from source, the commit (`git rev-parse --short HEAD`).
      placeholder: 0.1.4 (4321)
    validations:
      required: true

  - type: input
    id: chromium
    attributes:
      label: Chromium version
      description: "Help › Troubleshooting › Copy Build Info has it, as has `chromium.version` in `engine/pins.ini` at that commit."

  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: System and chip
      description: "Help › Troubleshooting › Copy Build Info has both. By hand: `sw_vers -productVersion` and `uname -m` on macOS, `PRETTY_NAME` in `/etc/os-release` on Linux, what `winver` shows on Windows."
      placeholder: macOS 15.1, Apple M2 Pro
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How ilo is installed
      options:
        - macOS, the DMG
        - Linux, the Flatpak
        - Windows, the installer (setup.exe)
        - Windows, from winget
        - Windows, from the Microsoft Store (MSIX)
        - Built from source
    validations:
      required: true

  - type: input
    id: desktop
    attributes:
      label: Linux session and desktop
      description: "Linux only: Wayland or X11, and the desktop or compositor, such as Hyprland on Omarchy. `echo $XDG_SESSION_TYPE $XDG_CURRENT_DESKTOP` prints both."
      placeholder: wayland Hyprland

  - type: textarea
    id: extensions
    attributes:
      label: Extensions installed
