name: Site doesn't work
description: A site works in Chrome but not in ilo.
labels:
  - site
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        If the site breaks in Chrome as well, it's the site's or Chromium's problem, not ilo's.

        **Public pages only.** If it only breaks once you're signed in, say so and describe it;
        never paste cookies, tokens, account details, or what the signed-in page shows.

  - type: input
    id: url
    attributes:
      label: URL
      description: A public URL where it breaks.
      placeholder: https://example.com/page
    validations:
      required: true

  - type: textarea
    id: broken
    attributes:
      label: What breaks
      description: What you did and what went wrong. A sign-in that never finishes, a video that won't play, a button that does nothing.
    validations:
      required: true

  - type: input
    id: chrome
    attributes:
      label: Chrome version it works in
      description: From chrome://version.
      placeholder: 155.0.8059.84
    validations:
      required: true

  - type: checkboxes
    id: tried
    attributes:
      label: What you tried in ilo
      options:
        - label: It breaks with every extension turned off.
        - label: It breaks in a new profile.
        - label: It breaks after a reload.

  - type: textarea
    id: console
    attributes:
      label: Errors in DevTools
      description: Console errors or failed network requests (⌥⌘I), redacted. Leave out headers and cookies.
      render: text

  - type: input
    id: version
    attributes:
      label: ilo version
      description: "Settings › About shows it, and Copy Build Info copies it with the Chromium version, the system and the chip: Help › Troubleshooting on the Mac, the command bar elsewhere. Built from source, the commit (`git rev-parse --short HEAD`)."
      placeholder: 0.1.0 (4321)
    validations:
      required: true

  - type: input
    id: chromium
    attributes:
      label: Chromium version
      description: "Copy Build Info has it. Built from source, `chromium.version` in `engine/pins.ini` at that commit."
      placeholder: 156.0.7600.12

  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: System and chip
      description: "The system's version and the chip, as Copy Build Info gives them. By hand: on the Mac `sw_vers -productVersion` and `uname -m`; on Linux the distribution (`PRETTY_NAME` in `/etc/os-release`) and `uname -m`; on Windows the version `winver` shows."
      placeholder: macOS 15.1, Apple M2 Pro
    validations:
      required: true

  - type: input
    id: linux
    attributes:
      label: On Linux, how ilo is installed, the session and the desktop
      description: "The Flatpak from ilo's releases, or built from source; Wayland or X11 (`echo $XDG_SESSION_TYPE`); and the desktop or compositor (`echo $XDG_CURRENT_DESKTOP`), such as GNOME, KDE Plasma, or Hyprland on Omarchy."
      placeholder: Flatpak, Wayland, Hyprland (Omarchy)

  - type: input
    id: windows
    attributes:
      label: On Windows, how ilo is installed
      description: "The installer (ilo-windows-x64-setup.exe), winget, the Microsoft Store, or built from source."
      placeholder: ilo-windows-x64-setup.exe

  - type: textarea
    id: extensions
    attributes:
      label: Extensions installed

  - type: upload
    id: attachments
    attributes:
      label: Screenshots or recordings
      description: Redact first.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm,.txt,.log"
