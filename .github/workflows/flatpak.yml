# ilo's Flatpak (tools/flatpak.sh) from the prod build on the prebuilt Linux engine, as an artifact,
# then installed and started on X11 in Xvfb to see that its first window draws.
# Run it by hand to build from a branch whose packaging didn't change. release.yml calls it for a
# release's Flatpak, the `ilo-flatpak` artifact, and its crash reports' symbols, and check-linux.yml
# beside its shards, on main each night and after each merge train.
# A push or a run by hand whose core/public/browser_core.h no published Linux engine has is
# skipped, as nothing can run it, as check-linux.yml skips it (#882). A release fails instead: it
# needs its commit's engine.
name: Flatpak

on:
  # Branches only: an engine release's tag, pushed with the owner's token, starts nothing here. Also
  # the check runs its steps do (Sign in, Policies, Paste and Page menu) and sync-account's server,
  # which change apart from the packaging (#3059), the action and script it installs its packages
  # with (#3760), and the script that keeps the app's backtraces (#3859).
  push:
    branches: ['**']
    paths:
      - app/platform/linux/flatpak/**
      - tools/flatpak.sh
      - tools/flatpak-cores.sh
      - .github/workflows/flatpak.yml
      - .github/actions/apt-install/**
      - .github/scripts/apt-mirrors.sh
      - app/check/sync-account.sh
      - app/check/ilo-server.sh
      - app/check/policies.sh
      - app/check/paste.sh
      - app/check/page-menu.sh
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: A release's bundle, which fails rather than skips without its engine
        type: boolean
        default: true
      symbols:
        description: Upload the bundle's crash reports' symbols (tools/symbols.sh)
        type: boolean
        default: false
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # engine/fetch.sh finds the engine by the commits in the history its releases are named for.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: engine
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          status=0
          engine/fetch.sh > /dev/null 2> "$RUNNER_TEMP/fetch.log" || status=$?
          cat "$RUNNER_TEMP/fetch.log" >&2
          case $status in
          0) echo "found=true" >> "$GITHUB_OUTPUT" ;;
          2)
            why=$(tail -1 "$RUNNER_TEMP/fetch.log")
            if [ "$RELEASE" = true ]; then
              echo "::error::No Linux engine fits this commit, so the release has no Flatpak. $why"
              exit 1
            fi
            echo "::notice::No Linux engine fits this commit, so no Flatpak is built. $why"
            printf 'Skipped: no Linux engine fits this commit, so no Flatpak is built.\n\n%s\n' "$why" >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
            ;;
          *) exit "$status" ;;
          esac

      # The UI's build as in app-linux.yml; Xvfb and ImageMagick to start the bundle and see it.
      - name: Install tools
        if: ${{ steps.engine.outputs.found == 'true' }}
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libclang-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
            flatpak flatpak-builder xvfb imagemagick
      - if: ${{ steps.engine.outputs.found == 'true' }}
        run: |
          rustup update stable --no-self-update
          # Ubuntu's AppArmor keeps bubblewrap, which flatpak builds and runs in, from making
          # user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Every ref reads main's build cache, and main alone saves one: a copy saved by each
      # branch pushed main's out of the repository's 10 GB (#1969).
      - id: cache
        if: ${{ steps.engine.outputs.found == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: flatpak-${{ hashFiles('app/Cargo.lock', 'app/linux/Cargo.lock', 'app/setup.sh', 'app/patches/**') }}
          restore-keys: flatpak-

      - if: ${{ steps.engine.outputs.found == 'true' }}
        run: tools/flatpak.sh

      - if: ${{ steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The engine's and the app's files as the bundle has them: its build strips nothing
      # (no-debuginfo), so chrome and libBrowser.so keep their symbol tables.
      - name: Crash reports' symbols
        if: ${{ inputs.symbols && steps.engine.outputs.found == 'true' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: tools/symbols.sh app/build/Browser

      - if: ${{ steps.engine.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ilo-flatpak
          path: app/build/ilo.flatpak
          retention-days: 14

      # When the app dies on a signal in a step below, its backtrace is kept as text (#3859).
      - name: Catch the app's cores
        id: catch
        if: ${{ steps.engine.outputs.found == 'true' }}
        continue-on-error: true
        run: tools/flatpak-cores.sh catch "$RUNNER_TEMP/cores"

      - name: Install and start
        if: ${{ steps.engine.outputs.found == 'true' }}
        run: |
          flatpak install --user -y --noninteractive app/build/ilo.flatpak
          mkdir -p app/build/flatpak-start
          cd app/build/flatpak-start
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' bash -c '
            flatpak run app.ilo.browser > ilo.log 2>&1 &
            pid=$!
            for _ in $(seq 120); do
              grep -q "browser: UI shown" ilo.log && break
              kill -0 $pid 2>/dev/null || break
              sleep 1
            done
            import -window root started.png || true
            flatpak kill app.ilo.browser || true
            wait $pid || true'
          cat ilo.log
          grep -q "browser: UI shown" ilo.log

      # The ilo command reaches the browser from the host as a client's bridge does, run in the
      # sandbox by Flatpak, as the script the row's line writes runs it (#3667): help lists the
      # server's tools, and open opens a page as the command's agent. The agent file and its token
      # are seeded as Add writes them, which the UI's check drives elsewhere. BROWSER_CHECK has the
      # app log the server's address, and the onboarding, which the start above left unplayed, is
      # skipped, as check.sh skips it.
      - name: The ilo command
        id: command
        if: ${{ steps.engine.outputs.found == 'true' && !inputs.release }}
        run: |
          profile="$HOME/.var/app/app.ilo.browser/config/$(cat app/branding/name)"
          product=$(cat app/branding/product)
          token=$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')
          mkdir -p "$profile" app/build/flatpak-command
          printf '{"on":true,"agents":[{"client":"ilo-command","token":"%s","name":"%s"}]}' "$token" "$product" > "$profile/Agents"
          cd app/build/flatpak-command
          printf '<title>Shot</title><p>A page to take a picture of.</p>' > index.html
          python3 -m http.server --bind 127.0.0.1 8765 > server.log 2>&1 &
          server=$!
          status=0
          TOKEN=$token PROFILE=$profile PRODUCT=$product dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' bash -c '
            set -u
            flatpak run --env=BROWSER_CHECK=1 --env=BROWSER_ONBOARDING=skip app.ilo.browser > ilo.log 2>&1 &
            pid=$!
            for _ in $(seq 120); do
              grep -q "^browser: agents server on " ilo.log && break
              kill -0 $pid 2>/dev/null || break
              sleep 1
            done
            address=$(sed -n "s/^browser: agents server on //p" ilo.log | tail -1)
            status=0
            if [ -z "$address" ]; then
              echo "::error::The Flatpak started no agents server with agents on in its Agents file."
              status=1
            else
              (umask 077 && printf "%s\n%s\n" "$address" "$TOKEN" > "$PROFILE/$PRODUCT-command")
              ilo() { flatpak run --command=/app/ilo/ilo-command app.ilo.browser "$@"; }
              help=$(ilo help 2>&1) || { echo "::error::ilo help failed ($?): $help"; status=1; }
              case $help in *"$PRODUCT click <ref>"*) ;; *) echo "::error::ilo help listed no click: $help"; status=1 ;; esac
              opened=$(ilo open http://127.0.0.1:8765/ --as Checker 2>&1) ||
                { echo "::error::ilo open failed ($?): $opened"; status=1; }
              case $opened in *"127.0.0.1:8765"*) ;; *) echo "::error::ilo open named no page: $opened"; status=1 ;; esac
              # A shot without -o, saved under ~/Downloads, is checked once the Flatpak pictures a page (#3788).
              import -window root command.png || true
            fi
            flatpak kill app.ilo.browser || true
            wait $pid || true
            exit $status' || status=$?
          kill $server || true
          cat ilo.log
          exit $status

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.command.outcome != 'skipped' }}
        with:
          name: ilo-flatpak-command
          path: app/build/flatpak-command
          if-no-files-found: ignore

      # A crash of each kind of process leaves a minidump in the sandbox (#2454), once the engine
      # has the patch that reads a crashed process without ptrace, which Flatpak's seccomp refuses.
      - name: Crash dumps
        if: ${{ steps.engine.outputs.found == 'true' && !inputs.release }}
        run: |
          engine=$(engine/fetch.sh commit)
          if ! git cat-file -e "$engine:engine/patches/ours/chromium-crashpad-flatpak-dumps.patch" 2> /dev/null; then
            echo "::notice::Skipped crash dumps: the engine (${engine:0:12}) predates the patch for them."
            exit 0
          fi
          # It crashes the app on purpose, so no core of it is kept.
          touch "$RUNNER_TEMP/cores/hold"
          trap 'rm -f "$RUNNER_TEMP/cores/hold"' EXIT
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' \
            tools/flatpak-crashes.sh app/build/flatpak-crashes

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.engine.outputs.found == 'true' && !inputs.release }}
        with:
          name: ilo-flatpak-crashes
          path: app/build/flatpak-crashes
          if-no-files-found: ignore

      # The Flatpak signs in to sync as the build does, by check.sh's sync-account run, driven in its
      # sandbox (BROWSER_FLATPAK), on an ilo-server of the run's own, on SQLite with a throwaway
      # account, never the hosted one, at the commit check-linux.yml builds. Not in a release,
      # which a check's flake would hold up.
      - id: server
        if: ${{ steps.engine.outputs.found == 'true' && !inputs.release }}
        uses: actions/checkout@v4
        with:
          repository: MartinPTielemans/ilo-server
          ref: 882f2736e5a3b228543ae33b821aeeb52f80426d
          path: app/.deps/ilo-server

      # Main alone saves, as for the build cache above (#1969).
      - id: server-cache
        if: ${{ steps.server.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: app/.deps/ilo-server/target
          key: ilo-server-882f2736e5a3b228543ae33b821aeeb52f80426d

      - if: ${{ steps.server.outcome == 'success' }}
        uses: ./.github/actions/apt-install
        with:
          packages: xdotool openbox xauth xclip

      - name: Sign in
        if: ${{ steps.server.outcome == 'success' }}
        working-directory: app
        env:
          # The runner's C.UTF-8 names no country, as check-linux.yml says.
          LANG: en_US.UTF-8
        run: |
          (cd .deps/ilo-server && cargo build --release --locked)
          XDG_RUNTIME_DIR=$(mktemp -d) ILO_SERVER=$PWD/.deps/ilo-server/target/release/ilo-server \
            BROWSER_FLATPAK=1 BROWSER_XVFB=1 dbus-run-session -- ./check.sh sync-account

      - if: ${{ steps.server-cache.outcome == 'success' && steps.server-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: app/.deps/ilo-server/target
          key: ilo-server-882f2736e5a3b228543ae33b821aeeb52f80426d

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.server.outcome == 'success' }}
        with:
          name: ilo-flatpak-sign-in
          path: app/build/check
          if-no-files-found: ignore

      # An administrator's policies reach the Flatpak through its extension point (docs/policies.md),
      # as check.sh's policies run sets URLBlocklist in an unmanaged extension of the run's own.
      - if: ${{ steps.engine.outputs.found == 'true' && !inputs.release }}
        uses: ./.github/actions/apt-install
        with:
          packages: xdotool openbox xauth
      - name: Policies
        id: policies
        if: ${{ steps.engine.outputs.found == 'true' && !inputs.release }}
        working-directory: app
        env:
          LANG: en_US.UTF-8
        run: |
          XDG_RUNTIME_DIR=$(mktemp -d) BROWSER_FLATPAK=1 BROWSER_XVFB=1 \
            dbus-run-session -- ./check.sh policies

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.policies.outcome != 'skipped' }}
        with:
          name: ilo-flatpak-policies
          path: app/build/check
          if-no-files-found: ignore

      # What another app copies pastes into the UI's fields in the sandbox (#2463), by check.sh's
      # paste run: under Xvfb on X11, and in a headless sway session on Wayland, where the sandbox
      # gives the app no X11. Each leg's files are moved aside, as each run starts build/check anew.
      - if: ${{ steps.engine.outputs.found == 'true' && !inputs.release }}
        uses: ./.github/actions/apt-install
        with:
          packages: xdotool openbox xauth xclip sway grim xwayland wl-clipboard
      - name: Paste
        id: paste
        if: ${{ steps.engine.outputs.found == 'true' && !inputs.release }}
        working-directory: app
        env:
          LANG: en_US.UTF-8
        run: |
          status=0
          XDG_RUNTIME_DIR=$(mktemp -d) BROWSER_FLATPAK=1 BROWSER_XVFB=1 \
            dbus-run-session -- ./check.sh paste || status=1
          [ ! -d build/check ] || mv build/check build/paste-x11
          XDG_RUNTIME_DIR=$(mktemp -d) BROWSER_FLATPAK=1 BROWSER_WAYLAND=1 \
            dbus-run-session -- ./check.sh paste || status=1
          [ ! -d build/check ] || mv build/check build/paste-wayland
          exit $status

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.paste.outcome != 'skipped' }}
        with:
          name: ilo-flatpak-paste
          path: |
            app/build/paste-x11
            app/build/paste-wayland
          if-no-files-found: ignore

      # A link's Copy Link Address in the sandbox, by check.sh's page-menu run: the browser goes on,
      # which it does only while the app's own feature list, Link copied's toast off among them,
      # outlasts the one Cobalt gives Chromium (#3158).
      - name: Page menu
        id: page-menu
        if: ${{ steps.engine.outputs.found == 'true' && !inputs.release }}
        working-directory: app
        env:
          LANG: en_US.UTF-8
        run: |
          XDG_RUNTIME_DIR=$(mktemp -d) BROWSER_FLATPAK=1 BROWSER_XVFB=1 \
            dbus-run-session -- ./check.sh page-menu

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.page-menu.outcome != 'skipped' }}
        with:
          name: ilo-flatpak-page-menu
          path: app/build/check
          if-no-files-found: ignore

      # Nothing runs past this on a job whose app never died on a signal.
      - id: cores
        if: ${{ always() && steps.catch.outcome == 'success' }}
        run: |
          if compgen -G "$RUNNER_TEMP/cores/*.core" > /dev/null; then
            echo found=true >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ always() && steps.cores.outputs.found == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/apt-install
        with:
          packages: gdb
      - name: Crash traces
        if: ${{ always() && steps.cores.outputs.found == 'true' }}
        continue-on-error: true
        run: tools/flatpak-cores.sh read "$RUNNER_TEMP/cores" app/build/flatpak-traces
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.cores.outputs.found == 'true' }}
        with:
          name: ilo-flatpak-traces
          path: app/build/flatpak-traces
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.engine.outputs.found == 'true' }}
        with:
          name: ilo-flatpak-start
          path: app/build/flatpak-start
          if-no-files-found: ignore
