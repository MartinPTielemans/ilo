# Fails when a pull request makes AGENTS.md and the docs it links to larger than on its base
# (tools/agent-context.sh). To accept growth on purpose, a maintainer adds the
# agent-context-increase label. A release's squash PR passes without it, as the PRs it folds each
# passed here already (#2203): one commit on batch/<the version after the base's>, or on a replay's
# batch/<that version>-<N>, from this repository. Adapted from T3 Code
# (https://github.com/pingdotgg/t3code, MIT) at commit 570d4b03eef879bd60be3d74444046858c94dacd.
name: Agent Context Budget

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: ['**.md', tools/agent-context.sh, .github/workflows/agent-context-budget.yml]

permissions: {}

# Only the agent-context-increase label changes the answer, but a trigger can't pick a label, so
# another label starts a run too. That run skips its job, in a group of its own: in the PR's group it
# would cancel the run in progress, which the merge queue reads as a failure (#1506).
concurrency:
  group: agent-context-budget-${{ github.event.pull_request.number }}${{ github.event.label && github.event.label.name != 'agent-context-increase' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  budget:
    name: Agent context budget
    if: ${{ !github.event.label || github.event.label.name == 'agent-context-increase' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ALLOW_INCREASE: ${{ contains(github.event.pull_request.labels.*.name, 'agent-context-increase') }}
      HEAD_REF: ${{ github.head_ref }}
      COMMITS: ${{ github.event.pull_request.commits }}
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      # The merge commit and its first parent, the base. Nothing is built or run but the measure.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Compare with the base
        run: |
          echo "Base:"; tools/agent-context.sh HEAD^1 | tee "$RUNNER_TEMP/base"
          echo "This pull request:"; tools/agent-context.sh HEAD | tee "$RUNNER_TEMP/head"
          base=$(awk '$2 == "total" { print $1 }' "$RUNNER_TEMP/base")
          head=$(awk '$2 == "total" { print $1 }' "$RUNNER_TEMP/head")
          if [ "$head" -le "$base" ]; then
            echo "Agent context is not larger than the base ($base -> $head bytes)."
            exit 0
          fi
          echo "Agent context grew: $base -> $head bytes (+$((head - base)))."
          if [ "$ALLOW_INCREASE" = "true" ]; then
            echo "Accepted by the agent-context-increase label."
            exit 0
          fi
          # A release's squash PR is named for the release it makes, the one after the base's
          # version, so each release has one such branch, and one commit, which a lane's PR isn't.
          # A squash replayed as a new commit goes on a new branch, never a force-push, so the name
          # may end in -<N>, digits only.
          version=$(git show HEAD^1:app/Cargo.toml | sed -n 's/^version = "\([0-9.]*\)"$/\1/p' | head -1)
          IFS=. read -r major minor patch <<<"$version"
          release=${HEAD_REF#batch/}
          case ${release##*-} in
            "$release") ;;
            '' | *[!0-9]*) release= ;;
            *) release=${release%-*} ;;
          esac
          case $release in
            "$major.$minor.$((patch + 1))" | "$major.$((minor + 1)).0" | "$((major + 1)).0.0") next=1 ;;
            *) next= ;;
          esac
          if [ "$HEAD_REF" != "${HEAD_REF#batch/}" ] && [ -n "$version" ] && [ -n "$next" ] &&
            [ "$COMMITS" = 1 ] && [ "$SAME_REPO" = true ]; then
            echo "Accepted as $release's release squash, whose folded PRs each passed this on their own."
            exit 0
          fi
          echo "::error file=AGENTS.md::Agent context grew by $((head - base)) bytes. Cut the added text, or ask a maintainer to add the agent-context-increase label."
          exit 1
