# The UI builds and its tests pass on Linux (AGENTS.md, Hit every surface: Platforms), and its
# screens are captured there. Running the browser needs a Linux engine, so this is the UI's library
# and the preview, which need none, and the browser's own library checked, not run.
name: UI on Linux

on:
  # Branches only: an engine release's tag, pushed with the owner's token, starts nothing here. The
  # actions and scripts its jobs run are its own too, so a change to one alone runs it (#3760).
  push:
    branches: ['**']
    paths: [app/**, core/public/**, core/split_keys_layouts.txt, tools/headless.sh, tools/parity.sh, .github/workflows/app-linux.yml, .github/actions/apt-install/**, .github/scripts/apt-mirrors.sh, .github/actions/tree-proof/**, .github/scripts/tree-proven.sh, '!**/*.md']
  pull_request:
    paths: [app/**, core/public/**, core/split_keys_layouts.txt, tools/headless.sh, tools/parity.sh, .github/workflows/app-linux.yml, .github/actions/apt-install/**, .github/scripts/apt-mirrors.sh, .github/actions/tree-proof/**, .github/scripts/tree-proven.sh, '!**/*.md']
  # A branch's head whose last push skipped this, as a push runs it only when its own diff matched (#1834).
  workflow_dispatch:

# A branch's newer push cancels its older run. Main's runs, and pull requests', each get a group of
# their own, so none is cancelled, or replaced while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # A push to main whose tree a branch or a pull request already passed a job on skips that job,
  # saying which run passed it (#2198). Each job records the tree it passed on at its end.
  proven:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      fmt: ${{ steps.look.outputs.fmt }}
      test: ${{ steps.look.outputs.test }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/tree-proven.sh
          sparse-checkout-cone-mode: false
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          for job in fmt test; do
            echo "$job=$(.github/scripts/tree-proven.sh "app-linux-$job" "$TREE")" >> "$GITHUB_OUTPUT"
          done

  # rustfmt alone, on the files git tracks: `cargo fmt` would need the crates setup.sh downloads to
  # read the manifests, and its --all formats them too. The workflow's app/** filter starts it for
  # every Rust file and app/rustfmt.toml.
  fmt:
    needs: proven
    if: >-
      !cancelled() && !needs.proven.outputs.fmt &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: git ls-files -z 'app/*.rs' | xargs -0 rustfmt --check
      - uses: ./.github/actions/tree-proof
        with:
          job: app-linux-fmt

  test:
    needs: proven
    # A pull request from a branch here already ran on its push, or on a dispatch on its head.
    if: >-
      !cancelled() && !needs.proven.outputs.test &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # bindgen reads the core's header with libclang; GPUI's X11 window system links xcb and
      # xkbcommon, and loads Wayland's, fontconfig and Vulkan at run time.
      - name: Install tools
        uses: ./.github/actions/apt-install
        with:
          packages: libclang-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - run: rustup update stable --no-self-update

      # Every ref reads main's build cache, and main alone saves one: a copy saved by each
      # branch pushed main's out of the repository's 10 GB (#1969).
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: app-linux-${{ hashFiles('app/Cargo.lock', 'app/linux/Cargo.lock', 'app/setup.sh', 'app/patches/**', 'core/public/browser_core.h') }}
          restore-keys: app-linux-

      # Cargo rebuilds what's older than its inputs, and a cache saved after this checkout (another
      # branch's, while apt stalled) is newer than them all, so its bindings and builds of the core's
      # header and the app would pass as fresh (#2003). Our files are made newer than anything restored.
      - run: git ls-files -z . ../core/public | xargs -0 touch

      - run: ./setup.sh
      - run: cargo test --release --lib
      # GPUI's Linux code has tests of its own, which the patch adds to and the app's don't reach: those
      # drive the app's views on a host that records what they ask (#2995). The crate is in zed's
      # workspace, not the app's, so they run there, on the toolchain the app builds with rather than
      # the one zed pins. Their build isn't cached and takes about 5 minutes, so it runs only when the
      # branch changes that code, or the app's Linux host beside it. Not --locked: the patch gives
      # gpui_linux a dependency, image, that zed's Cargo.lock doesn't list for it, and Cargo adds
      # that one line, leaving every version as zed locked it.
      - id: gpui-linux
        name: Does this change GPUI's Linux code?
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || 'main' }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # Compare names at most 300 files, all on its first page, and says nothing when it stops
        # there; its later pages hold only commits (#3202). So the tests are skipped only on a list
        # known whole: under 300 files, from a first page that has every commit.
        run: |
          if ! compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" \
            --jq '"\(.files | length) \(.commits | length) \(.total_commits)", .files[].filename'); then
            echo "Compare didn't answer, so the tests run."
            echo "changed=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r files commits total <<< "$compare"
          if [ "$files" -ge 300 ] || [ "$commits" -lt "$total" ]; then
            echo "Compare named $files files and $commits of $total commits, a list that may be cut short, so the tests run."
            echo "changed=1" >> "$GITHUB_OUTPUT"
          elif tail -n +2 <<< "$compare" | grep -qE '^app/(patches/gpui-linux-embedded\.patch$|platform/linux/)'; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: GPUI's Linux tests
        if: steps.gpui-linux.outputs.changed
        working-directory: app/.deps/zed
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo test --release -p gpui_linux --lib --target-dir "$RUNNER_TEMP/gpui-linux"
      # libBrowser.so, the browser on Linux (linux/Cargo.toml): main.rs and platform/linux, which
      # neither the tests nor the preview compile. It names none of the engine's symbols until chrome
      # loads it, so a check needs no engine, and finds what wouldn't compile, such as a call to a
      # function main.rs builds on the Mac and Windows alone.
      # linux/Cargo.lock pins what ships, seeded from ../Cargo.lock (#3966); a stale one fails here,
      # with the fix in its error, before the check below.
      - name: Is linux/Cargo.lock seeded from Cargo.lock?
        run: |
          cargo metadata --locked --format-version 1 --manifest-path linux/Cargo.toml >/dev/null || {
            echo "::error file=app/linux/Cargo.lock::app/linux/Cargo.lock is behind app/Cargo.lock. In app/, run: cp Cargo.lock linux/Cargo.lock && cargo metadata --format-version 1 --manifest-path linux/Cargo.toml >/dev/null, and commit linux/Cargo.lock."
            exit 1
          }
      - run: cargo check --release --locked --manifest-path linux/Cargo.toml --target-dir target
      - run: cargo build --release --bin preview
      # The binaries' test builds, which no job compiled: the tests above are the library's alone,
      # and every other build is without cfg(test), so the Browser binary's test build broke unseen
      # once. Building it would link the engine, which isn't here, so it is checked.
      - run: cargo check --release --tests
      # The preview's own tests, which the library's don't reach: its table of made-up states among
      # them, so a state read without its row fails here (#4478). The preview needs no engine, so
      # they run.
      - run: cargo test --release --bin preview
      # What follows decides nothing, so this tree has passed.
      - uses: ./.github/actions/tree-proof
        with:
          job: app-linux-test

      - if: ${{ steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The same screens on Wayland and X11, side by side, so text that fits on the Mac but not here
      # shows on every change to the app (tools/parity.sh). It only reports: nothing here fails the
      # job. lavapipe draws GPUI's Vulkan in software, as the runner has no GPU.
      - id: parity-tools
        continue-on-error: true
        uses: ./.github/actions/apt-install
        with:
          packages: sway grim xwayland imagemagick mesa-vulkan-drivers
          options: --no-install-recommends
      - name: Capture the parity screens
        if: steps.parity-tools.outcome == 'success'
        continue-on-error: true
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          ../tools/parity.sh target/release/preview ../parity

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-linux
          path: parity/
          if-no-files-found: ignore
