# The UI builds and its tests pass on Linux (AGENTS.md, Hit every surface: Platforms), and its
# screens are captured there. Running the browser needs a Linux engine, so this is the UI's library
# and the preview, which need none, and the browser's own library checked, not run.
name: UI on Linux

on:
  # Branches only: an engine release's tag, pushed with the owner's token, starts nothing here.
  push:
    branches: ['**']
    paths: [app/**, core/public/**, tools/headless.sh, tools/parity.sh, .github/workflows/app-linux.yml, '!**/*.md']
  pull_request:
    paths: [app/**, core/public/**, tools/headless.sh, tools/parity.sh, .github/workflows/app-linux.yml, '!**/*.md']
  # A branch's head whose last push skipped this, as a push runs it only when its own diff matched (#1834).
  workflow_dispatch:

# A branch's newer push cancels its older run. Main's runs, and pull requests', each get a group of
# their own, so none is cancelled, or replaced while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # A push to main whose tree a branch or a pull request already passed a job on skips that job,
  # saying which run passed it (#2198). Each job records the tree it passed on at its end.
  proven:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      fmt: ${{ steps.look.outputs.fmt }}
      test: ${{ steps.look.outputs.test }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/tree-proven.sh
          sparse-checkout-cone-mode: false
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          for job in fmt test; do
            echo "$job=$(.github/scripts/tree-proven.sh "app-linux-$job" "$TREE")" >> "$GITHUB_OUTPUT"
          done

  # rustfmt alone, on the files git tracks: `cargo fmt` would need the crates setup.sh downloads to
  # read the manifests, and its --all formats them too. The workflow's app/** filter starts it for
  # every Rust file and app/rustfmt.toml.
  fmt:
    needs: proven
    if: >-
      !cancelled() && !needs.proven.outputs.fmt &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: git ls-files -z 'app/*.rs' | xargs -0 rustfmt --check
      # std's Instant and SystemTime build for the web and panic there when read, so the library the
      # site's demo runs reads web_time's, which are std's off the web. Tests, and the browser's own
      # main.rs and the modules it declares, are left out: the demo builds none of them.
      - name: The demo's code reads web_time's clock
        working-directory: app
        run: |
          set -f
          skip=":!src/main.rs :!*tests.rs :!*/tests/*"
          for module in $(sed -nE 's/^mod ([a-z0-9_]+);/\1/p' src/main.rs); do
            skip="$skip :!src/$module.rs :!src/$module/*"
          done
          if git grep -nE '^use std::time::(\{[^}]*\b(Instant|SystemTime|UNIX_EPOCH)\b|(Instant|SystemTime|UNIX_EPOCH);)|^    time::(\{[^}]*\b(Instant|SystemTime|UNIX_EPOCH)\b|(Instant|SystemTime|UNIX_EPOCH)\b)' \
            -- 'src/*.rs' $skip; then
            echo "::error::Use web_time::{Instant, SystemTime, UNIX_EPOCH} for these, not std::time's."
            exit 1
          fi
      - uses: ./.github/actions/tree-proof
        with:
          job: app-linux-fmt

  test:
    needs: proven
    # A pull request from a branch here already ran on its push, or on a dispatch on its head.
    if: >-
      !cancelled() && !needs.proven.outputs.test &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # bindgen reads the core's header with libclang; GPUI's X11 window system links xcb and
      # xkbcommon, and loads Wayland's, fontconfig and Vulkan at run time.
      - name: Install tools
        uses: ./.github/actions/apt-install
        with:
          packages: libclang-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - run: rustup update stable --no-self-update

      # Every ref reads main's build cache, and main alone saves one: a copy saved by each
      # branch pushed main's out of the repository's 10 GB (#1969).
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: app-linux-${{ hashFiles('app/Cargo.lock', 'app/linux/Cargo.lock', 'app/setup.sh', 'app/patches/**', 'core/public/browser_core.h') }}
          restore-keys: app-linux-

      # Cargo rebuilds what's older than its inputs, and a cache saved after this checkout (another
      # branch's, while apt stalled) is newer than them all, so its bindings and builds of the core's
      # header and the app would pass as fresh (#2003). Our files are made newer than anything restored.
      - run: git ls-files -z . ../core/public | xargs -0 touch

      - run: ./setup.sh
      - run: cargo test --release --lib
      # libBrowser.so, the browser on Linux (linux/Cargo.toml): main.rs and platform/linux, which
      # neither the tests nor the preview compile. It names none of the engine's symbols until chrome
      # loads it, so a check needs no engine, and finds what wouldn't compile, such as a call to a
      # function main.rs builds on the Mac and Windows alone.
      - run: cargo check --release --manifest-path linux/Cargo.toml --target-dir target
      - run: cargo build --release --bin preview
      # The site's demo is the preview built for the web (demo.yml), which only a release builds, so
      # a change that breaks it is caught here. A check, not demo.yml's build: no LTO or wasm-bindgen.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check --release --target wasm32-unknown-unknown --bin preview
      # What follows decides nothing, so this tree has passed.
      - uses: ./.github/actions/tree-proof
        with:
          job: app-linux-test

      - if: ${{ steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The same screens on Wayland and X11, side by side, so text that fits on the Mac but not here
      # shows on every change to the app (tools/parity.sh). It only reports: nothing here fails the
      # job. lavapipe draws GPUI's Vulkan in software, as the runner has no GPU.
      - id: parity-tools
        continue-on-error: true
        uses: ./.github/actions/apt-install
        with:
          packages: sway grim xwayland imagemagick mesa-vulkan-drivers
          options: --no-install-recommends
      - name: Capture the parity screens
        if: steps.parity-tools.outcome == 'success'
        continue-on-error: true
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          ../tools/parity.sh target/release/preview ../parity

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-linux
          path: parity/
          if-no-files-found: ignore
