# Runs each CI job only for the paths it covers (.github/scripts/ci-changes.cjs), and ends in one
# Check that passes when every job passed or was rightly skipped, so Check is the one status a
# branch rule needs. Detection fails open: if the change can't be read, every job runs. Adapted
# from T3 Code (https://github.com/pingdotgg/t3code, MIT) at commit
# 570d4b03eef879bd60be3d74444046858c94dacd.
#
# Every job here runs on GitHub's runners. The self-hosted engine runner never takes a pull request.
name: CI

on:
  # Branches only: an engine release's tag, pushed with the owner's token, starts nothing here.
  push:
    branches: ['**']
  pull_request:

permissions: {}

# A pull request's run checks all of it, so a newer one replaces it. A push checks only what it
# added, so none is cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    # A pull request from a branch here already ran on its push.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      core_linux: ${{ steps.proven.outputs.core_linux }}
      app_linux: ${{ steps.detect.outputs.app_linux }}
      app_mac: ${{ steps.proven.outputs.app_mac }}
      engine_windows: ${{ steps.detect.outputs.engine_windows }}
    steps:
      # History without file contents, for the merge base, and only the files the decision reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/tree-proven.sh
            .github/scripts/ci-changes.cjs
            .github/actions/ci-changes/
            tools/core-same.sh
            tools/core-same-test.sh
            tools/nightly-commit.sh
            tools/nightly-commit-test.sh
            core/public/browser_core.h
          sparse-checkout-cone-mode: false

      # The comparison detect uses, and the engines use, proven on the core's header first.
      - run: tools/core-same-test.sh
      # And the night's commit, which the engines it's paired with decide (#2697).
      - run: tools/nightly-commit-test.sh

      - id: detect
        uses: ./.github/actions/ci-changes

      # A push to main whose tree a branch's push already passed a job on skips that job, saying
      # which run passed it (#2198). Check counts it as rightly skipped, as its output is false.
      - id: proven
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          TREE: ${{ github.event.head_commit.tree_id }}
          CORE_LINUX: ${{ steps.detect.outputs.core_linux }}
          APP_MAC: ${{ steps.detect.outputs.app_mac }}
        run: |
          for job in core_linux app_mac; do
            needed=$CORE_LINUX
            [ "$job" = core_linux ] || needed=$APP_MAC
            if [ "$MAIN" = true ] && [ "$needed" = true ] &&
              [ -n "$(.github/scripts/tree-proven.sh "ci-$job" "$TREE")" ]; then
              needed=false
            fi
            echo "$job=$needed" >> "$GITHUB_OUTPUT"
          done

  core_linux:
    name: Core on Linux
    needs: changes
    if: needs.changes.outputs.core_linux == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/core-linux.yml

  app_mac:
    name: UI on macOS
    needs: changes
    if: needs.changes.outputs.app_mac == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/app-mac.yml

  # To hook in app-linux.yml or engine-windows.yml: replace its push and pull_request triggers with
  # `on: workflow_call`, add a job like core_linux gated on needs.changes.outputs.app_linux (or
  # engine_windows), and add the job to Check's needs. The job's key must match its output's name.

  check:
    name: Check
    if: always() && needs.changes.result != 'skipped'
    needs: [changes, core_linux, app_mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # A job may skip only when `changes` said it wasn't needed.
          echo "$RESULTS" | jq -e '.changes.outputs as $gates
            | all(to_entries[];
                .value.result == "success"
                or (.value.result == "skipped" and $gates[.key] == "false"))' > /dev/null
