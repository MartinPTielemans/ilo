# The core's Mac compile, checked in minutes on GitHub's hosted Mac rather than in the next Mac
# engine build, a day later, where an error costs the build (#2668). Each finished Mac engine build
# packs what a compile of //browser_core reads besides the core and the SDK: the tree's and the
# build's headers, Chromium's clang and libc++, and the core's compile variables
# (engine/core_syntax.py). This takes the newest pack of pins.ini's Chromium major and runs clang
# -fsyntax-only, with the build's own flags, on each core file the engine compiled, as the branch
# has it. A .mm the branch adds, or a .cc outside platform/, is checked with the core's flags.
# The pack's headers are first brought from the engine patches its engine was built with to the
# branch's, so a core change that needs a new or changed patch is checked with it (#2747); one whose
# headers don't apply fails as needing an engine with that patch, not as a compile error.
# The pack holds the engine's generated headers, so its engine must have generated them from the
# core's .mojom and .proto files and its mojom() and proto_library() targets as the branch has them:
# the newest pack that did is taken, and with none the job fails as needing a newer pack, as it does
# for a patch that changes or drops what the engine generates from (#4347).
# Not checked: a file the branch adds in platform/, which may be another OS's, a BUILD.gn change to
# a target's flags or to a generator target other than those, and the link.
name: Core Mac syntax

on:
  push:
    # Main and the merge queue's branches were checked on the branch they came from.
    branches-ignore: [main, 'gh-readonly-queue/**']
    paths:
      - core/**
      - engine/core_syntax.py
      - engine/series
      - engine/patches/**
      - engine/pins.ini
      - .github/workflows/core-mac-syntax.yml
  # A push runs it only for commits new to the repo; this runs it on any ref.
  workflow_dispatch:

concurrency:
  group: core-mac-syntax-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      # The pack, from an Engine on macOS run.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            core
            engine/core_syntax.py
            engine/pins.ini
            engine/series
            engine/patches

      # The newest unexpired pack of pins.ini's major whose engine generated its headers from the
      # core's .mojom and .proto files, and core/BUILD.gn's mojom() and proto_library() targets, as
      # this branch has them, from a run of this repository's own engine-mac.yml, dispatched here.
      # Lines of work that changed them differently each need a pack of their own, so a newer pack
      # of another line is passed over (#4347). With packs but none that matches, or none whose
      # commit could be fetched to compare, the branch needs a newer one: the job fails saying so,
      # as a pass on the stale headers would mean nothing. Only when every Engine on macOS run was
      # looked at and none packed one is there nothing to check. A failed call fails the job.
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          version=$(git config -f engine/pins.ini chromium.version)
          major=${version%%.*}
          case $major in
            '' | *[!0-9]*)
              echo "::error::engine/pins.ini's chromium.version, '$version', names no Chromium major."
              exit 1
              ;;
          esac
          # The core's generator targets, as a commit's core/BUILD.gn has them: their options change
          # what the engine generates with no .mojom or .proto changed.
          targets() {
            git show "$1:core/BUILD.gn" | awk '
              /^[[:space:]]*(mojom|proto_library)\(/ { on = 1 }
              on { print; depth += gsub(/\{/, "{") - gsub(/\}/, "}"); if (depth <= 0 && /\}/) on = 0 }'
          }
          ours=$(targets HEAD)
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/engine-mac.yml/runs?per_page=100")
          total=$(jq .total_count <<<"$runs")
          listed=$(jq '.workflow_runs | length' <<<"$runs")
          ids=$(jq -r '
            .workflow_runs[]
            | select(.path == ".github/workflows/engine-mac.yml" and .event == "workflow_dispatch"
                and .head_repository.full_name == $ENV.GITHUB_REPOSITORY)
            | .id' <<<"$runs")
          newest='' newest_sha='' newest_changes='' unfetched=''
          for id in $ids; do
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100")
            name=$(jq -r --arg prefix "engine-mac-core-$major." '
              .artifacts[] | select((.expired | not) and (.name | startswith($prefix))) | .name' \
              <<<"$artifacts" | tail -1)
            [ -n "$name" ] || continue
            sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .head_sha)
            # Its commit's trees alone, which the diff of names needs.
            git fetch -q --depth=1 --filter=blob:none --no-tags origin "$sha" || {
              unfetched="$unfetched $id"
              continue
            }
            # What the engine generates the core's headers from. Other BUILD.gn changes aren't
            # among them: a branch that adds a file changes it, and the check takes an added file
            # with the core's flags.
            names=$(git diff --no-renames --name-only "$sha" HEAD -- core)
            changes=$(grep -E '\.(mojom|proto|pdl|idl|json5)$' <<<"$names" || true)
            built=$(targets "$sha")
            [ "$built" = "$ours" ] ||
              changes=$(printf '%s\n' "$changes" "core/BUILD.gn's generator targets" | grep -v '^$')
            if [ -z "$changes" ]; then
              printf 'run=%s\nname=%s\nsha=%s\n' "$id" "$name" "$sha" >> "$GITHUB_OUTPUT"
              echo "Checking against run $id's $name, built at $sha." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [ -n "$newest" ] || { newest=$id newest_sha=$sha newest_changes=$(paste -sd ',' - <<<"$changes" | sed 's/,/, /g'); }
          done
          if [ -n "$newest" ]; then
            gap="This branch's core needs a newer pack: since run $newest's, built at $newest_sha, it changes $newest_changes, and no Engine on macOS run has packed headers generated from them as this branch has them. So the core can't be checked here until an Engine on macOS run on a commit with them finishes."
          elif [ -n "$unfetched" ]; then
            gap="Engine on macOS runs$unfetched packed the core's headers for Chromium $major, but their commits couldn't be fetched to compare with this branch's core, so it can't be checked here."
          elif [ "$listed" -lt "$total" ]; then
            gap="None of the newest $listed of $total Engine on macOS runs packed the core's headers for Chromium $major, and older ones aren't looked at, so this branch's core can't be checked here until an Engine on macOS run finishes."
          else
            echo "::notice::No Engine on macOS run has packed the core's headers for Chromium $major yet, so nothing is checked."
            exit 0
          fi
          echo "::error::$gap"
          echo "$gap" >> "$GITHUB_STEP_SUMMARY"
          exit 3
      - if: steps.find.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.find.outputs.name }}
          path: ${{ runner.temp }}/pack
          run-id: ${{ steps.find.outputs.run }}
          github-token: ${{ github.token }}

      # The engine patches the pack's engine was built with: its run's commit's series and patches.
      - if: steps.find.outputs.run != ''
        name: The engine's patches
        env:
          SHA: ${{ steps.find.outputs.sha }}
        run: |
          git fetch -q --depth=1 --no-tags origin "$SHA"
          mkdir -p "$RUNNER_TEMP/built"
          git archive "$SHA" engine/series engine/patches | tar -xf - -C "$RUNNER_TEMP/built"

      # Each error also shows on the commit as an annotation at its line.
      - if: steps.find.outputs.run != ''
        name: Check
        run: |
          zstd -dc "$RUNNER_TEMP/pack/core-syntax.tar.zst" | tar -xf - -C "$RUNNER_TEMP/pack"
          # The Xcode whose SDK the engine built with, where the runner has it.
          sdk=$(grep -m1 -oE 'MacOSX[0-9.]+\.sdk' "$RUNNER_TEMP/pack/src/out/Release/obj/browser_core/browser_core.ninja")
          sdk=${sdk#MacOSX}
          sdk=${sdk%.sdk}
          [ ! -d "/Applications/Xcode_$sdk.app" ] || sudo xcode-select --switch "/Applications/Xcode_$sdk.app"
          python3 engine/core_syntax.py check "$RUNNER_TEMP/pack" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/built/engine"
