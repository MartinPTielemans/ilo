# The core's Mac compile, checked in minutes on GitHub's hosted Mac rather than in the next Mac
# engine build, a day later, where an error costs the build (#2668). Each finished Mac engine build
# packs what a compile of //browser_core reads besides the core and the SDK: the tree's and the
# build's headers, Chromium's clang and libc++, and the core's compile variables
# (engine/core_syntax.py). This takes the newest pack of pins.ini's Chromium major and runs clang
# -fsyntax-only, with the build's own flags, on each core file the engine compiled, as the branch
# has it. A .mm the branch adds, or a .cc outside platform/, is checked with the core's flags.
# The pack's headers are first brought from the engine patches its engine was built with to the
# branch's, so a core change that needs a new or changed patch is checked with it (#2747); one whose
# headers don't apply fails as needing an engine with that patch, not as a compile error.
# The pack holds the engine's generated headers, so its engine must have generated them from the
# core's .mojom and .proto files as the branch has them: the newest pack that did is taken, and with
# none the job fails as needing a newer pack, as it does for a patch that changes what the engine
# generates from (#4347).
# Not checked: a file the branch adds in platform/, which may be another OS's, a BUILD.gn change to
# a target's flags, and the link.
name: Core Mac syntax

on:
  push:
    # Main and the merge queue's branches were checked on the branch they came from.
    branches-ignore: [main, 'gh-readonly-queue/**']
    paths:
      - core/**
      - engine/core_syntax.py
      - engine/series
      - engine/patches/**
      - .github/workflows/core-mac-syntax.yml
  # A push runs it only for commits new to the repo; this runs it on any ref.
  workflow_dispatch:

concurrency:
  group: core-mac-syntax-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      # The pack, from an Engine on macOS run.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            core
            engine/core_syntax.py
            engine/pins.ini
            engine/series
            engine/patches

      # The newest unexpired pack of pins.ini's major whose engine generated its headers from the
      # core's .mojom and .proto files as this branch has them, from a run of this repository's own
      # engine-mac.yml, dispatched here. Lines of work that changed them differently each need a
      # pack of their own, so a newer pack of another line is passed over (#4347). With packs but
      # none that matches, the branch needs a newer one: the job fails saying so, as a pass on the
      # stale headers would mean nothing. None yet means no Mac engine has been built since the
      # packs began: nothing to check.
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(git config -f engine/pins.ini chromium.version)
          major=${version%%.*}
          newest='' newest_sha='' newest_changes=''
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/engine-mac.yml/runs?per_page=30" --jq '
            .workflow_runs[]
            | select(.path == ".github/workflows/engine-mac.yml" and .event == "workflow_dispatch"
                and .head_repository.full_name == $ENV.GITHUB_REPOSITORY)
            | .id'); do
            name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" --jq \
              ".artifacts[] | select((.expired | not) and (.name | startswith(\"engine-mac-core-$major.\"))) | .name" | tail -1)
            [ -n "$name" ] || continue
            sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .head_sha)
            # Its commit's trees alone, which the diff of names needs.
            git fetch -q --depth=1 --filter=blob:none --no-tags origin "$sha" || continue
            # What the engine generates the core's headers from, as core_syntax.py's GENERATES has
            # it. BUILD.gn isn't among them: a branch that adds a file changes it, and the check
            # takes an added file with the core's flags.
            changes=$(git diff --no-renames --name-only "$sha" HEAD -- core | grep -E '\.(mojom|proto|pdl|idl|json5)$' || true)
            if [ -z "$changes" ]; then
              printf 'run=%s\nname=%s\nsha=%s\n' "$id" "$name" "$sha" >> "$GITHUB_OUTPUT"
              echo "Checking against run $id's $name, built at $sha." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [ -n "$newest" ] || { newest=$id newest_sha=$sha newest_changes=$(echo "$changes" | paste -sd ' ' -); }
          done
          if [ -n "$newest" ]; then
            gap="This branch's core needs a newer pack: since run $newest's, built at $newest_sha, it changes $newest_changes, and no Engine on macOS run has packed headers generated from them as this branch has them. So the core can't be checked here until an Engine on macOS run on a commit with them finishes."
            echo "::error::$gap"
            echo "$gap" >> "$GITHUB_STEP_SUMMARY"
            exit 3
          fi
          echo "::notice::No Engine on macOS run has packed the core's headers for Chromium $major yet, so nothing is checked."
      - if: steps.find.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.find.outputs.name }}
          path: ${{ runner.temp }}/pack
          run-id: ${{ steps.find.outputs.run }}
          github-token: ${{ github.token }}

      # The engine patches the pack's engine was built with: its run's commit's series and patches.
      - if: steps.find.outputs.run != ''
        name: The engine's patches
        env:
          SHA: ${{ steps.find.outputs.sha }}
        run: |
          git fetch -q --depth=1 --no-tags origin "$SHA"
          mkdir -p "$RUNNER_TEMP/built"
          git archive "$SHA" engine/series engine/patches | tar -xf - -C "$RUNNER_TEMP/built"

      # Each error also shows on the commit as an annotation at its line.
      - if: steps.find.outputs.run != ''
        name: Check
        run: |
          zstd -dc "$RUNNER_TEMP/pack/core-syntax.tar.zst" | tar -xf - -C "$RUNNER_TEMP/pack"
          # The Xcode whose SDK the engine built with, where the runner has it.
          sdk=$(grep -m1 -oE 'MacOSX[0-9.]+\.sdk' "$RUNNER_TEMP/pack/src/out/Release/obj/browser_core/browser_core.ninja")
          sdk=${sdk#MacOSX}
          sdk=${sdk%.sdk}
          [ ! -d "/Applications/Xcode_$sdk.app" ] || sudo xcode-select --switch "/Applications/Xcode_$sdk.app"
          python3 engine/core_syntax.py check "$RUNNER_TEMP/pack" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/built/engine"
