# The browser on Linux, run and checked by app/check.sh (AGENTS.md, Verifying) under Xvfb and
# openbox, on X11, or by hand in a headless sway session on its Xwayland, or under Xvfb and KWin,
# whose blur shows under the overlays (#2134), then in sway's session on Wayland, and by
# app/check/drops.sh under Wayland, on the Linux engine built from this commit's
# core: the safety net for what the Mac and Linux share. It runs on main each night and by hand,
# which the integrator does on main after each merge train (#871), on GitHub's hosted runners: never
# a pull request, and never the self-hosted runner, which builds the engine. It never builds an
# engine: it takes the newest engine-linux release in this commit's history (engine/fetch.sh), and a
# commit whose core/public/browser_core.h no published engine has fails, saying so, as nothing can
# run it, and is checked the night after one is. Each session's runs are a job of their own, split
# into shards when they're long, side by side, and the check job gathers them: every run in
# app/check/ shows in X11's summary: passed, failed, or skipped and why, with the lines a run that
# passed skipped; Wayland's lists those it did. A failure on main opens an issue, which the next run
# that passes closes (.github/scripts/main-check.sh).
name: Check on Linux

on:
  # 03:23 UTC, before Windows' and the Mac's, which wait for their nightly engines.
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: The runs to do, such as "load tabs drops", or "all"; empty for the ones Linux passes
        default: ''
      session:
        description: >-
          Where check.sh runs the app: on X11 under Xvfb or sway's Xwayland, or under Xvfb and KWin,
          which blurs, then on Wayland with no runs named, or on Wayland alone
        type: choice
        options: [xvfb, sway, kwin, wayland]
        default: xvfb
      rebuild:
        description: Build the app, even if a check of this commit kept one
        type: boolean
        default: false
      trace:
        description: >-
          The trace categories for tabs and perf's traced switches (app/check/lib.sh), such as
          #2377's, latency among them; empty for latency alone in tabs and no traced switches
        default: ''

concurrency:
  group: check-linux-${{ github.ref }}
  # Main's run in progress finishes, and while it runs a newer dispatch's or the night's pending run
  # replaces the older pending one; a branch's newer dispatch cancels its older run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The runs that pass on X11 so far.
  LINUX_RUNS: >-
    tabs window find agents spaces crash profiles private blank quit mcp appearance access history
    load preview import adblock adblock-lists adblock-cosmetic adblock-page passkeys onboarding links relaunch
    split extensions capture popup pinned about windows dialogs trouble cards passwords updates
    restore favorites keys clear media store adblock-live widevine sync sync-account sync-devices
    sync-extensions little devices pair notifications calls battery battery-os idle handback
    update-checks shots
    webrtc tab-drag count ranking everyday hosts policies translate pictures boosts rules
    switch-frames foot-bar later-launch peek-motion safe-start
  # The runs that pass on Wayland so far, in the headless sway session.
  WAYLAND_RUNS: >-
    load keys tabs popup history spaces agents profiles restore relaunch find pinned clear split
    favorites cards extensions adblock adblock-lists adblock-cosmetic adblock-page private little capture
    passwords preview access dialogs crash import quit onboarding passkeys appearance about
    sync sync-account sync-devices sync-extensions
    devices pair hosts handback store adblock-live widevine updates update-checks shots tab-drag count
    blank mcp trouble ranking policies calls battery battery-os idle webrtc translate everyday
    window windows
    media pictures boosts links notifications switch-frames foot-bar peek-motion rules later-launch
    safe-start
  # The runs that don't apply to Linux, a line each with why, which the summary gives. They're
  # skipped even when named.
  LINUX_SKIPS: |
    keychain: it checks the Mac's Keychain across a change of signing identity, in a check VM
    scripting: AppleScript is the Mac's alone
    filled: it hides the Dock and the menu bar, so it runs only in a Mac check VM
    sidebar-right: it checks AppKit's window buttons, the Mac's alone

jobs:
  # Whether to check this commit: a scheduled run, in ilo itself and not a fork, checks only a commit
  # no run has checked yet; a dispatched one always does. And the legs that check it.
  gate:
    if: github.event_name != 'schedule' || github.repository == 'MartinPTielemans/ilo'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      check: ${{ github.event_name != 'schedule' || steps.seen.outputs.seen != 'true' }}
      legs: ${{ steps.plan.outputs.legs }}
      all: ${{ steps.plan.outputs.all }}
    steps:
      - uses: actions/checkout@v4
      - id: seen
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/main-check.sh seen
      # A leg for each session's runs, in check.sh's order, those that apply to Linux. The full set
      # of a session is dealt round its shards, so each takes about 13 min of runs (42210352224's
      # 40 min on X11 and 20 on Wayland, after a 7 min build). One leg does drops.sh and ime.sh.
      - id: plan
        env:
          RUNS: ${{ inputs.runs }}
          SESSION: ${{ inputs.session || 'xvfb' }}
        run: |
          # check.sh's own list, the runs it does with no names and the ones it does only when named.
          all=$(sh app/check.sh --runs)
          # X11's runs, then Wayland's, unless runs are named or Wayland's alone are asked for.
          case $SESSION in
          wayland) sessions=wayland ;;
          *) sessions=$SESSION; [ -n "$RUNS" ] || sessions="$SESSION wayland" ;;
          esac
          legs=
          for session in $sessions; do
            passing=$LINUX_RUNS
            [ "$session" != wayland ] || passing=$WAYLAND_RUNS
            case $RUNS in
            '') runs=$passing ;;
            all) runs=$all ;;
            *) runs=$RUNS ;;
            esac
            todo=
            for run in $all; do
              case " $runs " in *" $run "*) ;; *) continue ;; esac
              ! printf '%s\n' "$LINUX_SKIPS" | grep -q "^$run: " || continue
              todo="$todo $run"
            done
            of=1
            case $RUNS in ''|all) of=3; [ "$session" != wayland ] || of=2 ;; esac
            for shard in $(seq "$of"); do
              mine= i=0
              for run in $todo; do
                [ $((i % of + 1)) != "$shard" ] || mine="$mine $run"
                i=$((i + 1))
              done
              legs="$legs$(jq -cn --arg session "$session" --argjson shard "$shard" --argjson of "$of" \
                --arg runs "${mine# }" '{$session, $shard, $of, $runs}'),"
            done
          done
          case $RUNS in ''|all|*drops*|*ime*) legs="$legs"'{"session":"ime","shard":1,"of":1,"runs":""},' ;; esac
          echo "legs=[${legs%,}]" | tee -a "$GITHUB_OUTPUT"
          echo "all=$all" >> "$GITHUB_OUTPUT"

  # The app, built once for every leg, or taken from another check of this commit, which kept it for
  # 3 days (app-artifact.sh, #2199).
  build:
    needs: gate
    if: needs.gate.outputs.check == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    # The run that has the app, none when there's no engine to build it on.
    outputs:
      run: ${{ steps.kept.outputs.run || (steps.upload.outcome == 'success' && github.run_id) || '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The shards' Engine step says why when there's none.
      - id: engine
        run: |
          status=0
          ../engine/fetch.sh > /dev/null || status=$?
          case $status in
          0) echo "found=true" >> "$GITHUB_OUTPUT" ;;
          2) ;;
          *) exit "$status" ;;
          esac
      - id: kept
        if: ${{ steps.engine.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          run=
          [ "$REBUILD" = true ] || run=$(../.github/scripts/app-artifact.sh find "app-linux-$GITHUB_SHA")
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
      # bindgen reads the core's header with libclang, and GPUI links fontconfig, Wayland, xcb and
      # xkbcommon.
      - if: ${{ steps.engine.outputs.found == 'true' && steps.kept.outputs.run == '' }}
        uses: ./.github/actions/apt-install
        with:
          packages: libclang-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      # Every ref reads main's build cache, and main alone saves one: a copy saved by each
      # branch pushed main's out of the repository's 10 GB (#1969).
      - id: cache
        if: ${{ steps.engine.outputs.found == 'true' && steps.kept.outputs.run == '' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: check-linux-${{ hashFiles('app/Cargo.lock', 'app/linux/Cargo.lock', 'app/setup.sh', 'app/patches/**') }}
          restore-keys: |
            check-linux-
            app-linux-
      - id: build
        if: ${{ steps.engine.outputs.found == 'true' && steps.kept.outputs.run == '' }}
        run: rustup update stable --no-self-update && ./setup.sh && ./build.sh
      - if: ${{ steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - if: ${{ steps.build.outcome == 'success' }}
        run: ../.github/scripts/app-artifact.sh pack "$(../engine/fetch.sh)" "$RUNNER_TEMP/app.tar"
      - id: upload
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-linux-${{ github.sha }}
          path: ${{ runner.temp }}/app.tar
          retention-days: 3
          overwrite: true

  shards:
    needs: [gate, build]
    if: needs.gate.outputs.check == 'true'
    name: check ${{ matrix.session }}${{ matrix.of > 1 && format(' {0}/{1}', matrix.shard, matrix.of) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.legs) }}
    runs-on: ubuntu-24.04
    # A shard of the full set takes about 20 min; runs named, such as "all", may take far longer.
    timeout-minutes: 180
    permissions:
      contents: read
      # A re-run reads the run's earlier attempts (main-check.sh rerun).
      actions: read
    # Every leg finds the same engine, or none.
    outputs:
      found: ${{ steps.engine.outputs.found }}
      why: ${{ steps.engine.outputs.why }}
    defaults:
      run:
        working-directory: app
    steps:
      # With the history, where fetch.sh looks for the engine's commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A re-run's pass would show over the failure of the attempt before it.
      - if: ${{ github.run_attempt != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../.github/scripts/main-check.sh rerun

      # With no engine the leg checks nothing and passes; the check job fails, saying why, once.
      - id: engine
        name: Engine
        run: |
          status=0
          ../engine/fetch.sh > /dev/null 2> "$RUNNER_TEMP/fetch.log" || status=$?
          cat "$RUNNER_TEMP/fetch.log" >&2
          case $status in
          0) echo "found=true" >> "$GITHUB_OUTPUT" ;;
          2)
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "why=$(tail -1 "$RUNNER_TEMP/fetch.log")" >> "$GITHUB_OUTPUT"
            ;;
          *) exit "$status" ;;
          esac

      # bindgen reads the core's header with libclang; GPUI links xcb and xkbcommon, and draws with
      # Vulkan, which the GPU-less runner has in Mesa's software driver, lavapipe. check.sh runs
      # the app under Xvfb and openbox (BROWSER_XVFB), parks Xvfb's pointer with xdotool, captures
      # it with ImageMagick's import and reads pixels with ImageMagick, whose `magick` Ubuntu's 6.9
      # calls `convert`, and records it with ffmpeg (tools/window-record.sh). sway, grim and Xwayland
      # run the headless sessions (tools/headless.sh), and wl-clipboard's wl-paste reads their
      # clipboard (check/lib.sh's clipboard_holds). The access run reads the app's tree over
      # AT-SPI, on buses of its own from dbus-daemon and at-spi2-core, and the notifications and mcp runs'
      # notification server is python3-gi's, on a bus of its own. check/ime.sh types through
      # fcitx5, with check/vkbd's keyboard, whose keymap xkbcli makes, and Korean through
      # fcitx5-hangul, drawn in its captures with fonts-nanum's Hangul.
      # Ubuntu's AppArmor denies Chromium's sandbox the user namespaces it needs, so the runner
      # allows them, and the sandbox stays on.
      # The packages come from the Actions cache, and from the mirror only on a miss (#1969), in
      # each leg.
      - if: ${{ steps.engine.outputs.found == 'true' }}
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libclang-dev libfontconfig-dev libwayland-dev
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 mesa-vulkan-drivers libegl1
            libgl1-mesa-dri xvfb xauth openbox imagemagick xdotool xclip ffmpeg sway grim xwayland
            dbus-daemon at-spi2-core fcitx5 fcitx5-hangul fonts-nanum libxkbcommon-tools wl-clipboard python3-gi

      - if: ${{ steps.engine.outputs.found == 'true' }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # The runner has no sound card, so a page's audio would fail to open ALSA's default, which
          # ALSA reports on the shared standard error in pieces, and a browser: line written between
          # them is lost to a check's wait (#2734). Its null device opens and plays to nothing.
          printf 'pcm.!default { type null }\n' > ~/.asoundrc
          rustup update stable --no-self-update
          mkdir -p "$RUNNER_TEMP/bin"
          # ImageMagick 6 has a tool for each of 7's magick subcommands, such as headless.sh's
          # magick compare, and convert for the rest.
          printf '#!/bin/sh\ncase $1 in compare|montage|identify) tool=$1; shift; exec "$tool" "$@" ;; esac\nexec convert "$@"\n' \
            > "$RUNNER_TEMP/bin/magick"
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # KWin's session, the only one whose compositor blurs (check.sh's BROWSER_XVFB=kwin), which
      # xprop sees is ready and dbus-run-session gives its bus.
      - if: ${{ steps.engine.outputs.found == 'true' && matrix.session == 'kwin' }}
        uses: ./.github/actions/apt-install
        with:
          packages: kwin-x11 x11-utils dbus-bin

      # The updates run builds ilo's Flatpak (tools/flatpak.sh) and updates it through Flatpak's
      # portal and permission store, which only it needs. The leg's runs alone decide, so main's
      # nightly check, which names no runs, installs them too; before, updates skipped there as passed.
      - if: ${{ steps.engine.outputs.found == 'true' && contains(format(' {0} ', matrix.runs), ' updates ') }}
        uses: ./.github/actions/apt-install
        with:
          packages: flatpak flatpak-builder ostree xdg-desktop-portal

      # The build job's app, unless this leg compiles for itself: the ime leg's drops.sh and ime.sh
      # build their tools into target/, and a named updates or nightly run builds the app again.
      - id: own
        if: ${{ steps.engine.outputs.found == 'true' }}
        env:
          SESSION: ${{ matrix.session }}
          RUNS: ${{ matrix.runs }}
          NAMED: ${{ inputs.runs }}
        run: |
          own=
          case " $SESSION $RUNS " in *" ime "* | *" nightly "*) own=true ;; esac
          case " $RUNS " in *" updates "*) [ -z "$NAMED" ] || own=true ;; esac
          echo "own=$own" | tee -a "$GITHUB_OUTPUT"
      - if: ${{ steps.engine.outputs.found == 'true' && steps.own.outputs.own != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: app-linux-${{ github.sha }}
          path: ${{ runner.temp }}/app
          run-id: ${{ needs.build.outputs.run }}
          github-token: ${{ github.token }}
      - if: ${{ steps.engine.outputs.found == 'true' && steps.own.outputs.own != 'true' }}
        run: ../.github/scripts/app-artifact.sh unpack "$(../engine/fetch.sh)" "$RUNNER_TEMP/app/app.tar"

      # main's build cache, which the build job saves.
      - id: cache
        if: ${{ steps.own.outputs.own == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: check-linux-${{ hashFiles('app/Cargo.lock', 'app/linux/Cargo.lock', 'app/setup.sh', 'app/patches/**') }}
          restore-keys: |
            check-linux-
            app-linux-

      - if: ${{ steps.own.outputs.own == 'true' }}
        run: ./setup.sh && ./build.sh

      # The sync-account, sync-devices, sync-extensions and sync-versions runs sign in to an
      # ilo-server of their own, on SQLite with a throwaway account, never the hosted one: built from
      # the server's repo at the commit ilo's sync was last checked against, in the leg that has them.
      - id: server
        if: ${{ steps.engine.outputs.found == 'true' && (contains(format(' {0} ', matrix.runs), ' sync-account ') || contains(format(' {0} ', matrix.runs), ' sync-devices ') || contains(format(' {0} ', matrix.runs), ' sync-extensions ') || contains(format(' {0} ', matrix.runs), ' sync-versions ')) }}
        uses: actions/checkout@v4
        with:
          repository: MartinPTielemans/ilo-server
          ref: 882f2736e5a3b228543ae33b821aeeb52f80426d
          path: app/.deps/ilo-server

      # Main alone saves, as for the build cache above (#1969).
      - id: server-cache
        if: ${{ steps.server.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: app/.deps/ilo-server/target
          key: ilo-server-882f2736e5a3b228543ae33b821aeeb52f80426d

      - if: ${{ steps.server.outcome == 'success' }}
        working-directory: app/.deps/ilo-server
        run: |
          cargo build --release --locked
          echo "ILO_SERVER=$PWD/target/release/ilo-server" >> "$GITHUB_ENV"

      - if: ${{ steps.server-cache.outcome == 'success' && steps.server-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: app/.deps/ilo-server/target
          key: ilo-server-882f2736e5a3b228543ae33b821aeeb52f80426d

      # The sync-versions run syncs with an older ilo, the release ILO_OLD names, as its users
      # have it: ilo's Flatpak, installed from the release's bundle, which runs in bubblewrap's
      # user namespaces as Chromium's sandbox does.
      - if: ${{ steps.engine.outputs.found == 'true' && contains(format(' {0} ', matrix.runs), ' sync-versions ') }}
        uses: ./.github/actions/apt-install
        with:
          packages: flatpak
      - if: ${{ steps.engine.outputs.found == 'true' && contains(format(' {0} ', matrix.runs), ' sync-versions ') }}
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: 0.1.12
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          dir=$(mktemp -d)
          gh release download "v$OLD" -R "$GITHUB_REPOSITORY" -p ilo-linux-x86_64.flatpak -D "$dir"
          flatpak install --user -y --noninteractive "$dir/ilo-linux-x86_64.flatpak"
          flatpak info --user app.ilo.browser
          echo "ILO_OLD=$OLD" >> "$GITHUB_ENV"

      # The devices run grants a HID device, a fake one the kernel's uhid makes (check/uhid.py),
      # which stays plugged in for the job: in the leg that has it.
      - if: ${{ steps.engine.outputs.found == 'true' && contains(format(' {0} ', matrix.runs), ' devices ') }}
        run: |
          sudo modprobe uhid
          sudo setsid nohup python3 check/uhid.py > "$RUNNER_TEMP/uhid.log" 2>&1 &
          for _ in $(seq 100); do
            grep -q '^/dev/hidraw' "$RUNNER_TEMP/uhid.log" && break
            sleep 0.1
          done
          cat "$RUNNER_TEMP/uhid.log"
          grep -q '^/dev/hidraw' "$RUNNER_TEMP/uhid.log"
          echo "BROWSER_CHECK_HID=ilo check HID" >> "$GITHUB_ENV"

      # Each run alone, so one failing doesn't hide the rest, and each keeps its own build/check. A
      # run's result goes in the leg's results for the check job, which fails on it: the leg fails
      # only when it couldn't finish.
      - name: Runs
        if: ${{ steps.engine.outputs.found == 'true' && matrix.session != 'ime' }}
        env:
          SESSION: ${{ matrix.session }}
          RUNS: ${{ matrix.runs }}
          RESULTS: ${{ runner.temp }}/results/${{ matrix.session }}-${{ matrix.shard }}.tsv
          CHECK_TRACE_CATEGORIES: ${{ inputs.trace }}
          # The runner's C.UTF-8 names no country, for which Chromium's search engines leave out
          # DuckDuckGo, the one the core picks, so the command bar would offer no search.
          LANG: en_US.UTF-8
        run: |
          out=$RUNNER_TEMP/check
          mkdir -p "$out" "$(dirname "$RESULTS")"
          XDG_RUNTIME_DIR=$(mktemp -d)
          export XDG_RUNTIME_DIR
          where=
          case $SESSION in
          xvfb) export BROWSER_XVFB=1 ;;
          kwin) export BROWSER_XVFB=kwin ;;
          wayland) export BROWSER_WAYLAND=1; where=wayland/ ;;
          esac
          dir=$out/$where
          mkdir -p "$dir"
          for run in $RUNS; do
            start=$SECONDS
            status=0
            # The updates run builds a Flatpak first, and perf measures Chrome beside the app.
            limit=20m
            [ "$run" != updates ] || limit=45m
            [ "$run" != perf ] || limit=40m
            timeout "$limit" ./check.sh "$run" > "$dir/$run.log" 2>&1 || status=$?
            [ ! -d build/check ] || mv build/check "$dir/$run"
            pkill -9 -f "$PWD/build/Browser/" || true
            # A run that passes may have skipped steps, or all of itself, such as when the app
            # wasn't the active one.
            skipped=$(grep '^skip: ' "$dir/$run.log" | cut -c7- | tr '|\t\n' '/ ;' | sed 's/;$//')
            # A run that skips all of itself, as one whose build lacks what it checks, says why on a
            # "skip all: " line, and its row says skip, so nobody reads it as a pass (#2284).
            whole=$(grep -m1 '^skip all: ' "$dir/$run.log" | cut -c11- | tr '|\t' '/ ') || true
            if [ "$status" = 0 ] && [ -n "$whole" ]; then
              result="skip: $whole"
            elif [ "$status" = 0 ]; then
              result="passed in $((SECONDS - start)) s${skipped:+, skipping: $skipped}"
            else
              result="failed ($status): $(grep -m1 '^FAIL' "$dir/$run.log" | cut -c7- | tr '|\t' '/ ')"
              echo "::warning::The $run run failed on $SESSION. Its log: $where$run.log in the artifact."
            fi
            printf '%s\t%s\n' "$run" "$result" >> "$RESULTS"
            echo "| $run | $result |"
          done

      # Drags from other apps under Wayland, which check.sh's driver, X11's, can't make.
      - if: ${{ !cancelled() && steps.engine.outputs.found == 'true' && matrix.session == 'ime' && (inputs.runs == '' || inputs.runs == 'all' || contains(inputs.runs, 'drops')) }}
        env:
          RESULTS: ${{ runner.temp }}/results/ime-1.tsv
          LANG: en_US.UTF-8
        run: |
          out=$RUNNER_TEMP/check
          mkdir -p "$out" "$(dirname "$RESULTS")"
          XDG_RUNTIME_DIR=$(mktemp -d)
          export XDG_RUNTIME_DIR
          status=0
          timeout 10m check/drops.sh > "$out/drops.log" 2>&1 || status=$?
          [ ! -d build/check/drops ] || mv build/check/drops "$out/drops"
          pkill -9 -f "$PWD/build/Browser/" || true
          result=passed
          if [ "$status" != 0 ]; then
            result="failed ($status): $(grep -m1 '^FAIL' "$out/drops.log" | cut -c7- | tr '|\t' '/ ')"
            echo "::warning::Drops under Wayland failed. Its log: drops.log in the artifact."
          fi
          printf 'drops\t%s\n' "$result" | tee -a "$RESULTS"

      # Typing through an input method, fcitx5, on Wayland and on sway's Xwayland, which check.sh's
      # driver, typing plain keys, can't.
      - if: ${{ !cancelled() && steps.engine.outputs.found == 'true' && matrix.session == 'ime' && (inputs.runs == '' || inputs.runs == 'all' || contains(inputs.runs, 'ime')) }}
        env:
          RESULTS: ${{ runner.temp }}/results/ime-1.tsv
          LANG: en_US.UTF-8
        run: |
          out=$RUNNER_TEMP/check
          mkdir -p "$out" "$(dirname "$RESULTS")"
          XDG_RUNTIME_DIR=$(mktemp -d)
          export XDG_RUNTIME_DIR
          status=0
          timeout 10m check/ime.sh > "$out/ime.log" 2>&1 || status=$?
          [ ! -d build/check/ime ] || mv build/check/ime "$out/ime"
          pkill -9 -f "$PWD/build/Browser/" || true
          result=passed
          if [ "$status" != 0 ]; then
            result="failed ($status): $(grep -m1 '^FAIL' "$out/ime.log" | cut -c6- | tr '|\t' '/ ')"
            echo "::warning::Input methods failed. Its log: ime.log in the artifact."
          fi
          printf 'ime\t%s\n' "$result" | tee -a "$RESULTS"

      # A run that failed and left Crashpad's dump in its folder (check/lib.sh) crashed, and the dump's
      # frames in the app can be named only from this build's libBrowser.so, which the job throws
      # away (#2223): its symbol table goes in the leg's artifact then, and only then.
      - name: Symbols
        if: ${{ !cancelled() && steps.engine.outputs.found == 'true' }}
        env:
          SESSION: ${{ matrix.session }}
          RESULTS: ${{ runner.temp }}/results/${{ matrix.session }}-${{ matrix.shard }}.tsv
        run: |
          out=$RUNNER_TEMP/check
          where=
          [ "$SESSION" != wayland ] || where=wayland/
          crashed=
          if [ -f "$RESULTS" ]; then
            while IFS="$(printf '\t')" read -r run result; do
              case $result in failed*) ;; *) continue ;; esac
              ! find "$out/$where$run" -name '*.dmp' 2> /dev/null | grep -q . || crashed="$crashed $run"
            done < "$RESULTS"
          fi
          [ -n "$crashed" ] || { echo "No run crashed, so no symbols are kept."; exit 0; }
          mkdir -p "$out/symbols"
          objcopy --only-keep-debug build/Browser/libBrowser.so "$out/symbols/libBrowser.so.debug"
          id=$(readelf -n build/Browser/libBrowser.so | sed -n 's/^ *Build ID: //p')
          echo "::warning::$crashed crashed: libBrowser.so's symbols, build id $id, are in symbols/ in the artifact. addr2line -f -C -e libBrowser.so.debug names a frame's offset."

      # The check job puts the legs' files back together as one check-linux artifact.
      - if: ${{ always() && steps.engine.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: check-linux-${{ matrix.session }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/check
          if-no-files-found: ignore

      - if: ${{ always() && steps.engine.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.session }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore

  # The verdict, from the legs' results: the summary, the errors and the artifact a single job had,
  # under its name, which main-check.sh's seen and rerun read.
  check:
    needs: [gate, shards]
    if: ${{ always() && needs.gate.outputs.check == 'true' }}
    # Named apart when it does other runs than the default ones, so it's no verdict on the commit.
    name: ${{ (inputs.runs != '' || inputs.session == 'sway' || inputs.session == 'kwin' || inputs.session == 'wayland') && 'check (runs asked for)' || 'check' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # A re-run reads the run's earlier attempts (main-check.sh rerun).
      actions: read
    outputs:
      found: ${{ steps.engine.outputs.found }}
    steps:
      # With app/check, whose quarantine.linux the verdict reads.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            app/check

      - if: ${{ github.run_attempt != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/main-check.sh rerun

      # A run with no engine checks nothing, so it fails rather than pass, and the night after takes
      # it as not checked (main-check.sh seen), as the Mac's does (#1563).
      - id: engine
        name: Engine
        env:
          FOUND: ${{ needs.shards.outputs.found }}
          WHY: ${{ needs.shards.outputs.why }}
        run: |
          case $FOUND in
          true) echo "found=true" >> "$GITHUB_OUTPUT" ;;
          false)
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::error::No Linux engine fits this commit: nothing was checked. $WHY"
            printf 'Failed: no Linux engine fits this commit: nothing was checked.\n\n%s\n' "$WHY" >> "$GITHUB_STEP_SUMMARY"
            exit 1
            ;;
          *)
            echo "::error::No leg got as far as finding the engine: nothing was checked. Their jobs say why."
            exit 1
            ;;
          esac

      - if: ${{ steps.engine.outputs.found == 'true' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: results-*
          path: ${{ runner.temp }}/results
          merge-multiple: true

      - name: Runs
        if: ${{ steps.engine.outputs.found == 'true' }}
        env:
          LEGS: ${{ needs.gate.outputs.legs }}
          ALL: ${{ needs.gate.outputs.all }}
          RUNS: ${{ inputs.runs }}
          RESULTS: ${{ runner.temp }}/results
        run: |
          failed=0
          # What the results of session $1's leg with run $2 say of it, or that the leg didn't finish.
          result() {
            leg=$(printf '%s' "$LEGS" | jq -r --arg s "$1" --arg r "$2" 'first(.[] | select(.session == $s
              and ($s == "ime" or ((" " + .runs + " ") | contains(" " + $r + " "))))) | "\(.shard) \(.of)"')
            set -- "$1" "$2" ${leg:-1 1}
            said=$(awk -F '\t' -v run="$2" '$1 == run { said = $2 } END { print said }' "$RESULTS/$1-$3.tsv" 2> /dev/null)
            if [ -n "$said" ]; then
              echo "$said"
              return
            fi
            name="check $1"
            [ "$4" = 1 ] || name="$name $3/$4"
            echo "not run: $name didn't finish"
          }
          # A failed run fails the check, with an error, unless its failure is quarantined (#2197).
          failure() { # <session> <run> <result> <error>
            if issue=$(sh app/check/quarantine.sh match linux "$2" "$1" "${3#*): }"); then
              result="quarantined, $issue: $3"
              echo "::warning::$4 Quarantined under $issue."
            else
              failed=1
              echo "::error::$4"
            fi
          }
          # A run with no result fails the check, with an error once for its leg.
          unfinished=
          unfinished() {
            failed=1
            leg=${1#not run: }
            leg=${leg% didn*}
            case "$unfinished |" in
            *"| $leg |"*) ;;
            *)
              unfinished="$unfinished | $leg"
              echo "::error::$leg didn't finish, so some of its runs weren't checked. Its job says why."
              ;;
            esac
          }
          sessions=$(printf '%s' "$LEGS" | jq -r '[.[].session | select(. != "ime")] | reduce .[] as $s ([]; if index([$s]) then . else . + [$s] end) | .[]')
          for session in $sessions; do
            where=
            case $session in
            xvfb) title="Under Xvfb and openbox, on X11." ;;
            sway) title="In a headless sway session, on its Xwayland." ;;
            kwin) title="Under Xvfb and KWin, which blurs, on X11." ;;
            wayland)
              where=wayland/
              title="In a headless sway session, on Wayland. The runs not listed aren't driven there yet."
              ;;
            esac
            {
              echo "$title"
              echo
              echo "| Run | Result |"
              echo "|---|---|"
            } >> "$GITHUB_STEP_SUMMARY"
            for run in $ALL; do
              why=$(printf '%s\n' "$LINUX_SKIPS" | sed -n "s/^$run: //p")
              if [ -n "$why" ]; then
                [ "$session" != wayland ] || continue
                echo "| $run | not for Linux: $why |" | tee -a "$GITHUB_STEP_SUMMARY"
                continue
              fi
              if printf '%s' "$LEGS" | jq -e --arg s "$session" --arg r "$run" \
                'any(.[]; .session == $s and ((" " + .runs + " ") | contains(" " + $r + " ")))' > /dev/null; then
                result=$(result "$session" "$run")
                case $result in
                passed* | skip:*) ;;
                failed*) failure "$session" "$run" "$result" "The $run run failed on $session. Its log: $where$run.log in the artifact." ;;
                *) unfinished "$result" ;;
                esac
              else
                [ "$session" != wayland ] || continue
                result="skipped: not in the runs Linux passes yet"
              fi
              echo "| $run | $result |" | tee -a "$GITHUB_STEP_SUMMARY"
            done
            echo >> "$GITHUB_STEP_SUMMARY"
          done
          if printf '%s' "$LEGS" | jq -e 'any(.[]; .session == "ime")' > /dev/null; then
            case $RUNS in
            ''|all|*drops*)
              result=$(result ime drops)
              case $result in
              passed) ;;
              failed*) failure "" drops "$result" "Drops under Wayland failed. Its log: drops.log in the artifact." ;;
              *) unfinished "$result" ;;
              esac
              printf '\nUnder Wayland, in a headless sway session: check/drops.sh %s.\n' "$result" |
                tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            esac
            case $RUNS in
            ''|all|*ime*)
              result=$(result ime ime)
              case $result in
              passed) ;;
              failed*) failure "" ime "$result" "Input methods failed. Its log: ime.log in the artifact." ;;
              *) unfinished "$result" ;;
              esac
              printf '\nOn Wayland and Xwayland, in headless sway sessions with fcitx5: check/ime.sh %s.\n' \
                "$result" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            esac
          fi
          { echo; sh app/check/quarantine.sh list linux; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      # The legs' files, together as one job's were: X11's at the top, Wayland's in wayland/.
      - if: ${{ always() && steps.engine.outputs.found == 'true' }}
        uses: actions/upload-artifact/merge@v4
        continue-on-error: true
        with:
          name: check-linux
          pattern: check-linux-*
          delete-merged: true

  # The default runs' verdict on main, the night's or a train's, keeps the workflow's issue: a
  # dispatched run reports too, as its pass is the only one the night won't repeat on that commit.
  report:
    needs: [gate, check]
    if: ${{ always() && needs.gate.outputs.check == 'true' && github.ref == 'refs/heads/main' && github.repository == 'MartinPTielemans/ilo' && inputs.runs == '' && inputs.session != 'sway' && inputs.session != 'kwin' && inputs.session != 'wayland' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
    steps:
      # With app/check, whose quarantine keeps a quarantined run's issue open.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            app/check
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.check.result }}
          FOUND: ${{ needs.check.outputs.found }}
        run: .github/scripts/main-check.sh report "$RESULT" "$FOUND"
