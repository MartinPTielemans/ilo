# The core compiles on Linux (AGENTS.md, Hit every surface: Platforms). See engine/check-linux.sh.
# ci.yml calls it when a change touches the core or the engine (.github/scripts/ci-changes.cjs).
name: Core on Linux

on:
  workflow_call:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Dawn's code generators need the Go its go.mod names, newer than Ubuntu's.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache: false

      # A run reads no Ubuntu mirror, which failed to resolve for hours on 11-11 (#2425). The runner
      # image has clang-format and ninja. gperf's .deb is kept in the Actions cache under its own
      # version, which Ubuntu 24.04 hasn't changed since release, so the key holds across image
      # updates. Only a miss fetches it, and saves it for the runs after.
      - id: gperf
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/gperf
          key: gperf_3.1-1build1-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04
      # Proof only (#2425): with the cache hit, every Ubuntu mirror is unreachable, as on 11-11.
      - if: steps.gperf.outputs.cache-hit == 'true'
        run: |
          printf '0.0.0.0 %s\n' azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com | sudo tee -a /etc/hosts
          ! getent hosts azure.archive.ubuntu.com | command grep -v '^0\.0\.0\.0'
      # Proof only (#2425): what the image has of the demo's and Flatpak's apt packages.
      - run: |
          dpkg-query -W -f='${Package} ${Version} ${db:Status-Abbrev}\n' 'libclang*' xdotool openbox xauth flatpak 2>&1 || true
          ls -d /usr/lib/llvm-*/lib/libclang.so* 2>&1 || true
          update-alternatives --display clang-format 2>&1 | head -3 || true
          command -v gperf || echo "no gperf before the install"
      - if: steps.gperf.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/gperf"
          cd "$RUNNER_TEMP/gperf"
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -q
          apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 download gperf=3.1-1build1 ||
            { echo "::error::Ubuntu no longer has gperf 3.1-1build1: name its version in core-linux.yml."; exit 1; }
      - if: steps.gperf.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/gperf
          key: ${{ steps.gperf.outputs.cache-primary-key }}

      - name: Install tools
        run: |
          sudo dpkg -i "$RUNNER_TEMP"/gperf/gperf_*.deb
          for tool in clang-format ninja; do
            command -v "$tool" >/dev/null || { echo "::error::The runner image no longer has $tool (#2425)."; exit 1; }
            echo "$tool $("$tool" --version | head -1), from the runner image"
          done
          sudo npm install -g --prefix /usr esbuild typescript
          gperf --version | head -1
      # Proof only (#2425): the compile after it proves nothing for the install.
      - run: echo "proof only, so the compile is skipped"; exit 1

      # The tree takes about 40 GB. The runner's second disk has more room than its first.
      - name: Make room
        run: |
          df -h / /mnt
          sudo mkdir /mnt/work
          sudo chown "$USER" /mnt/work

      - run: engine/check-linux.sh /mnt/work
      - uses: ./.github/actions/tree-proof
        with:
          job: ci-core_linux
