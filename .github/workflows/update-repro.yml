# Temporary, for #1976, never for main: times each step of a Mac update check of the released
# DMGs against the live feed, from the app menu's Check for Updates… and from About's button.
name: Update check repro

on:
  push:
    branches: ['fix/update-check-slow-*']
    paths: [.github/workflows/update-repro.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Apps
        run: |
          swift .github/scripts/display-mode.swift 1920 1080 || true
          for v in 0.1.8 0.1.7; do
            mkdir -p "$RUNNER_TEMP/dmg/$v" "$RUNNER_TEMP/apps/$v"
            gh release download "v$v" -R MartinPTielemans/ilo -p ilo-mac-arm64.dmg -D "$RUNNER_TEMP/dmg/$v"
            hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt-$v" "$RUNNER_TEMP/dmg/$v/ilo-mac-arm64.dmg" > /dev/null
            ditto "$RUNNER_TEMP/mnt-$v/ilo.app" "$RUNNER_TEMP/apps/$v/ilo.app"
            hdiutil detach "$RUNNER_TEMP/mnt-$v" > /dev/null
            plutil -p "$RUNNER_TEMP/apps/$v/ilo.app/Contents/Info.plist" | grep -E 'CFBundle(Version|ShortVersionString|Identifier|Executable)|SU'
          done

      # Screen capture for the job's processes and the apps, as check-mac.yml grants it.
      - name: Grants
        run: |
          now=$(date +%s)
          system="/Library/Application Support/com.apple.TCC/TCC.db"
          approvals="$HOME/Library/Group Containers/group.com.apple.replayd/ScreenCaptureApprovals"
          paths="$(find -L "$RUNNER_TEMP/apps" -path '*/Contents/MacOS/*' -type f -perm -u+x)
          /usr/bin/osascript
          /System/Library/CoreServices/System Events.app/Contents/MacOS/System Events"
          pid=$$
          while [ "$pid" -gt 1 ]; do
            path=$(ps -o comm= -p "$pid")
            case $path in /*) paths="$paths
          $path" ;; esac
            pid=$(ps -o ppid= -p "$pid" | tr -d ' ')
          done
          echo "$paths" | sed 's/^ *//' | while read -r path; do
            [ -n "$path" ] || continue
            sudo sqlite3 "$system" "INSERT OR REPLACE INTO access (service, client, client_type,
              auth_value, auth_reason, auth_version, indirect_object_identifier, flags, last_modified)
              VALUES ('kTCCServiceScreenCapture', '$path', 1, 2, 4, 1, 'UNUSED', 0, $now)"
            sudo sqlite3 "$system" "INSERT OR REPLACE INTO access (service, client, client_type,
              auth_value, auth_reason, auth_version, indirect_object_identifier, flags, last_modified)
              VALUES ('kTCCServiceAccessibility', '$path', 1, 2, 4, 1, 'UNUSED', 0, $now)"
            defaults write "$approvals" "$path" -date "3000-01-01 00:00:00 +0000"
          done
          sudo killall tccd || true
          launchctl kickstart -k "gui/$(id -u)/com.apple.tccd" || true
          killall replayd || true

      - name: Cases
        run: |
          out=$RUNNER_TEMP/out
          mkdir -p "$out"
          now() { perl -MTime::HiRes=time -e 'printf "%.3f", time'; }
          stamp() { perl -MTime::HiRes=time -ne 'BEGIN { $| = 1 } printf "%.3f %s", time, $_'; }
          has() { grep -q " $1" "$log"; }
          count() { grep -c " $1" "$log" || true; }
          # Waits up to $2 s for a line matching $1.
          wait_for() {
            local i
            for i in $(seq $(($2 * 10))); do
              has "$1" && return 0
              kill -0 "$pid" 2> /dev/null || return 1
              sleep 0.1
            done
            return 1
          }
          # Waits up to $2 s for more lines matching $1 than $3.
          wait_more() {
            local i
            for i in $(seq $(($2 * 10))); do
              [ "$(count "$1")" -gt "$3" ] && return 0
              kill -0 "$pid" 2> /dev/null || return 1
              sleep 0.1
            done
            return 1
          }
          send() {
            step=$((step + 1))
            echo "$*" >&3
            wait_for "browser: drive $step done" 30 || echo "driver didn't finish $*"
          }
          post() {
            step=$((step + 1))
            echo "$*" >&3
          }
          mark() { echo "$(now) == $*" >> "$log"; }
          jobs_now() {
            {
              echo "== $(now) $*"
              launchctl list | grep -i -e sparkle -e "$id" || echo "no launchd jobs"
              for job in sparkle-progress sparkle-updater; do
                launchctl print "gui/$(id -u)/$id-$job" 2>&1 | grep -E 'state|pid|program|last exit|runs|name|endpoint' | head -20
              done
              ps -axo pid,etime,command | grep -i -e autoupdate -e 'Updater.app' | grep -v grep || echo "no installer running"
            } >> "$out/jobs.txt"
          }
          # Fresh copy of version $1 for case $2.
          fresh() {
            rm -rf "$RUNNER_TEMP/run/$2"
            mkdir -p "$RUNNER_TEMP/run/$2"
            ditto "$RUNNER_TEMP/apps/$1/ilo.app" "$RUNNER_TEMP/run/$2/ilo.app"
            app=$RUNNER_TEMP/run/$2/ilo.app
            exe=$app/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")
            id=$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")
            defaults delete "$id" > /dev/null 2>&1 || true
            rm -rf "$HOME/Library/Caches/$id"
            # Checked a moment ago, so the launch makes no check of its own.
            defaults write "$id" SULastCheckTime -date "$(date -u '+%Y-%m-%d %H:%M:%S +0000')"
          }
          # Launches $app with the driver, logging to case $1.
          launch() {
            name=$1
            log=$out/$name.log
            : > "$log"
            fifo=$RUNNER_TEMP/drive-$name
            rm -f "$fifo"
            mkfifo "$fifo"
            profile=$RUNNER_TEMP/profile-$name
            mkdir -p "$profile"
            step=0
            (BROWSER_DRIVE=1 BROWSER_URL='data:text/html,<title>updates</title>' \
              BROWSER_PROFILE_DIR="$profile" "$exe" < "$fifo" 2>&1 | stamp >> "$log") &
            exec 3> "$fifo"
            for _ in $(seq 100); do
              pid=$(pgrep -n -f "^$exe" || true)
              [ -n "$pid" ] && break
              sleep 0.1
            done
            log stream --style compact --level debug \
              --predicate 'subsystem BEGINSWITH "org.sparkle-project"' > "$out/$name-sparkle.txt" 2>&1 &
            streamer=$!
            wait_for 'browser: loaded' 60 || echo "$name: the page didn't load"
            wait_for 'browser: updater started' 30 || echo "$name: no updater"
            sleep 2
            send state
          }
          finish() {
            ../tools/window-screenshot.sh "$pid" "$out/$name.png" all 2> /dev/null || true
            exec 3>&-
            kill "$pid" 2> /dev/null || true
            for _ in $(seq 100); do kill -0 "$pid" 2> /dev/null || break; sleep 0.1; done
            pkill -9 -f "$RUNNER_TEMP/run/" || true
            kill "$streamer" 2> /dev/null || true
            sleep 1
          }
          # Samples the app's threads once a check has taken more than 3 s.
          sample_if_slow() {
            sleep 3
            [ "$(count "$2")" -gt "$3" ] ||
              sample "$pid" 5 -file "$out/$name-$1-sample.txt" > /dev/null 2>&1 || true
          }
          about_open() {
            send menu "About ilo"
            wait_for 'browser: settings update check at ' 15 || echo "$name: About had no Check for Updates"
          }
          about_check() {
            local at n ended
            at=$(grep ' browser: settings update check at ' "$log" | tail -1 | sed 's/.* at //')
            n=$(count 'browser: update stage current')
            ended=$(count 'browser: update stage \(current\|failed\|idle\|ready\)')
            jobs_now "$name: About's check $1"
            mark "About's Check for Updates $1 at $at"
            # shellcheck disable=SC2086
            send clickkey $at
            sample_if_slow "about-$1" 'browser: update stage current' "$n" &
            wait_more 'browser: update stage \(current\|failed\|idle\|found\)' 120 "$ended" ||
              echo "$name: About's check $1 didn't end"
            sleep 2
            ../tools/window-screenshot.sh "$pid" "$out/$name-about-$1.png" all 2> /dev/null || true
          }
          menu_check() {
            local n
            n=$(count 'browser: update \(none:\|failed:\)')
            jobs_now "$name: menu check $1"
            mark "menu Check for Updates… $1"
            post "menu Check for Updates…"
            sample_if_slow "menu-$1" 'browser: update \(none:\|failed:\)' "$n" &
            wait_more 'browser: update \(none:\|failed:\)' 120 "$n" || echo "$name: menu check $1 didn't end"
            sleep 2
            ../tools/window-screenshot.sh "$pid" "$out/$name-menu-$1.png" all 2> /dev/null || true
            post "key return"
            sleep 2
          }
          cd app

          # The on-screen windows, front to back, with their owners and levels.
          cat > "$RUNNER_TEMP/windows.swift" <<'SWIFT'
          import CoreGraphics
          import Foundation
          let list = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as! [[String: Any]]
          for w in list.prefix(14) {
            let b = w[kCGWindowBounds as String] as? [String: Any] ?? [:]
            print(w[kCGWindowOwnerName as String] ?? "?", w[kCGWindowOwnerPID as String] ?? 0,
                  "layer", w[kCGWindowLayer as String] ?? 0, "name", w[kCGWindowName as String] ?? "",
                  "at", b["X"] ?? 0, b["Y"] ?? 0, b["Width"] ?? 0, b["Height"] ?? 0)
          }
          SWIFT
          swiftc -O "$RUNNER_TEMP/windows.swift" -o "$RUNNER_TEMP/windows" 2> /dev/null || true
          seen() {
            { echo "== $(now) $1"; "$RUNNER_TEMP/windows"; } >> "$out/windows.txt" 2>&1
            screencapture -x "$out/screen-$1.png" 2> /dev/null || true
          }
          menu_seen() {
            local n
            n=$(count 'browser: update alert shows')
            mark "menu Check for Updates… $1"
            post "menu Check for Updates…"
            wait_more 'browser: update alert shows' 30 "$n" || echo "$name: no alert"
            sleep 1.5
            seen "$1"
            post "key return"
            sleep 2
          }

          # Window › Stay On Top, then the menu's check: where Sparkle's alert is.
          fresh 0.1.8 ontop
          launch ontop
          seen ontop-before
          send menu "Stay On Top"
          sleep 1
          menu_seen ontop
          # Settings, at its level, over the window kept on top?
          send menu "About ilo"
          sleep 1.5
          seen ontop-settings
          finish

          # Full screen, then the menu's check.
          fresh 0.1.8 fullscreen
          launch fullscreen
          send fullscreen
          wait_for 'browser: window entered full screen' 15 || echo "fullscreen: didn't enter"
          sleep 2
          menu_seen fullscreen
          finish
          jobs_now "end"

          # Times from each mark.
          for f in "$out"/*.log; do
            echo "### $(basename "$f" .log)"
            awk '/ == / { t0 = $1 } t0 && (/ == / || / browser: update/) { printf "%8.3f %s\n", $1 - t0, substr($0, index($0, " ") + 1) }' "$f"
          done | tee "$out/timings.txt"
          cat "$out/jobs.txt"
          { echo '```'; cat "$out/timings.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: update-repro
          path: ${{ runner.temp }}/out
