# Fails a branch or pull request with a commit that has no Signed-off-by line, the Developer
# Certificate of Origin's sign-off (CONTRIBUTING.md#sign-off), a line crediting an AI tool, or a
# title that isn't a conventional commit (#3392). It reads commit messages through the API, so it
# never checks out or runs the pull request's code.
name: DCO

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions: {}

jobs:
  sign-off:
    name: Sign-off
    # A pull request from a branch here already ran on its push.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            let commits;
            if (context.eventName === "pull_request") {
              commits = await github.paginate(github.rest.pulls.listCommits, {
                ...repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
            } else {
              // The commits on the branch that main doesn't have.
              const basehead = `${context.payload.repository.default_branch}...${context.sha}`;
              commits = [];
              for (let page = 1; ; page++) {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({
                  ...repo, basehead, per_page: 100, page,
                });
                commits.push(...data.commits);
                if (data.commits.length < 100 || commits.length >= data.total_commits) break;
              }
            }

            // A merge commit, such as GitHub's Update branch makes, brings in commits checked on
            // their own.
            const own = commits.filter((c) => c.parents.length < 2);
            const signedOff = /^Signed-off-by: \S.* <[^<>\s]+@[^<>\s]+>\s*$/m;
            const aiTool = /\b(claude|anthropic|openai|codex|copilot|cursor|chatgpt|gpt|gemini|devin)\b/i;
            const credit = /^(co-authored-by:|\W*generated (with|by)\b)/i;
            // The template's types, and check and spike, which main uses; a diag or wip commit
            // stays on a probe branch.
            const title =
              /^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|check|spike)(\([^()]+\))?!?: \S|Revert ")/;
            const rules = [
              {
                breaks: (m) => !signedOff.test(m),
                what: "no Signed-off-by line",
                fix: "`git rebase --signoff <base>` adds yours to every commit (CONTRIBUTING.md#sign-off)",
              },
              {
                breaks: (m) => m.split("\n").some((l) => credit.test(l) && aiTool.test(l)),
                what: 'a Co-Authored-By or "Generated with" line naming an AI tool',
                fix: "authorship is human (CONTRIBUTING.md#sign-off): reword the commit without the line",
              },
              {
                breaks: (m) => !title.test(m.split("\n")[0]),
                what: "a title that isn't a conventional commit",
                fix:
                  "reword it as type(scope): the outcome in plain language, with a type of feat, fix, " +
                  "docs, style, refactor, perf, test, build, ci, chore, revert, check or spike",
              },
            ];
            let broken = 0;
            for (const rule of rules) {
              const found = own.filter((c) => rule.breaks(c.commit.message));
              for (const c of found) {
                core.error(`${c.sha.slice(0, 10)} "${c.commit.message.split("\n")[0]}": ${rule.what}. To fix: ${rule.fix}.`);
              }
              broken += found.length;
            }
            core.info(`${commits.length} commits, ${broken} problems.`);
            if (broken > 0) {
              core.setFailed(
                "A commit above breaks a commit rule. Fix each as its line says, then push the branch again.",
              );
            }
