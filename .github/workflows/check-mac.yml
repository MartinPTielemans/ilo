# The browser on the Mac, run and checked by app/check.sh (AGENTS.md, Verifying), on the Mac engine
# built from this commit's core, on GitHub's hosted Apple silicon runners, which are free for a
# public repository. It runs on main each night and by hand, which the integrator does on main
# after each merge train (#871): never a pull request. It never builds an engine: it takes the
# newest engine-mac release in this commit's history (engine/fetch.sh), which the owner's Mac
# publishes each night main's core or engine changed (tools/mac-nightly.sh). A commit whose
# core/public/browser_core.h no published engine has fails, saying so, as nothing can run it, and
# is checked the night after one is. Every run in app/check/ shows in the summary: passed, failed,
# or skipped and why, with the lines a run that passed skipped. A failure on main opens an issue,
# which the next run that passes closes (.github/scripts/main-check.sh).
# The 2026-10-28 trial (branch ci/mac-check) found the runner a VM of 3 cores and 7.5 GB with a
# 1024 by 768 screen, which the job sets to 1920 by 1080, where Metal, windows, making an app
# active, window captures, IME, keys and focus work, but scrolling drew 35-41 frames a second: it
# checks behaviour, never the performance gate (docs/roadmap.md), whose numbers come from the
# owner's Mac.
# Its default runs, the night's and a train's, are every run check.sh does unnamed but VM_RUNS, the
# runs a release still needs from the owner's MacBook's check VM, each here with its reason (#2205):
# none now. clear was one until #2888: a switch from a Safari's-engine page to Chromium's left the
# window's stale occluded mark, so the tab Clear Browsing Data opened drew nothing here.
# switch-frames runs here: its empty page area through a switch, here in 3 of 4 runs, is on the VM
# too, about half the time, and quarantined on the Mac under #2248 (check/quarantine.mac).
# And one part of a run that passes here, which skips it, saying so:
# - window's sidebar against Dia's composite: the runner's AppKit material is darker than the one
#   Dia was measured over (#1554).
# sync-devices runs here, in about 200 s, against the run's own ilo-server, its copies handing each
# other the active app as each needs the keyboard (#589).
# Of the runs check.sh does only when named, the runner passes store, sync-extensions, adblock-live,
# adblock-parity, adblock-native, passwords-live, updates, nightly, update-checks, shots, and
# keychain asked for alone, which builds the prod build it needs. perf and adblock-cost measure, so
# they stay on the owner's Mac (here perf had ilo's memory 48 to 103 % over Chrome's); widevine and
# tab-drag are Linux's.
name: Check on macOS

on:
  # 05:23 UTC, after the owner's Mac builds the night's engine at 03:00 in Europe (tools/mac-nightly.sh).
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: The runs to do, such as "load tabs", or "all"; empty for the ones the Mac runner passes
        default: ''
      rebuild:
        description: Build the app, even if a check of this commit kept one
        type: boolean
        default: false
      trace:
        description: >-
          The trace categories for tabs and perf's traced switches (app/check/lib.sh), such as
          #2377's, latency among them; empty for latency alone in tabs and no traced switches
        default: ''
      lists_from:
        description: >-
          A Check run's id, on any OS, whose adblock-parity lists this run's adblock-parity and
          adblock-native block with, so runs on the three OSes share one snapshot (#2111); empty
          to download them
        default: ''

# Main's running check finishes, with only the newest dispatch or night waiting behind it; a branch's
# dispatch replaces the one before it.
concurrency:
  group: check-mac-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Whether to check this commit: a scheduled run, in ilo itself and not a fork, checks only a commit
  # no run has checked yet; a dispatched one always does.
  gate:
    if: github.event_name != 'schedule' || github.repository == 'MartinPTielemans/ilo'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      check: ${{ github.event_name != 'schedule' || steps.seen.outputs.seen != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: seen
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/main-check.sh seen

  # The app the check jobs run, built once for them all (#3917), or the one another check of this
  # commit kept (app-artifact.sh), once the engine it runs on is found.
  build:
    needs: gate
    if: needs.gate.outputs.check == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      # app-artifact.sh find reads the repository's artifacts.
      actions: read
    outputs:
      found: ${{ steps.engine.outputs.found }}
      run: ${{ steps.app.outputs.run }}
      artifact: ${{ steps.app.outputs.artifact }}
      prod: ${{ steps.prod.outcome }}
    defaults:
      run:
        working-directory: app
    steps:
      # With the history, where fetch.sh looks for the engine's commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A run with no engine checks nothing, so it fails rather than pass, and the night after takes
      # it as not checked (main-check.sh seen) (#1563).
      - id: engine
        name: Engine
        run: |
          status=0
          ../engine/fetch.sh > /dev/null 2> "$RUNNER_TEMP/fetch.log" || status=$?
          cat "$RUNNER_TEMP/fetch.log" >&2
          case $status in
          0) echo "found=true" >> "$GITHUB_OUTPUT" ;;
          2)
            why=$(tail -1 "$RUNNER_TEMP/fetch.log")
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::error::No Mac engine fits this commit: nothing was checked. $why"
            printf 'Failed: no Mac engine fits this commit: nothing was checked.\n\n%s\n' "$why" >> "$GITHUB_STEP_SUMMARY"
            exit 1
            ;;
          *) exit "$status" ;;
          esac

      # The app another check of this commit built, if one kept it, unless this run asked for a
      # build. The keychain run needs the prod build, on the Release engine the night publishes, as
      # it uses the real Keychain: asked for alone, this job builds that, for this run alone.
      - id: kept
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          run=
          [ "$RUNS" = keychain ] || [ "$REBUILD" = true ] ||
            run=$(../.github/scripts/app-artifact.sh find "app-mac-$GITHUB_SHA")
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

      - if: ${{ steps.kept.outputs.run == '' || inputs.runs == 'all' }}
        run: rustup update stable --no-self-update

      # Every ref reads main's build cache, and main alone saves one: a copy saved by each
      # branch pushed main's out of the repository's 10 GB (#1969).
      - id: cache
        if: ${{ steps.kept.outputs.run == '' || inputs.runs == 'all' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: check-mac-${{ hashFiles('app/Cargo.lock', 'app/setup.sh', 'app/patches/**') }}
          restore-keys: check-mac-

      - id: build
        if: ${{ steps.kept.outputs.run == '' }}
        run: ./setup.sh prebuilt && ./build.sh ${{ inputs.runs == 'keychain' && 'prod' || '' }}

      # With Sparkle beside it, which build.sh updates adds to the copies the updates, nightly and
      # update-checks runs make of it.
      - if: ${{ steps.build.outcome == 'success' }}
        run: |
          ../.github/scripts/app-artifact.sh pack "$(../engine/fetch.sh)" "$RUNNER_TEMP/app.tar"
          tar -cf "$RUNNER_TEMP/sparkle.tar" -C .deps Sparkle
      # For this run's check jobs, and for 3 days the next check of this commit's, but the prod
      # build for this run's alone, under a name no other check looks for.
      - if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-mac-${{ inputs.runs == 'keychain' && 'prod-' || '' }}${{ github.sha }}
          path: |
            ${{ runner.temp }}/app.tar
            ${{ runner.temp }}/sparkle.tar
          retention-days: ${{ inputs.runs == 'keychain' && 1 || 3 }}
          overwrite: true

      # Of the dev build alone, before the prod build below, so the cache never holds the prod
      # build's artefacts too: it's at the repository's cap (#1969, #4000).
      - if: ${{ steps.build.outcome == 'success' && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # keychain uses the real Keychain, so it needs the prod build, which runs=all's check jobs
      # take from here for keychain's turn (#4000), for this run alone. A prod build that fails
      # fails keychain, which says so, and the dev runs still run.
      - id: prod
        if: ${{ inputs.runs == 'all' }}
        continue-on-error: true
        run: |
          [ -e .deps/Chromium.app ] || ./setup.sh prebuilt
          ./build.sh prod
          ../.github/scripts/app-artifact.sh pack "$(../engine/fetch.sh)" "$RUNNER_TEMP/prod.tar"
      - if: ${{ steps.prod.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-mac-prod-${{ github.sha }}
          path: ${{ runner.temp }}/prod.tar
          retention-days: 1
          overwrite: true

      - id: app
        env:
          KEPT: ${{ steps.kept.outputs.run }}
          ARTIFACT: app-mac-${{ inputs.runs == 'keychain' && 'prod-' || '' }}${{ github.sha }}
        run: |
          echo "run=${KEPT:-$GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

  check:
    needs: build
    # Named apart when it does other runs than the default ones, so it's no verdict on the commit.
    name: ${{ inputs.runs != '' && 'check (runs asked for)' || 'check' }}${{ matrix.shard != 0 && format(' {0}/{1}', matrix.shard, strategy.job-total) || '' }}
    # The default runs and runs=all take longer than the job's 120 minutes, so they're dealt across
    # three jobs and four, each with its share of the runs (.github/scripts/runs.sh, #2271, #3444,
    # #3917). Any other list is one job's.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.runs == 'all' && '[1, 2, 3, 4]' || inputs.runs == '' && '[1, 2, 3]' || '[0]') }}
    runs-on: macos-26
    # The default runs took about 105 min here on 11-18, after about 16 of setting up, and ran out
    # the job's time unsplit (44322076346).
    timeout-minutes: 120
    permissions:
      contents: read
      # A re-run reads the run's earlier attempts (main-check.sh rerun), and the app is the build
      # job's artifact, or another run's.
      actions: read
    defaults:
      run:
        working-directory: app
    env:
      # The runs a release still needs from the check VM, as the header says why: one leaves the
      # list once it passes on the runner (#2248).
      VM_RUNS: ''
      # How many jobs the runs are dealt across, for runs.sh shard.
      SHARDS: ${{ strategy.job-total }}
    steps:
      # When the job started, for the Runs step's limit below.
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
        working-directory: .
      # With the history, where fetch.sh looks for the engine's commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A re-run's pass would show over the failure of the attempt before it.
      - if: ${{ github.run_attempt != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../.github/scripts/main-check.sh rerun

      # The runs this job does, and its share of check.sh's runs, each of which it gives a result
      # line, done or skipped.
      - id: runs
        env:
          RUNS: ${{ inputs.runs }}
          SHARD: ${{ matrix.shard }}
        run: |
          case $RUNS in
          '')
            todo=
            for run in $(sh check.sh --runs default); do
              case " $VM_RUNS " in *" $run "*) ;; *) todo="$todo $run" ;; esac
            done
            ;;
          all) todo=$(../.github/scripts/runs.sh all) ;;
          *) todo=$RUNS ;;
          esac
          share=$(../.github/scripts/runs.sh shard "$SHARD" "$SHARDS" $todo)
          runs=
          for run in $share; do
            case " $(echo $todo) " in *" $run "*) runs="$runs $run" ;; esac
          done
          echo "share= $(echo $share) " >> "$GITHUB_OUTPUT"
          echo "list= $(echo $runs) " | tee -a "$GITHUB_OUTPUT"

      # The runner's 1024 by 768 screen is too small for the windows the checks lay out for the VMs',
      # and it reduces transparency, which draws the window's material opaque over any backdrop,
      # and motion, under which the app moves nothing (#1529) where the checks time its motion
      # (#1554). First, so the Dock and the windows' layout settle over the steps after it.
      - run: |
          swift ../.github/scripts/display-mode.swift 1920 1080
          for setting in reduceTransparency reduceMotion; do
            defaults write com.apple.universalaccess "$setting" -bool false
            [ "$(defaults read com.apple.universalaccess "$setting")" = 0 ] ||
              { echo "::error::$setting stayed on"; exit 1; }
          done

      # The app the build job made or found, with Sparkle for build.sh updates. A check job never
      # builds one of its own: without the build job's, it fails, saying so.
      - id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/app
          run-id: ${{ needs.build.outputs.run }}
          github-token: ${{ github.token }}
      - name: App
        env:
          GOT: ${{ steps.download.outcome }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
          RUN: ${{ needs.build.outputs.run }}
        run: |
          if [ "$GOT" != success ]; then
            echo "::error::No app to check: the build job's $ARTIFACT, in run $RUN, didn't download, and a check job never builds one of its own. The build job says why."
            exit 1
          fi
          ../.github/scripts/app-artifact.sh unpack "$(../engine/fetch.sh)" "$RUNNER_TEMP/app/app.tar"
          mkdir -p .deps
          tar -xf "$RUNNER_TEMP/app/sparkle.tar" -C .deps

      # runs=all's keychain turn has the build job's prod build (#4000).
      - id: prod
        if: ${{ inputs.runs == 'all' && needs.build.outputs.prod == 'success' && contains(steps.runs.outputs.list, ' keychain ') }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: app-mac-prod-${{ github.sha }}
          path: ${{ runner.temp }}/prod
          github-token: ${{ github.token }}

      # The sync-account, sync-devices and sync-extensions runs sign in to an ilo-server of their
      # own, on SQLite with a throwaway account, never the hosted one: built from the server's repo
      # at the commit check-linux.yml builds, when the runs include one, as the default ones do.
      - id: server
        if: ${{ contains(steps.runs.outputs.list, ' sync-account ') || contains(steps.runs.outputs.list, ' sync-devices ') || contains(steps.runs.outputs.list, ' sync-extensions ') }}
        uses: actions/checkout@v4
        with:
          repository: MartinPTielemans/ilo-server
          ref: 882f2736e5a3b228543ae33b821aeeb52f80426d
          path: app/.deps/ilo-server

      # Main alone saves, as for the build cache above (#1969).
      - id: server-cache
        if: ${{ steps.server.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: app/.deps/ilo-server/target
          key: ilo-server-mac-882f2736e5a3b228543ae33b821aeeb52f80426d

      - if: ${{ steps.server.outcome == 'success' }}
        working-directory: app/.deps/ilo-server
        run: |
          # The toolchain its cache was built with, as the job builds nothing else (#3917).
          rustup update stable --no-self-update
          # The server's passkeys link OpenSSL, which Homebrew has on the runner's image.
          brew list openssl@3 > /dev/null 2>&1 || brew install openssl@3
          OPENSSL_DIR=$(brew --prefix openssl@3) cargo build --release --locked
          echo "ILO_SERVER=$PWD/target/release/ilo-server" >> "$GITHUB_ENV"

      - if: ${{ steps.server-cache.outcome == 'success' && steps.server-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: app/.deps/ilo-server/target
          key: ilo-server-mac-882f2736e5a3b228543ae33b821aeeb52f80426d

      # macOS asks Screen Recording, Input Monitoring, the camera and the microphone of the process
      # responsible for the app, here the runner's agent that started the job, not of the app: once media's call and
      # tab share reached Chromium's capture, UserNotificationCenter's question took the app's
      # activation, and the run's clicks and keys went nowhere (#1554). The check VMs answered
      # it once; a hosted runner is new each time, with SIP off, so the job grants them, and
      # Accessibility for the notifications run's banners, to the processes it runs under. Each grant is read back, and a missing one fails the job.
      - run: |
          now=$(date +%s)
          # Runs the SQL $2 on the database $1, leaving its output in $said. tccd may hold the
          # database as the job starts, and sqlite3 gives up at the first lock unless told to wait
          # for it, which failed the job before any run (#2966).
          tcc() {
            said=$(sudo sqlite3 -cmd '.timeout 30000' "$1" "$2" 2>&1) && return 0
            case $said in
            *locked*) echo "::error::$1 stayed locked for 30 s, so the grants couldn't be written: $said" ;;
            *) echo "::error::sqlite3 failed on $1: $said" ;;
            esac
            exit 1
          }
          grant() { # <database> <service> <client path>
            tcc "$1" "INSERT OR REPLACE INTO access (service, client, client_type,
              auth_value, auth_reason, auth_version, indirect_object_identifier, flags, last_modified)
              VALUES ('$2', '$3', 1, 2, 4, 1, 'UNUSED', 0, $now)"
            tcc "$1" "SELECT auth_value FROM access WHERE service = '$2' AND client = '$3'"
            [ "$said" = 2 ] || { echo "::error::$2 wasn't granted to $3"; exit 1; }
          }
          system="/Library/Application Support/com.apple.TCC/TCC.db"
          user="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          # Screen capture asks replayd too, which keeps its own list of what it lets record, by
          # executable path: the app's, its helpers', and the processes the job runs under.
          approvals="$HOME/Library/Group Containers/group.com.apple.replayd/ScreenCaptureApprovals"
          paths=$(find -L "$PWD/build/Browser.app" -path '*/Contents/MacOS/*' -type f -perm -u+x)
          pid=$$
          while [ "$pid" -gt 1 ]; do
            path=$(ps -o comm= -p "$pid")
            case $path in
            /*)
              grant "$system" kTCCServiceScreenCapture "$path"
              grant "$system" kTCCServiceListenEvent "$path"
              # notifications presses macOS's banners through the accessibility API (check/banner.mm).
              grant "$system" kTCCServiceAccessibility "$path"
              grant "$user" kTCCServiceCamera "$path"
              grant "$user" kTCCServiceMicrophone "$path"
              paths="$paths
          $path"
              ;;
            esac
            pid=$(ps -o ppid= -p "$pid" | tr -d ' ')
          done
          # The app by its bundle and its path too, for a request that names it.
          for service in kTCCServiceCamera kTCCServiceMicrophone; do
            tcc "$user" "INSERT OR REPLACE INTO access (service, client, client_type,
              auth_value, auth_reason, auth_version, indirect_object_identifier, flags, last_modified)
              VALUES ('$service', 'dev.browser.app', 0, 2, 4, 1, 'UNUSED', 0, $now)"
            grant "$user" "$service" "$PWD/build/Browser.app/Contents/MacOS/Browser"
          done
          echo "$paths" | sed 's/^ *//' | while read -r path; do
            [ -n "$path" ] || continue
            defaults write "$approvals" "$path" -date "3000-01-01 00:00:00 +0000"
            echo "approved $path"
          done
          # Each reads them again as it starts. The user's tccd, from boot, stays through killall
          # and kept prompting for the microphone granted here (41748701502), so launchd restarts it.
          sudo killall tccd || true
          launchctl kickstart -k "gui/$(id -u)/com.apple.tccd"
          killall replayd || true
          # A runner has refused a job's every capture though granted, ScreenCaptureKit's -3801,
          # which failed its first check as "no window to capture" (#2963). One listing, as
          # tools/window-screenshot.sh starts with, says so here, as the runner's fault.
          cat > "$RUNNER_TEMP/list-windows.swift" <<'SWIFT'
          import ScreenCaptureKit
          do {
            _ = try await SCShareableContent.excludingDesktopWindows(true, onScreenWindowsOnly: true)
            print("ScreenCaptureKit lists the windows on screen")
          } catch {
            print(error)
            exit((error as NSError).code == -3801 ? 3 : 1)
          }
          SWIFT
          refused=0
          said=$(swift "$RUNNER_TEMP/list-windows.swift" 2>&1) || refused=$?
          echo "$said"
          if [ "$refused" = 3 ]; then
            echo "::error::the runner refused screen capture after its grants (ScreenCaptureKit's -3801), a runner fault, not a check's (#2963)"
            exit 1
          fi
          [ "$refused" = 0 ] || echo "::warning::ScreenCaptureKit's listing failed, but not with -3801: $said"

      # The lists an earlier run's adblock-parity downloaded, on any OS, for this run's to block
      # with, so the OSes' runs compare the engines on one snapshot (#2111).
      - if: ${{ inputs.lists_from != '' }}
        uses: actions/download-artifact@v4
        with:
          name: adblock-parity-lists
          path: app/build/given-lists
          run-id: ${{ inputs.lists_from }}
          github-token: ${{ github.token }}

      # The Runs step's limit: what's left of the job's 120 minutes, less 3 for the steps after it,
      # which took at most 37 s on the ten Mac check runs before this. A job cut at its own limit is
      # cancelled and runs nothing more, not even if: always() steps; a step cut at its limit is
      # killed, and the job goes on to name the run it was in and upload the results (#4036).
      - id: limit
        working-directory: .
        run: |
          minutes=$((117 - ($(date +%s) - JOB_START + 59) / 60))
          [ "$minutes" -ge 1 ] || minutes=1
          echo "minutes=$minutes" | tee -a "$GITHUB_OUTPUT"

      # A run that turns the Mac's appearance has to put back the one it found, and the runner
      # starts dark, so a window run asked for by name starts light to show it does (#4445). The
      # runner is thrown away after the job, so nothing else sees it.
      - name: Start light
        id: light
        if: ${{ inputs.runs == 'window' }}
        run: |
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to false'
          [ "$(osascript -e 'tell application "System Events" to tell appearance preferences to get dark mode')" = false ] ||
            { echo "::error::the runner didn't turn light"; exit 1; }

      # Each run alone, so one failing doesn't hide the rest, and each keeps its own build/check.
      # Each of the job's share of check.sh's runs gets a line in its results, done or skipped, which
      # the complete job reads.
      - name: Runs
        id: checks
        timeout-minutes: ${{ fromJSON(steps.limit.outputs.minutes) }}
        env:
          RUNS: ${{ steps.runs.outputs.list }}
          SHARE: ${{ steps.runs.outputs.share }}
          SHARD: ${{ matrix.shard }}
          RESULTS: ${{ runner.temp }}/results/mac-${{ matrix.shard }}.tsv
          RUNNING: ${{ runner.temp }}/running
          # How runs=all's prod build went, for keychain's turn, which swaps it in.
          PROD_BUILD: ${{ inputs.runs == 'all' && (needs.build.outputs.prod || 'skipped') || '' }}
          PROD_GOT: ${{ steps.prod.outcome }}
          CHECK_TRACE_CATEGORIES: ${{ inputs.trace }}
          ADBLOCK_PARITY_LISTS: ${{ inputs.lists_from != '' && 'build/given-lists' || '' }}
        run: |
          out=$RUNNER_TEMP/check
          mkdir -p "$out" "$(dirname "$RESULTS")"
          all=$SHARE
          runs=$RUNS
          {
            echo "| Run | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          # macOS asks whether the runner's agent, which it holds responsible for the app, may find
          # devices on the local network, in UserNotificationCenter, at some point after anything the
          # job started reaches the default route's address, as webrtc's STUN server is. It took the
          # app's activation mid-run and the run's keys went nowhere: in webrtc, and in handback,
          # which came later in the same job (#2205). Local Network can't be granted ahead like the
          # others, a check VM answered once, and reaching that address from the job didn't make it
          # ask, so through every run the job answers that question alone with Allow, through
          # System Events with the Accessibility granted above, once the question has made
          # UserNotificationCenter the active app, so the runs keep the runner's 3 cores between.
          (
            while :; do
              sleep 0.5
              case $(lsappinfo info -only bundleid "$(lsappinfo front)" 2> /dev/null) in
              *UserNotificationCenter*) ;;
              *) continue ;;
              esac
              asked=$(osascript -e 'tell application "System Events"
                if not (exists process "UserNotificationCenter") then return ""
                tell process "UserNotificationCenter"
                  if (count of windows) is 0 then return ""
                  set asked to (value of every static text of window 1) as text
                  if asked does not contain "local network" then return ""
                  click button "Allow" of window 1
                  return asked
                end tell
              end tell' 2> /dev/null) || true
              [ -z "$asked" ] || echo "$(date -u +%T) allowed: $asked" >> "$out/local-network.log"
            done
          ) &
          answering=$!
          # keychain uses the real Keychain (#4000). The login keychain's password on the runner
          # isn't known, and securityd keeps it open, so one made in its place wouldn't unlock: its
          # turn makes a default keychain of its own, with a password keychain.sh adds its copies
          # to the cookie key's partition with. For runs=all, the turn has the build job's prod
          # build in place of the dev one. After it, the job's keychains and the dev build come
          # back for the runs after it, and the log says the app's bundle id before, in and after.
          bundle() { plutil -extract CFBundleIdentifier raw build/Browser.app/Contents/Info.plist; }
          made=$HOME/Library/Keychains/check.keychain-db
          keychain_in() {
            if [ -n "$PROD_BUILD" ]; then
              if [ "$PROD_BUILD" != success ] || [ "$PROD_GOT" != success ]; then
                echo "FAIL: no prod build to check: the build job's prod build was $PROD_BUILD," \
                  "its download ${PROD_GOT:-skipped}" > "$out/keychain.log"
                return 1
              fi
              before=$(bundle)
              mv build/Browser.app "$RUNNER_TEMP/dev.app"
              # Unpacked only in part, the turn would check whatever is there; the dev build goes
              # back for the runs after it, and the row says why.
              if ! ../.github/scripts/app-artifact.sh unpack "$(../engine/fetch.sh)" \
                "$RUNNER_TEMP/prod/prod.tar"; then
                rm -rf build/Browser.app
                mv "$RUNNER_TEMP/dev.app" build/Browser.app
                echo "FAIL: the prod build couldn't be unpacked from the build job's download," \
                  "so keychain didn't run" > "$out/keychain.log"
                return 1
              fi
            fi
            searched=$(security list-keychains -d user | tr -d '"')
            was=$(security default-keychain -d user | tr -d '" ')
            KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
            echo "::add-mask::$KEYCHAIN_PASSWORD"
            export KEYCHAIN_PASSWORD
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$made"
            security set-keychain-settings "$made"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$made"
            security list-keychains -d user -s "$made"
            security default-keychain -d user -s "$made"
          }
          keychain_out() {
            security list-keychains -d user -s $searched
            security default-keychain -d user -s "$was"
            security delete-keychain "$made" || true
            unset KEYCHAIN_PASSWORD
            if [ -d "$RUNNER_TEMP/dev.app" ]; then
              during=$(bundle)
              rm -rf build/Browser.app
              mv "$RUNNER_TEMP/dev.app" build/Browser.app
              echo "keychain: the app's bundle id before its turn $before, in it $during," \
                "after it $(bundle)"
            fi
          }
          # GNU's timeout, which macOS doesn't have under that name, if the runner has it.
          limit=$(command -v timeout || command -v gtimeout || true)
          failed=0
          for run in $all; do
            case " $runs " in
            *" $run "*)
              start=$SECONDS
              status=0
              # Perf measures Chrome beside the app.
              minutes=20m
              [ "$run" != perf ] || minutes=40m
              # The run going, for the step after this one if this step is cut at its limit. A
              # cut in keychain's turn leaves its keychain and the prod build in place: only
              # uploads come after, and the runner goes with the job.
              echo "$run" > "$RUNNING"
              [ "$run" != keychain ] || keychain_in || status=$?
              [ "$status" != 0 ] ||
                ${limit:+$limit $minutes} ./check.sh "$run" > "$out/$run.log" 2>&1 || status=$?
              [ ! -d build/check ] || mv build/check "$out/$run"
              pkill -9 -f "$PWD/build/Browser.app/" || true
              [ "$run" != keychain ] || [ -z "${was:-}" ] || keychain_out
              rm -f "$RUNNING"
              # A run that passes may have skipped steps, or all of itself, such as when the app
              # wasn't the active one.
              skipped=$(grep '^skip: ' "$out/$run.log" | cut -c7- | tr '|\n' '/;' | sed 's/;$//')
              # A run that skips all of itself, as one whose build lacks what it checks, says why on a
              # "skip all: " line, and its row says skip, so nobody reads it as a pass (#2284).
              whole=$(grep -m1 '^skip all: ' "$out/$run.log" | cut -c11- | tr '|' '/') || true
              if [ "$status" = 0 ] && [ -n "$whole" ]; then
                result="skip: $whole"
              elif [ "$status" = 0 ]; then
                result="passed in $((SECONDS - start)) s${skipped:+, skipping: $skipped}"
              else
                said=$(grep -m1 '^FAIL' "$out/$run.log" | cut -c7- | tr '|' '/') || true
                result="failed ($status): $said"
                # A quarantined failure shows, but doesn't fail the check (#2197).
                if issue=$(sh check/quarantine.sh match mac "$run" "" "$said"); then
                  result="quarantined, $issue: $result"
                  echo "::warning::The $run run failed, quarantined under $issue. Its log: $run.log in the artifact."
                else
                  failed=1
                  echo "::error::The $run run failed. Its log: $run.log in the artifact."
                fi
              fi
              ;;
            *)
              case " $VM_RUNS " in
              *" $run "*) result="skipped: the check VM does it, as the workflow's header says why" ;;
              *) result="skipped: not asked for" ;;
              esac
              ;;
            esac
            printf '%s\t%s\n' "$run" "$result" >> "$RESULTS"
            echo "| $run | $result |" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          kill "$answering" || true
          [ ! -s "$out/local-network.log" ] || cat "$out/local-network.log"
          { echo; sh check/quarantine.sh list mac; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      # A Runs step cut at its limit names the run it was in, with that run's last lines, and gives
      # it a failed row, so the results and the check's artifact below say which run it was (#4036).
      # The runs after it have no row, which complete names.
      - name: Cut run
        if: ${{ always() && steps.checks.outcome != 'skipped' }}
        env:
          RESULTS: ${{ runner.temp }}/results/mac-${{ matrix.shard }}.tsv
          RUNNING: ${{ runner.temp }}/running
          LIMIT: ${{ steps.limit.outputs.minutes }}
        run: |
          [ -e "$RUNNING" ] || exit 0
          run=$(cat "$RUNNING")
          out=$RUNNER_TEMP/check
          pkill -9 -f "$PWD/build/Browser.app/" || true
          [ ! -d build/check ] || mv build/check "$out/$run" || true
          last=$(tail -1 "$out/$run.log" 2> /dev/null | tr '|\t' '/ ') || true
          mkdir -p "$(dirname "$RESULTS")"
          why="still going when the Runs step was cut at its $LIMIT minutes"
          printf '%s\tfailed: %s; its last line: %s\n' "$run" "$why" "${last:-none}" >> "$RESULTS"
          echo "| $run | failed: $why |" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::The Runs step was cut at its $LIMIT minutes in the $run run."
          echo "Its log is $run.log in the artifact. Its last lines:"
          tail -40 "$out/$run.log" 2> /dev/null || echo "(no log)"
          exit 1

      - name: Back to light
        if: ${{ always() && steps.light.outcome == 'success' }}
        run: |
          [ "$(osascript -e 'tell application "System Events" to tell appearance preferences to get dark mode')" = false ] ||
            { echo "::error::the run left the Mac dark, which it found light (#4445)"; exit 1; }

      # The lists this run's adblock-parity blocked with, for a run on another OS to take with
      # lists_from (#2111). A few MB, apart from the check's artifact, which can be a GB.
      - if: ${{ !cancelled() && hashFiles('app/build/adblock-parity-lists/snapshot.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: adblock-parity-lists
          path: app/build/adblock-parity-lists
          overwrite: true

      # The results first, a few hundred bytes, so complete still names each run's result when
      # the check folder's upload fails or doesn't end, as on Windows (#3471, #3720).
      - id: results
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: results-mac-${{ matrix.shard }}
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
      # A failed first try gets a second, as a name lookup or GitHub's side can fail for a moment
      # (ENOTFOUND on main's 44965780143). The first's failure alone doesn't fail the job; the
      # second's does, and complete still fails a shard whose rows never came.
      - if: ${{ always() && steps.results.outcome == 'failure' }}
        run: sleep 15
      - if: ${{ always() && steps.results.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: results-mac-${{ matrix.shard }}
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          overwrite: true
      # Up to 500 MB, which takes 15 to 55 s. Its failure, such as GitHub's side timing out on
      # making the artifact, or a stall ended at the limit, doesn't make the job's result: the
      # Runs step's exit does, so a passed check stays green and a failed one red (#3720).
      - id: folder
        if: ${{ always() }}
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: check-mac${{ matrix.shard != 0 && format('-{0}', matrix.shard) || '' }}
          # Without the copies of the app keychain signs, 2.2 GB of them (#2205).
          path: |
            ${{ runner.temp }}/check
            !${{ runner.temp }}/check/**/*.app
          if-no-files-found: ignore
      - if: ${{ always() && steps.folder.outcome == 'failure' }}
        run: |
          echo "::warning::The check folder's artifact didn't upload, so this job's run logs and captures are missing; each run's result stands, in results-mac-${{ matrix.shard }} and the summary."
          echo "The check folder's artifact didn't upload; the results above stand." >> "$GITHUB_STEP_SUMMARY"

  # A run with no result, such as one its job's time ran out before, fails the check, so a run
  # missing from the summary can't read as passed (#2271).
  complete:
    needs: [gate, build, check]
    if: ${{ !cancelled() && needs.gate.outputs.check == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # With app/check, whose runs check.sh lists: without them it listed none, so this job said
          # every run had a result after a night whose time ran out (44322076346).
          sparse-checkout: |
            .github/scripts
            app/check.sh
            app/check
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: results-mac-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - env:
          RUNS: ${{ inputs.runs }}
        run: |
          named=
          case $RUNS in '' | all) ;; *) named=$RUNS ;; esac
          if missing=$(.github/scripts/runs.sh missing "$RUNNER_TEMP/results" $named); then
            echo "Every run has a result."
          else
            echo "::error::No result for: $missing. A check job ran out of time or stopped before them, or check.sh has no such run."
            printf 'Failed: no result for %s.\n' "$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # The default runs' verdict on main, the night's or a train's, keeps the workflow's issue: a
  # dispatched run reports too, as its pass is the only one the night won't repeat on that commit.
  # One verdict for all its jobs: it fails when one failed, or ran out of its time, which cancels
  # it, as complete then runs and the run itself wasn't cancelled, or when a run has no result.
  report:
    needs: [gate, build, check, complete]
    if: ${{ always() && needs.gate.outputs.check == 'true' && github.ref == 'refs/heads/main' && github.repository == 'MartinPTielemans/ilo' && inputs.runs == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
    steps:
      # With app/check, whose quarantine keeps a quarantined run's issue open.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            app/check
      # A build job that runs out its time is cancelled, not failed, and skips the check jobs, so
      # report would say nothing. The check job that built the app before #3917 failed the run when
      # it ran out, so this counts it as a failure. A run someone cancelled is still no verdict.
      - id: timeout
        if: ${{ !cancelled() && needs.build.result == 'cancelled' }}
        run: echo "build=true" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ (needs.build.result == 'failure' || steps.timeout.outputs.build == 'true' || needs.check.result == 'failure' || needs.complete.result == 'failure' || (needs.check.result == 'cancelled' && needs.complete.result == 'success')) && 'failure' || needs.check.result }}
          FOUND: ${{ needs.build.outputs.found }}
        run: .github/scripts/main-check.sh report "$RESULT" "$FOUND"
