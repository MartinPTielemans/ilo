# The browser on the Mac, run and checked by app/check.sh (AGENTS.md, Verifying), on the Mac engine
# built from this commit's core, on GitHub's hosted Apple silicon runners, which are free for a
# public repository. It runs on main each night and by hand, which the integrator does on main
# after each merge train (#871): never a pull request. It never builds an engine: it takes the
# newest engine-mac release in this commit's history (engine/fetch.sh), which the owner's Mac
# publishes each night main's core or engine changed (tools/mac-nightly.sh). A commit whose
# core/public/browser_core.h no published engine has fails, saying so, as nothing can run it, and
# is checked the night after one is. Every run in app/check/ shows in the summary: passed, failed,
# or skipped and why, with the lines a run that passed skipped. A failure on main opens an issue,
# which the next run that passes closes (.github/scripts/main-check.sh).
# The 2026-10-28 trial (branch ci/mac-check) found the runner a VM of 3 cores and 7.5 GB with a
# 1024 by 768 screen, which the job sets to 1920 by 1080, where Metal, windows, making an app
# active, window captures, IME, keys and focus work, but scrolling drew 35-41 frames a second: it
# checks behaviour, never the performance gate (docs/roadmap.md), whose numbers come from the
# owner's Mac.
# Its default runs, the night's and a train's, are every run check.sh does unnamed but VM_RUNS, the
# runs a release still needs from the owner's MacBook's check VM, each here with its reason (#2205):
# - clear: in 2 of 5 runs here the tab Clear Browsing Data opened drew nothing in the page area,
#   so its dialog never had the keyboard; the VM passes it (#2248).
# switch-frames runs here: its empty page area through a switch, here in 3 of 4 runs, is on the VM
# too, about half the time, and quarantined on the Mac under #2248 (check/quarantine.mac).
# And one part of a run that passes here, which skips it, saying so:
# - window's sidebar against Dia's composite: the runner's AppKit material is darker than the one
#   Dia was measured over (#1554).
# sync-devices runs here, in about 200 s, against the run's own ilo-server, its copies handing each
# other the active app as each needs the keyboard (#589).
# Of the runs check.sh does only when named, the runner passes store, sync-extensions, adblock-live,
# adblock-parity, adblock-native, passwords-live, updates, nightly, update-checks, shots, and
# keychain asked for alone, which builds the prod build it needs. perf and adblock-cost measure, so
# they stay on the owner's Mac (here perf had ilo's memory 48 to 103 % over Chrome's); widevine and
# tab-drag are Linux's.
name: Check on macOS

on:
  # 05:23 UTC, after the owner's Mac builds the night's engine at 03:00 in Europe (tools/mac-nightly.sh).
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: The runs to do, such as "load tabs", or "all"; empty for the ones the Mac runner passes
        default: ''
      rebuild:
        description: Build the app, even if a check of this commit kept one
        type: boolean
        default: false
      trace:
        description: >-
          The trace categories for tabs and perf's traced switches (app/check/lib.sh), such as
          #2377's, latency among them; empty for latency alone in tabs and no traced switches
        default: ''

# Main's running check finishes, with only the newest dispatch or night waiting behind it; a branch's
# dispatch replaces the one before it.
concurrency:
  group: check-mac-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Whether to check this commit: a scheduled run, in ilo itself and not a fork, checks only a commit
  # no run has checked yet; a dispatched one always does.
  gate:
    if: github.event_name != 'schedule' || github.repository == 'MartinPTielemans/ilo'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      check: ${{ github.event_name != 'schedule' || steps.seen.outputs.seen != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: seen
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/main-check.sh seen

  check:
    needs: gate
    if: needs.gate.outputs.check == 'true'
    # Named apart when it does other runs than the default ones, so it's no verdict on the commit.
    name: ${{ inputs.runs != '' && 'check (runs asked for)' || 'check' }}${{ matrix.shard != 0 && format(' {0}/3', matrix.shard) || '' }}
    # runs=all takes longer than the job's 120 minutes, so it's dealt across three jobs, each with
    # its share of the runs (.github/scripts/runs.sh, #2271). Any other list is one job's.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.runs == 'all' && '[1, 2, 3]' || '[0]') }}
    runs-on: macos-26
    # The default runs take about 73 min here, after about 6 of setting up.
    timeout-minutes: 120
    permissions:
      contents: read
      # A re-run reads the run's earlier attempts (main-check.sh rerun).
      actions: read
    outputs:
      found: ${{ steps.engine.outputs.found }}
    defaults:
      run:
        working-directory: app
    env:
      # The runs a release still needs from the check VM, as the header says why: one leaves the
      # list once it passes on the runner (#2248).
      VM_RUNS: clear
    steps:
      # With the history, where fetch.sh looks for the engine's commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A re-run's pass would show over the failure of the attempt before it.
      - if: ${{ github.run_attempt != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../.github/scripts/main-check.sh rerun

      # A run with no engine checks nothing, so it fails rather than pass, and the night after takes
      # it as not checked (main-check.sh seen) (#1563).
      - id: engine
        name: Engine
        run: |
          status=0
          ../engine/fetch.sh > /dev/null 2> "$RUNNER_TEMP/fetch.log" || status=$?
          cat "$RUNNER_TEMP/fetch.log" >&2
          case $status in
          0) echo "found=true" >> "$GITHUB_OUTPUT" ;;
          2)
            why=$(tail -1 "$RUNNER_TEMP/fetch.log")
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::error::No Mac engine fits this commit: nothing was checked. $why"
            printf 'Failed: no Mac engine fits this commit: nothing was checked.\n\n%s\n' "$why" >> "$GITHUB_STEP_SUMMARY"
            exit 1
            ;;
          *) exit "$status" ;;
          esac

      # The runs this job does.
      - id: runs
        if: ${{ steps.engine.outputs.found == 'true' }}
        env:
          RUNS: ${{ inputs.runs }}
          SHARD: ${{ matrix.shard }}
        run: |
          case $RUNS in
          '')
            runs=
            for run in $(sh check.sh --runs default); do
              case " $VM_RUNS " in *" $run "*) ;; *) runs="$runs $run" ;; esac
            done
            ;;
          all) runs=$(../.github/scripts/runs.sh shard "$SHARD") ;;
          *) runs=$RUNS ;;
          esac
          echo "list= $(echo $runs) " | tee -a "$GITHUB_OUTPUT"

      # The runner's 1024 by 768 screen is too small for the windows the checks lay out for the VMs',
      # and it reduces transparency, which draws the window's material opaque over any backdrop,
      # and motion, under which the app moves nothing (#1529) where the checks time its motion
      # (#1554). Before the build, which the Dock and the windows' layout settle over.
      - if: ${{ steps.engine.outputs.found == 'true' }}
        run: |
          swift ../.github/scripts/display-mode.swift 1920 1080
          for setting in reduceTransparency reduceMotion; do
            defaults write com.apple.universalaccess "$setting" -bool false
            [ "$(defaults read com.apple.universalaccess "$setting")" = 0 ] ||
              { echo "::error::$setting stayed on"; exit 1; }
          done

      # The app another check of this commit built, if one kept it (app-artifact.sh), unless a run
      # asked for builds one of its own with build.sh updates, which needs the build's target/, or
      # keychain, which needs the prod build.
      - id: kept
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          run=
          case " $RUNS " in
          *" all "* | *" updates "* | *" nightly "* | *" update-checks "* | *" keychain "*) ;;
          *) [ "$REBUILD" = true ] || run=$(../.github/scripts/app-artifact.sh find "app-mac-$GITHUB_SHA") ;;
          esac
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
      - if: ${{ steps.kept.outputs.run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: app-mac-${{ github.sha }}
          path: ${{ runner.temp }}/app
          run-id: ${{ steps.kept.outputs.run }}
          github-token: ${{ github.token }}
      - id: unpacked
        if: ${{ steps.kept.outputs.run != '' }}
        run: ../.github/scripts/app-artifact.sh unpack "$(../engine/fetch.sh)" "$RUNNER_TEMP/app/app.tar"

      - if: ${{ steps.kept.outputs.run == '' }}
        run: rustup update stable --no-self-update

      # Every ref reads main's build cache, and main alone saves one: a copy saved by each
      # branch pushed main's out of the repository's 10 GB (#1969).
      - id: cache
        if: ${{ steps.kept.outputs.run == '' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: check-mac-${{ hashFiles('app/Cargo.lock', 'app/setup.sh', 'app/patches/**') }}
          restore-keys: check-mac-

      # The keychain run needs the prod build, on the Release engine the night publishes, as it uses
      # the real Keychain: asked for alone, the job builds that.
      - id: build
        if: ${{ steps.kept.outputs.run == '' }}
        run: ./setup.sh prebuilt && ./build.sh ${{ inputs.runs == 'keychain' && 'prod' || '' }}
      # And it adds its copies to the cookie key's partition with KEYCHAIN_PASSWORD, the password of
      # the default keychain the key is made in, the login keychain, whose password on the runner
      # isn't known: the job makes a default keychain of its own with one it knows. securityd keeps
      # the login keychain open, so one made anew in its place wouldn't unlock.
      - if: ${{ steps.engine.outputs.found == 'true' && inputs.runs == 'keychain' }}
        run: |
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          keychain="$HOME/Library/Keychains/check.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          echo "KEYCHAIN_PASSWORD=$password" >> "$GITHUB_ENV"

      # For the next check of this commit, for 3 days, but never the prod build.
      - if: ${{ steps.build.outcome == 'success' && inputs.runs != 'keychain' }}
        run: ../.github/scripts/app-artifact.sh pack "$(../engine/fetch.sh)" "$RUNNER_TEMP/app.tar"
      - if: ${{ steps.build.outcome == 'success' && inputs.runs != 'keychain' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-mac-${{ github.sha }}
          path: ${{ runner.temp }}/app.tar
          retention-days: 3
          overwrite: true

      - if: ${{ steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The sync-account, sync-devices and sync-extensions runs sign in to an ilo-server of their
      # own, on SQLite with a throwaway account, never the hosted one: built from the server's repo
      # at the commit check-linux.yml builds, when the runs include one, as the default ones do.
      - id: server
        if: ${{ steps.engine.outputs.found == 'true' && (contains(steps.runs.outputs.list, ' sync-account ') || contains(steps.runs.outputs.list, ' sync-devices ') || contains(steps.runs.outputs.list, ' sync-extensions ')) }}
        uses: actions/checkout@v4
        with:
          repository: MartinPTielemans/ilo-server
          ref: 882f2736e5a3b228543ae33b821aeeb52f80426d
          path: app/.deps/ilo-server

      # Main alone saves, as for the build cache above (#1969).
      - id: server-cache
        if: ${{ steps.server.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: app/.deps/ilo-server/target
          key: ilo-server-mac-882f2736e5a3b228543ae33b821aeeb52f80426d

      - if: ${{ steps.server.outcome == 'success' }}
        working-directory: app/.deps/ilo-server
        run: |
          # The server's passkeys link OpenSSL, which Homebrew has on the runner's image.
          brew list openssl@3 > /dev/null 2>&1 || brew install openssl@3
          OPENSSL_DIR=$(brew --prefix openssl@3) cargo build --release --locked
          echo "ILO_SERVER=$PWD/target/release/ilo-server" >> "$GITHUB_ENV"

      - if: ${{ steps.server-cache.outcome == 'success' && steps.server-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: app/.deps/ilo-server/target
          key: ilo-server-mac-882f2736e5a3b228543ae33b821aeeb52f80426d

      # macOS asks Screen Recording, Input Monitoring, the camera and the microphone of the process
      # responsible for the app, here the runner's agent that started the job, not of the app: once media's call and
      # tab share reached Chromium's capture, UserNotificationCenter's question took the app's
      # activation, and the run's clicks and keys went nowhere (#1554). The check VMs answered
      # it once; a hosted runner is new each time, with SIP off, so the job grants them, and
      # Accessibility for the notifications run's banners, to the processes it runs under. Each grant is read back, and a missing one fails the job.
      - if: ${{ steps.engine.outputs.found == 'true' }}
        run: |
          now=$(date +%s)
          grant() { # <database> <service> <client path>
            sudo sqlite3 "$1" "INSERT OR REPLACE INTO access (service, client, client_type,
              auth_value, auth_reason, auth_version, indirect_object_identifier, flags, last_modified)
              VALUES ('$2', '$3', 1, 2, 4, 1, 'UNUSED', 0, $now)"
            [ "$(sudo sqlite3 "$1" "SELECT auth_value FROM access WHERE service = '$2' AND client = '$3'")" = 2 ] ||
              { echo "::error::$2 wasn't granted to $3"; exit 1; }
          }
          system="/Library/Application Support/com.apple.TCC/TCC.db"
          user="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          # Screen capture asks replayd too, which keeps its own list of what it lets record, by
          # executable path: the app's, its helpers', and the processes the job runs under.
          approvals="$HOME/Library/Group Containers/group.com.apple.replayd/ScreenCaptureApprovals"
          paths=$(find -L "$PWD/build/Browser.app" -path '*/Contents/MacOS/*' -type f -perm -u+x)
          pid=$$
          while [ "$pid" -gt 1 ]; do
            path=$(ps -o comm= -p "$pid")
            case $path in
            /*)
              grant "$system" kTCCServiceScreenCapture "$path"
              grant "$system" kTCCServiceListenEvent "$path"
              # notifications presses macOS's banners through the accessibility API (check/banner.mm).
              grant "$system" kTCCServiceAccessibility "$path"
              grant "$user" kTCCServiceCamera "$path"
              grant "$user" kTCCServiceMicrophone "$path"
              paths="$paths
          $path"
              ;;
            esac
            pid=$(ps -o ppid= -p "$pid" | tr -d ' ')
          done
          # The app by its bundle and its path too, for a request that names it.
          for service in kTCCServiceCamera kTCCServiceMicrophone; do
            sudo sqlite3 "$user" "INSERT OR REPLACE INTO access (service, client, client_type,
              auth_value, auth_reason, auth_version, indirect_object_identifier, flags, last_modified)
              VALUES ('$service', 'dev.browser.app', 0, 2, 4, 1, 'UNUSED', 0, $now)"
            grant "$user" "$service" "$PWD/build/Browser.app/Contents/MacOS/Browser"
          done
          echo "$paths" | sed 's/^ *//' | while read -r path; do
            [ -n "$path" ] || continue
            defaults write "$approvals" "$path" -date "3000-01-01 00:00:00 +0000"
            echo "approved $path"
          done
          # Each reads them again as it starts. The user's tccd, from boot, stays through killall
          # and kept prompting for the microphone granted here (41748701502), so launchd restarts it.
          sudo killall tccd || true
          launchctl kickstart -k "gui/$(id -u)/com.apple.tccd"
          killall replayd || true

      # Each run alone, so one failing doesn't hide the rest, and each keeps its own build/check.
      # Each of the job's share of check.sh's runs gets a line in its results, done or skipped, which
      # the complete job reads.
      - name: Runs
        if: ${{ steps.engine.outputs.found == 'true' }}
        env:
          RUNS: ${{ steps.runs.outputs.list }}
          SHARD: ${{ matrix.shard }}
          RESULTS: ${{ runner.temp }}/results/mac-${{ matrix.shard }}.tsv
          CHECK_TRACE_CATEGORIES: ${{ inputs.trace }}
        run: |
          out=$RUNNER_TEMP/check
          mkdir -p "$out" "$(dirname "$RESULTS")"
          all=$(../.github/scripts/runs.sh shard "$SHARD")
          runs=$RUNS
          {
            echo "| Run | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          # macOS asks whether the runner's agent, which it holds responsible for the app, may find
          # devices on the local network, in UserNotificationCenter, at some point after anything the
          # job started reaches the default route's address, as webrtc's STUN server is. It took the
          # app's activation mid-run and the run's keys went nowhere: in webrtc, and in handback,
          # which came later in the same job (#2205). Local Network can't be granted ahead like the
          # others, a check VM answered once, and reaching that address from the job didn't make it
          # ask, so through every run the job answers that question alone with Allow, through
          # System Events with the Accessibility granted above, once the question has made
          # UserNotificationCenter the active app, so the runs keep the runner's 3 cores between.
          (
            while :; do
              sleep 0.5
              case $(lsappinfo info -only bundleid "$(lsappinfo front)" 2> /dev/null) in
              *UserNotificationCenter*) ;;
              *) continue ;;
              esac
              asked=$(osascript -e 'tell application "System Events"
                if not (exists process "UserNotificationCenter") then return ""
                tell process "UserNotificationCenter"
                  if (count of windows) is 0 then return ""
                  set asked to (value of every static text of window 1) as text
                  if asked does not contain "local network" then return ""
                  click button "Allow" of window 1
                  return asked
                end tell
              end tell' 2> /dev/null) || true
              [ -z "$asked" ] || echo "$(date -u +%T) allowed: $asked" >> "$out/local-network.log"
            done
          ) &
          answering=$!
          # GNU's timeout, which macOS doesn't have under that name, if the runner has it.
          limit=$(command -v timeout || command -v gtimeout || true)
          failed=0
          for run in $all; do
            case " $runs " in
            *" $run "*)
              start=$SECONDS
              status=0
              # Perf measures Chrome beside the app.
              minutes=20m
              [ "$run" != perf ] || minutes=40m
              ${limit:+$limit $minutes} ./check.sh "$run" > "$out/$run.log" 2>&1 || status=$?
              [ ! -d build/check ] || mv build/check "$out/$run"
              pkill -9 -f "$PWD/build/Browser.app/" || true
              # A run that passes may have skipped steps, or all of itself, such as when the app
              # wasn't the active one.
              skipped=$(grep '^skip: ' "$out/$run.log" | cut -c7- | tr '|\n' '/;' | sed 's/;$//')
              # A run that skips all of itself, as one whose build lacks what it checks, says why on a
              # "skip all: " line, and its row says skip, so nobody reads it as a pass (#2284).
              whole=$(grep -m1 '^skip all: ' "$out/$run.log" | cut -c11- | tr '|' '/') || true
              if [ "$status" = 0 ] && [ -n "$whole" ]; then
                result="skip: $whole"
              elif [ "$status" = 0 ]; then
                result="passed in $((SECONDS - start)) s${skipped:+, skipping: $skipped}"
              else
                said=$(grep -m1 '^FAIL' "$out/$run.log" | cut -c7- | tr '|' '/') || true
                result="failed ($status): $said"
                # A quarantined failure shows, but doesn't fail the check (#2197).
                if issue=$(sh check/quarantine.sh match mac "$run" "" "$said"); then
                  result="quarantined, $issue: $result"
                  echo "::warning::The $run run failed, quarantined under $issue. Its log: $run.log in the artifact."
                else
                  failed=1
                  echo "::error::The $run run failed. Its log: $run.log in the artifact."
                fi
              fi
              ;;
            *)
              case " $VM_RUNS " in
              *" $run "*) result="skipped: the check VM does it, as the workflow's header says why" ;;
              *) result="skipped: not asked for" ;;
              esac
              ;;
            esac
            printf '%s\t%s\n' "$run" "$result" >> "$RESULTS"
            echo "| $run | $result |" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          kill "$answering" || true
          [ ! -s "$out/local-network.log" ] || cat "$out/local-network.log"
          { echo; sh check/quarantine.sh list mac; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - if: ${{ always() && steps.engine.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: check-mac${{ matrix.shard != 0 && format('-{0}', matrix.shard) || '' }}
          # Without the copies of the app keychain signs, 2.2 GB of them (#2205).
          path: |
            ${{ runner.temp }}/check
            !${{ runner.temp }}/check/**/*.app
          if-no-files-found: ignore
      - if: ${{ always() && steps.engine.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: results-mac-${{ matrix.shard }}
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore

  # A run with no result, such as one its job's time ran out before, fails the check, so a run
  # missing from the summary can't read as passed (#2271).
  complete:
    needs: [gate, check]
    if: ${{ !cancelled() && needs.gate.outputs.check == 'true' && needs.check.outputs.found == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            app/check.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: results-mac-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - env:
          RUNS: ${{ inputs.runs }}
        run: |
          named=
          case $RUNS in '' | all) ;; *) named=$RUNS ;; esac
          if missing=$(.github/scripts/runs.sh missing "$RUNNER_TEMP/results" $named); then
            echo "Every run has a result."
          else
            echo "::error::No result for: $missing. A check job ran out of time or stopped before them, or check.sh has no such run."
            printf 'Failed: no result for %s.\n' "$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # The default runs' verdict on main, the night's or a train's, keeps the workflow's issue: a
  # dispatched run reports too, as its pass is the only one the night won't repeat on that commit.
  report:
    needs: [gate, check]
    if: ${{ always() && needs.gate.outputs.check == 'true' && github.ref == 'refs/heads/main' && github.repository == 'MartinPTielemans/ilo' && inputs.runs == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
    steps:
      # With app/check, whose quarantine keeps a quarantined run's issue open.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            app/check
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.check.result }}
          FOUND: ${{ needs.check.outputs.found }}
        run: .github/scripts/main-check.sh report "$RESULT" "$FOUND"
