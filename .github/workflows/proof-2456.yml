# Proof only (#2456): whether sites with strict fraud checks load in the released ilo and main's,
# beside Google Chrome on the same runner, and whether a page can ask to share the screen with no
# click.
name: Proof 2456

on:
  push:
    branches: ['fix/strict-sites-2456-*']

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/apt-install
        with:
          packages: >-
            libclang-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
            libvulkan1 mesa-vulkan-drivers libegl1 libgl1-mesa-dri xvfb xauth openbox imagemagick
            dbus-daemon flatpak
      - name: The released Flatpak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          dir=$(mktemp -d)
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "released $tag"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p ilo-linux-x86_64.flatpak -D "$dir"
          flatpak install --user -y --noninteractive "$dir/ilo-linux-x86_64.flatpak"
      # Main's app, this branch being main and the proof's files, built as check-linux builds it, on
      # the engine main fetches, from main's build cache.
      - name: Main's engine
        working-directory: app
        run: |
          ../engine/fetch.sh
          git log -1 --format='main %H %s' "$(git merge-base HEAD origin/main)"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: check-linux-${{ hashFiles('app/Cargo.lock', 'app/linux/Cargo.lock', 'app/setup.sh', 'app/patches/**') }}
          restore-keys: |
            check-linux-
            app-linux-
      - name: Main's app
        working-directory: app
        run: rustup update stable --no-self-update && ./setup.sh && ./build.sh
      - run: dbus-run-session -- xvfb-run -a -s '-screen 0 1440x900x24' bash .github/proof-2456.sh "$PWD/app/build/Browser"
      - if: always()
        run: cat "$RUNNER_TEMP/proof/summary" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-2456
          path: ${{ runner.temp }}/proof
          if-no-files-found: ignore
