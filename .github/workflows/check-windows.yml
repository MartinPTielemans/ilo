# The browser on Windows, run and checked by app/check.sh (AGENTS.md, Verifying) under Git Bash, on
# the Windows engine built from this commit's core. It runs on main each night and by hand, which
# the integrator does on main after each merge train (#871), on GitHub's hosted runners: never a
# pull request, and never the self-hosted runner, which builds the engine and holds Microsoft's
# toolchain. A commit whose core/public/browser_core.h no published engine has is skipped, as
# nothing can run it: its check job shows as skipped, with a warning saying why. Every run in
# app/check/ shows in the summary: passed, failed, or skipped and why. A failure on main opens an
# issue, which the next run that passes closes (.github/scripts/main-check.sh).
name: Check on Windows

on:
  # 04:23 UTC, after the Windows engine's nightly build at 02:00 (engine-windows-cross.yml).
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: The runs to do, such as "load tabs", or "all"; empty for the ones Windows passes
        default: ''
      log:
        description: The app's debug log areas for this run, such as "keys,drag" (BROWSER_LOG, app/src/logging.rs); empty for none
        default: ''
      rebuild:
        description: Build the app, even if a check of this commit kept one
        type: boolean
        default: false
      trace:
        description: >-
          The trace categories for tabs and perf's traced switches (app/check/lib.sh), such as
          #2377's, latency among them; empty for latency alone in tabs and no traced switches
        default: ''

concurrency:
  group: check-windows-${{ github.ref }}
  # Main's run in progress finishes, and while it runs a newer dispatch's or the night's pending run
  # replaces the older pending one; a branch's newer dispatch cancels its older run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Whether to check this commit: a scheduled run, in ilo itself and not a fork, checks only a commit
  # no run has checked yet; a dispatched one always does.
  gate:
    if: github.event_name != 'schedule' || github.repository == 'MartinPTielemans/ilo'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      check: ${{ github.event_name != 'schedule' || steps.seen.outputs.seen != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: seen
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/main-check.sh seen

  # Whether an engine fits, alone, so that a commit none fits shows its check as skipped, not as
  # passed with nothing run. On Linux, so the answer costs no Windows runner (#2199): fetch.sh
  # picks its engine by uname, which answers here as Git Bash on Windows does.
  engine:
    needs: gate
    if: needs.gate.outputs.check == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: app
    outputs:
      found: ${{ steps.engine.outputs.found }}
    steps:
      # With the history, where fetch.sh looks for the engine's commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: engine
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\ncase "$1" in -s) echo MINGW64_NT-10.0-20348 ;; *) echo "MINGW64_NT-10.0-20348 x86_64" ;; esac\n' \
            >"$RUNNER_TEMP/bin/uname"
          chmod +x "$RUNNER_TEMP/bin/uname"
          status=0
          PATH=$RUNNER_TEMP/bin:$PATH ../engine/fetch.sh > /dev/null 2> "$RUNNER_TEMP/fetch.log" || status=$?
          cat "$RUNNER_TEMP/fetch.log" >&2
          case $status in
          0) echo "found=true" >> "$GITHUB_OUTPUT" ;;
          2)
            why=$(tail -1 "$RUNNER_TEMP/fetch.log")
            echo "::warning::No Windows engine fits this commit, so nothing is built or checked. $why"
            printf 'Skipped: no Windows engine fits this commit, so nothing is built or checked.\n\n%s\n' "$why" >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
            ;;
          *) exit "$status" ;;
          esac

  check:
    needs: engine
    if: ${{ needs.engine.outputs.found == 'true' }}
    # Named apart when it does other runs than the default ones, so it's no verdict on the commit.
    name: ${{ inputs.runs != '' && 'check (runs asked for)' || 'check' }}${{ matrix.shard != 0 && format(' {0}/{1}', matrix.shard, inputs.runs == 'all' && 3 || 2) || '' }}
    # runs=all takes longer than the job's 120 minutes, so it's dealt across three jobs, each with
    # its share of the runs (.github/scripts/runs.sh, #2271). Since 11-12 the default runs take longer
    # too, so they're dealt across two (#2618). Any other list is one job's.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.runs == 'all' && '[1, 2, 3]' || inputs.runs == '' && '[1, 2]' || '[0]') }}
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
      # A re-run reads the run's earlier attempts (main-check.sh rerun).
      actions: read
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      # The areas of the app's debug log a dispatch asks for, on stderr, so in each run's log.
      BROWSER_LOG: ${{ inputs.log }}
      # The driver sends the pointer and the keys as real input, as a hand's go through Windows'
      # capture, foreground and hit test (platform/windows/drive.cc, #2544). The runner's desktop is
      # the check's own, which the driver asks before it takes it.
      BROWSER_DRIVE_REAL: 1
      # How many jobs the runs are dealt across, for runs.sh shard.
      SHARDS: ${{ inputs.runs == 'all' && 3 || 2 }}
      # The runs the Windows driver (platform/windows/drive.cc) is meant to pass so far.
      WINDOWS_RUNS: >-
        load tabs dialogs crash about onboarding import agents access passkeys passwords quit relaunch
        private blank links capture spaces pinned profiles devices pair history appearance adblock-live find
        mcp keys sync sync-account sync-devices split trouble window clear handback restore little
        battery-os adblock adblock-lists adblock-cosmetic adblock-page
        battery calls cards count everyday extensions favorites hosts
        idle media notifications policies popup preview ranking switch-frames translate webrtc windows
        pictures boosts foot-bar peek-motion rules overlays safe-start update-checks shots
      # The runs that don't apply to Windows, a line each with why, which the summary gives. They're
      # skipped even when named.
      WINDOWS_SKIPS: |
        scripting: AppleScript is the Mac's alone
        filled: it hides the Dock and the menu bar, so it runs only in a Mac check VM
        later-launch: a lock left on the keyboard is the X server's
        widevine: only Linux gets Google's Widevine module (decision 1)
        tab-drag: it checks Wayland's drag; the windows run checks the drag on Windows
        updates: Windows' updater is only in a release build, which check.sh doesn't make
        sidebar-right: it checks AppKit's window buttons, the Mac's alone
    steps:
      # setup.sh and the patches it applies need the repository's line endings.
      - run: git config --global core.autocrlf false
        working-directory: .
      # With the history, where fetch.sh looks for the engine's commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A re-run's pass would show over the failure of the attempt before it.
      - if: ${{ github.run_attempt != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../.github/scripts/main-check.sh rerun

      - run: ../engine/fetch.sh > /dev/null

      # The runs this job does.
      - id: runs
        env:
          RUNS: ${{ inputs.runs }}
          SHARD: ${{ matrix.shard }}
        run: |
          case $RUNS in
          '')
            runs=
            for run in $(../.github/scripts/runs.sh shard "$SHARD" "$SHARDS"); do
              case " $(echo $WINDOWS_RUNS) " in *" $run "*) runs="$runs $run" ;; esac
            done
            ;;
          all) runs=$(../.github/scripts/runs.sh shard "$SHARD") ;;
          *) runs=$RUNS ;;
          esac
          echo "list= $(echo $runs) " | tee -a "$GITHUB_OUTPUT"

      # The runs call python3, which the runner names python. The access run reads UI Automation
      # with comtypes (tools/uia-tree.sh).
      - run: |
          rustup update stable --no-self-update
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/bin/python3"
          chmod +x "$RUNNER_TEMP/bin/python3"
          cygpath -w "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          python -m pip install --disable-pip-version-check comtypes==1.4.17

      # Chrome asks before a page opens another app only when Windows names an app for the link's
      # scheme, and the runner has none for the dialogs run's maps: link, which the Mac opens in
      # Maps. The run cancels it, so the stand-in never starts.
      - shell: pwsh
        run: |
          $maps = 'HKCU:\Software\Classes\maps'
          New-Item -Path "$maps\shell\open\command" -Force -Value '"C:\Windows\System32\cmd.exe" /c exit' | Out-Null
          Set-Item -Path $maps -Value 'URL:Maps'
          New-ItemProperty -Path $maps -Name 'URL Protocol' -Value '' -Force | Out-Null

      # The app another check of this commit built, if one kept it (app-artifact.sh), unless a run
      # asked for builds one of its own with build.sh updates, which needs the build's target/.
      - id: kept
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          run=
          case " $RUNS " in
          *" all "* | *" nightly "* | *" update-checks "*) ;;
          *) [ "$REBUILD" = true ] || run=$(../.github/scripts/app-artifact.sh find "app-windows-$GITHUB_SHA") ;;
          esac
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
      - if: ${{ steps.kept.outputs.run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: app-windows-${{ github.sha }}
          path: ${{ runner.temp }}/app
          run-id: ${{ steps.kept.outputs.run }}
          github-token: ${{ github.token }}
      - id: unpacked
        if: ${{ steps.kept.outputs.run != '' }}
        run: ../.github/scripts/app-artifact.sh unpack "$(../engine/fetch.sh)" "$RUNNER_TEMP/app/app.tar"

      # Every ref reads main's build cache, and main alone saves one: a copy saved by each
      # branch pushed main's out of the repository's 10 GB (#1969).
      - id: cache
        if: ${{ steps.kept.outputs.run == '' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: check-windows-${{ hashFiles('app/Cargo.lock', 'app/windows/Cargo.lock', 'app/setup.sh', 'app/patches/**') }}
          restore-keys: |
            check-windows-
            app-windows-

      - id: build
        if: ${{ steps.kept.outputs.run == '' }}
        run: ./setup.sh && ./build.sh

      # For the next check of this commit, for 3 days.
      - if: ${{ steps.build.outcome == 'success' }}
        run: ../.github/scripts/app-artifact.sh pack "$(../engine/fetch.sh)" "$RUNNER_TEMP/app.tar"
      - if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-windows-${{ github.sha }}
          path: ${{ runner.temp }}/app.tar
          retention-days: 3
          overwrite: true

      - if: ${{ steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The runner's screen is 1024 by 768, where the app's 1280 by 800 window doesn't fit and the
      # windows the runs place are kept on screen elsewhere. A screen as big as the ones the Mac's
      # and Linux's runs have, where they fit (#872).
      - shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          "Screen: " + [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      # The notification area showing every icon, rather than keeping new ones in its overflow, so
      # the little run's copy of it shows ilo's as a user who's dragged it out sees it. Explorer
      # reads the setting as it starts, and starts again by itself when it's ended.
      - shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer' -Name EnableAutoTray -Value 0 -Type DWord
          $old = @(Get-Process explorer -ErrorAction SilentlyContinue | ForEach-Object Id)
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          $started = { @(Get-Process explorer -ErrorAction SilentlyContinue | Where-Object { $old -notcontains $_.Id }).Count -gt 0 }
          for ($i = 0; $i -lt 100 -and -not (& $started); $i++) { Start-Sleep -Milliseconds 100 }
          if (-not (& $started)) { Start-Process explorer.exe }
          "Explorer: " + (Get-Process explorer | ForEach-Object Id)

      # Microsoft's Japanese and Korean IMEs, among the user's input methods, for the runs that
      # compose with them (the driver's ime ja and ime ko), which look for them in the user's
      # language list. Language.Basic is the capability that has each, about 100 s from Windows
      # Update; Server 2022 has no Install-Language.
      - name: Japanese and Korean IMEs
        id: ime
        env:
          RUNS: ${{ steps.runs.outputs.list }}
        run: |
          need=
          for run in $(grep -l Get-WinUserLanguageList check/*.sh | sed 's|^check/\(.*\)\.sh$|\1|'); do
            case $RUNS in *" $run "*) need=1 ;; esac
          done
          [ -n "$need" ] || { echo "No run composes with an IME, so none is installed."; exit 0; }
          echo "need=1" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.ime.outputs.need == '1' }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-WindowsCapability -Online -Name "Language.Basic~~~ja-JP~0.0.1.0" | Out-Null
          Add-WindowsCapability -Online -Name "Language.Basic~~~ko-KR~0.0.1.0" | Out-Null
          $languages = Get-WinUserLanguageList
          $languages.Add("ja-JP")
          $languages.Add("ko-KR")
          Set-WinUserLanguageList $languages -Force
          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips

      # The Store's MSIX of this build, for the runs that send something to it, as the links run
      # sends a link (#1427), packed as a release's is (platform/windows/package/msix.sh), when one
      # of the runs reads CHECK_MSIX.
      - name: MSIX
        id: msix
        env:
          RUNS: ${{ steps.runs.outputs.list }}
        run: |
          need=
          for run in $(grep -l CHECK_MSIX check/*.sh | sed 's|^check/\(.*\)\.sh$|\1|'); do
            case $RUNS in *" $run "*) need=1 ;; esac
          done
          [ -n "$need" ] || { echo "No run sends anything to the MSIX, so none is installed."; exit 0; }
          platform/windows/package/msix.sh build/Browser "$RUNNER_TEMP/check.msix"
          {
            echo "path=$(cygpath -w "$RUNNER_TEMP/check.msix")"
            echo "name=$(git config -f branding/windows-store.ini store.identity-name)"
            echo "publisher=$(git config -f branding/windows-store.ini store.publisher)"
          } >> "$GITHUB_OUTPUT"

      # Installed, signed with a certificate made here for the Store's publisher, which only this
      # runner trusts, and named to the runs in CHECK_MSIX. Windows PowerShell, whose Appx module
      # PowerShell 7 loads only through it.
      - name: MSIX install
        if: ${{ steps.msix.outputs.path != '' }}
        shell: powershell
        env:
          MSIX: ${{ steps.msix.outputs.path }}
          NAME: ${{ steps.msix.outputs.name }}
          PUBLISHER: ${{ steps.msix.outputs.publisher }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:PUBLISHER `
            -KeyUsage DigitalSignature -FriendlyName 'ilo check' -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pfx = "$env:RUNNER_TEMP\check-msix.pfx"
          $cer = "$env:RUNNER_TEMP\check-msix.cer"
          $password = ConvertTo-SecureString -String 'check' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          & $signtool.FullName sign /q /fd SHA256 /f $pfx /p check $env:MSIX
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Add-AppxPackage -Path $env:MSIX
          $package = Get-AppxPackage -Name $env:NAME
          "Installed $($package.PackageFullName) in $($package.InstallLocation)"
          "CHECK_MSIX=$($package.PackageFullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The sync-account, sync-devices and sync-extensions runs sign in to an ilo-server of their
      # own, on SQLite with a throwaway account, never the hosted one: built from the server's repo
      # at the commit check-linux.yml builds, when the runs include one.
      - id: server
        if: ${{ (steps.build.outcome == 'success' || steps.unpacked.outcome == 'success') && (contains(steps.runs.outputs.list, ' sync-account ') || contains(steps.runs.outputs.list, ' sync-devices ') || contains(steps.runs.outputs.list, ' sync-extensions ')) }}
        uses: actions/checkout@v4
        with:
          repository: MartinPTielemans/ilo-server
          ref: 882f2736e5a3b228543ae33b821aeeb52f80426d
          path: app/.deps/ilo-server

      # Main alone saves, as for the build cache above (#1969).
      - id: server-cache
        if: ${{ steps.server.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: app/.deps/ilo-server/target
          key: ilo-server-windows-882f2736e5a3b228543ae33b821aeeb52f80426d

      - if: ${{ steps.server.outcome == 'success' }}
        working-directory: app/.deps/ilo-server
        run: |
          # The server's passkeys link OpenSSL, which the runner's image has, or Chocolatey does.
          ssl="/c/Program Files/OpenSSL"
          [ -d "$ssl/include" ] || choco install openssl -y --no-progress > /dev/null
          [ -d "$ssl/include" ] || ssl="/c/Program Files/OpenSSL-Win64"
          # OpenSSL 3's installer keeps its import libraries by compiler and runtime.
          for lib in "$ssl/lib/VC/x64/MD" "$ssl/lib/VC/x64/MT" "$ssl/lib"; do
            [ -e "$lib/libssl.lib" ] || continue
            export OPENSSL_LIB_DIR="$(cygpath -w "$lib")"
            break
          done
          [ -n "${OPENSSL_LIB_DIR:-}" ] || { find "$ssl/lib" -name 'libssl*'; exit 1; }
          export OPENSSL_INCLUDE_DIR="$(cygpath -w "$ssl/include")"
          cargo build --release --locked
          echo "ILO_SERVER=$PWD/target/release/ilo-server.exe" >> "$GITHUB_ENV"
          # Its DLLs, for the server to start.
          cygpath -w "$ssl/bin" >> "$GITHUB_PATH"

      - if: ${{ steps.server-cache.outcome == 'success' && steps.server-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: app/.deps/ilo-server/target
          key: ilo-server-windows-882f2736e5a3b228543ae33b821aeeb52f80426d

      # Each run alone, so one failing doesn't hide the rest, and each keeps its own build/check.
      # Each of the job's share of check.sh's runs gets a line in its results, done or skipped, which
      # the complete job reads.
      - name: Runs
        env:
          RUNS: ${{ steps.runs.outputs.list }}
          SHARD: ${{ matrix.shard }}
          RESULTS: ${{ runner.temp }}/results/windows-${{ matrix.shard }}.tsv
          CHECK_TRACE_CATEGORIES: ${{ inputs.trace }}
        run: |
          out=$RUNNER_TEMP/check
          mkdir -p "$out" "$(dirname "$RESULTS")"
          all=$(../.github/scripts/runs.sh shard "$SHARD" "$SHARDS")
          runs=$RUNS
          # check.sh runs on Windows, and the app has a driver there, only once
          # feat/windows-drive-454 is in.
          windows=
          [ -e check/git-bash.sh ] && windows=1
          driver=
          [ -e platform/windows/drive.cc ] && driver=1
          [ -z "$windows" ] || . check/git-bash.sh
          {
            echo "| Run | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for run in $all; do
            why=
            if [ -z "$windows" ] || [ -z "$driver" ]; then
              why="check.sh runs only on the Mac in this commit; feat/windows-drive-454 brings it to Windows"
            fi
            [ -n "$why" ] || why=$(printf '%s\n' "$WINDOWS_SKIPS" | sed -n "s/^$run: //p")
            case "$why: $runs " in
            ":"*" $run "*)
              start=$SECONDS
              status=0
              # Perf measures Chrome beside the app.
              limit=20m
              [ "$run" != perf ] || limit=40m
              timeout "$limit" ./check.sh "$run" > "$out/$run.log" 2>&1 || status=$?
              # By the app's path, never by image name, which would reach any other Chrome. Before
              # the move, as Windows won't move a folder a process still has a file open in.
              pkill -9 -f "$(cygpath -m "$PWD/build/Browser")/" || true
              # Gone, so the next run doesn't find it still running.
              for _ in $(seq 20); do
                pgrep -f "$(cygpath -m "$PWD/build/Browser")/" > /dev/null || break
                sleep 0.5
              done
              if [ -d build/check ] && ! mv build/check "$out/$run"; then
                cp -r build/check "$out/$run" || true
                rm -rf build/check || true
              fi
              # A run that skips all of itself, as one whose build lacks what it checks, says why on a
              # "skip all: " line, and its row says skip, so nobody reads it as a pass (#2284).
              whole=$(grep -m1 '^skip all: ' "$out/$run.log" | cut -c11- | tr '|' '/') || true
              if [ "$status" = 0 ] && [ -n "$whole" ]; then
                result="skip: $whole"
              elif [ "$status" = 0 ]; then
                result="passed in $((SECONDS - start)) s"
              else
                # A run that ends without a FAIL line, such as one whose tool is missing, mustn't
                # end the loop: the step's shell is bash -eo pipefail.
                said=$(grep -m1 '^FAIL' "$out/$run.log" | cut -c7-) || said=$(tail -1 "$out/$run.log")
                said=$(echo "$said" | tr '|' '/')
                result="failed ($status): $said"
                # A quarantined failure shows, but doesn't fail the check (#2197).
                if issue=$(sh check/quarantine.sh match windows "$run" "" "$said"); then
                  result="quarantined, $issue: $result"
                  echo "::warning::The $run run failed, quarantined under $issue. Its log: $run.log in the artifact."
                else
                  failed=1
                  echo "::error::The $run run failed. Its log: $run.log in the artifact."
                fi
              fi
              ;;
            *)
              result="skipped: ${why:-not tried on Windows yet}"
              ;;
            esac
            printf '%s\t%s\n' "$run" "$result" >> "$RESULTS"
            echo "| $run | $result |" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          { echo; sh check/quarantine.sh list windows; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      # Windows' own Microsoft sign-in, which Chromium logs on or off as it starts (#1345). The core
      # turns it on by default only on a device joined or registered to a work or school directory,
      # which a runner isn't, so here it's off until the CloudAPAuthEnabled policy turns it on, under
      # ilo's key (docs/policies.md): Chromium's, which every other Chromium on the machine reads,
      # leaves it off (engine/patches/ours/chromium-policy-windows-key.patch).
      - name: Microsoft sign-in
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.unpacked.outcome == 'success') }}
        run: |
          out=$RUNNER_TEMP/check
          mkdir -p "$out"
          key='HKCU\SOFTWARE\Policies\ilo'
          chromium='HKCU\SOFTWARE\Policies\Chromium'
          # Git Bash would take reg's and taskkill's switches for paths.
          export MSYS2_ARG_CONV_EXCL='*'
          trap 'for k in "$key" "$chromium"; do reg delete "$k" /v CloudAPAuthEnabled /f > /dev/null 2>&1 || true; done' EXIT
          # Starts the app with a profile of its own, named $1, and checks that it logs $2: 0 for
          # off, 1 for on.
          sign_in() {
            log="$out/sign-in-$1.log"
            build/Browser/chrome.exe "--user-data-dir=$(cygpath -w "$RUNNER_TEMP/sign-in-$1")" \
              --enable-logging=stderr --vmodule=platform_auth_policy_observer=1 \
              < /dev/null > "$log" 2>&1 &
            pid=$!
            said=
            for _ in $(seq 300); do
              said=$(grep -o 'PlatformAuthProviderManager enabled: [01]' "$log" | head -1) || true
              [ -z "$said" ] || break
              sleep 0.1
            done
            taskkill /F /T /PID "$(cat "/proc/$pid/winpid")" > /dev/null 2>&1 || true
            wait "$pid" || true
            echo "$1: ${said:-nothing logged in 30 s}"
            [ "$said" = "PlatformAuthProviderManager enabled: $2" ] || {
              echo "::error::With $1, Microsoft sign-in should log enabled: $2. Its log: sign-in-$1.log in the artifact."
              exit 1
            }
          }
          reg delete "$key" /v CloudAPAuthEnabled /f > /dev/null 2>&1 || true
          reg delete "$chromium" /v CloudAPAuthEnabled /f > /dev/null 2>&1 || true
          sign_in no-policy 0
          reg add "$chromium" /v CloudAPAuthEnabled /t REG_DWORD /d 1 /f > /dev/null
          sign_in chromium-key 0
          reg delete "$chromium" /v CloudAPAuthEnabled /f > /dev/null 2>&1 || true
          reg add "$key" /v CloudAPAuthEnabled /t REG_DWORD /d 1 /f > /dev/null
          sign_in policy-on 1

      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-windows${{ matrix.shard != 0 && format('-{0}', matrix.shard) || '' }}
          path: ${{ runner.temp }}/check
          if-no-files-found: ignore
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: results-windows-${{ matrix.shard }}
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore

  # A run with no result, such as one its job's time ran out before, fails the check, so a run
  # missing from the summary can't read as passed (#2271).
  complete:
    needs: [engine, check]
    if: ${{ !cancelled() && needs.engine.outputs.found == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            app/check.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: results-windows-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - env:
          RUNS: ${{ inputs.runs }}
        run: |
          named=
          case $RUNS in '' | all) ;; *) named=$RUNS ;; esac
          if missing=$(.github/scripts/runs.sh missing "$RUNNER_TEMP/results" $named); then
            echo "Every run has a result."
          else
            echo "::error::No result for: $missing. A check job ran out of time or stopped before them, or check.sh has no such run."
            printf 'Failed: no result for %s.\n' "$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # The default runs' verdict on main, the night's or a train's, keeps the workflow's issue: a
  # dispatched run reports too, as its pass is the only one the night won't repeat on that commit.
  # An engine that fails to fetch fails the run too.
  report:
    needs: [gate, engine, check]
    if: ${{ always() && needs.gate.outputs.check == 'true' && github.ref == 'refs/heads/main' && github.repository == 'MartinPTielemans/ilo' && inputs.runs == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      issues: write
    steps:
      # With app/check, whose quarantine keeps a quarantined run's issue open.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            app/check
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.engine.result == 'failure' && 'failure' || needs.check.result }}
          FOUND: ${{ needs.engine.outputs.found }}
        run: .github/scripts/main-check.sh report "$RESULT" "$FOUND"
