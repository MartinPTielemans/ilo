# ilobrowser.com, from site/ (site/AGENTS.md). ci.yml calls it for a change to site/, which runs the
# site's checks and nothing else, and on a push to main deploys once they pass. release.yml calls it
# when the owner publishes a release, which puts that release's changelog entry on the site: it is
# then this file as it stood at the release's tag, run on main's site/. By hand on main, it uploads
# a preview to the Worker ilo-site-preview on workers.dev (site/wrangler.jsonc's env.preview),
# which never touches ilobrowser.com, or deploys with live.
#
# Only the deploy job reads the Cloudflare secrets: they're the GitHub environment ilobrowser.com's,
# which only main and v* tags may use (docs/releasing.md). A caller has to pass both by name, or
# they're empty here even in that environment's job, without an error (GitHub's "Reuse workflows").
# With either missing, it deploys nothing: a red once SITE_DEPLOY is `live`, a notice before. A live
# deploy also waits for that environment's SITE_DEPLOY variable to be `live`, so this repo deploys
# ilobrowser.com only once the owner switches the old site repo's deploy off.
name: Site

on:
  workflow_call:
    inputs:
      deploy:
        description: Deploy after the checks
        type: boolean
        default: false
    # Named, never `secrets: inherit`, which would hand over every repository secret. They resolve
    # only in the job that sets the environment, deploy, and check reads neither.
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  workflow_dispatch:
    inputs:
      live:
        description: Deploy ilobrowser.com, rather than upload a preview
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      # A published release's event is on its tag, and the site deploys main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && 'refs/heads/main' || github.sha }}
          persist-credentials: false
          sparse-checkout: site

      - id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          working-directory: site
          cache: true
          cache-dependency-path: site/pnpm-lock.yaml

      - working-directory: site
        run: |
          vp check
          vp test
          vp build

  deploy:
    name: Deploy
    needs: check
    if: ${{ inputs.deploy || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ilobrowser.com
    # One at a time, never cancelled half way.
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - name: Switch
        id: switch
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_DEPLOY: ${{ vars.SITE_DEPLOY }}
          LIVE: ${{ inputs.live }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            # A live site that silently doesn't deploy reads as one that did (#3957).
            if [ "$SITE_DEPLOY" = live ]; then
              echo "::error::SITE_DEPLOY is live, but this job has no CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID: the ilobrowser.com environment needs both, and a workflow calling site.yml has to pass them (docs/releasing.md). Nothing is deployed."
              exit 1
            fi
            echo "::notice::No CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID in the ilobrowser.com environment (docs/releasing.md), so nothing is deployed."
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::The site deploys from main only, not $GITHUB_REF."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$LIVE" != true ]; then
            echo "mode=preview" >> "$GITHUB_OUTPUT"
          elif [ "$SITE_DEPLOY" = live ]; then
            echo "mode=live" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The ilobrowser.com environment's SITE_DEPLOY isn't live (docs/releasing.md), so nothing is deployed."
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.switch.outputs.mode != 'none' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
          sparse-checkout: site

      # The changelog shows only published releases (site/src/changelog.ts). A list that can't be
      # read, or is empty, fails the deploy, rather than one that would publish every dated entry.
      # The home page's stars and contributors are asked for here too (site/tools/numbers.mjs),
      # which keeps the committed ones when GitHub doesn't answer.
      - name: Releases and counts
        if: ${{ steps.switch.outputs.mode != 'none' }}
        # The only step that holds the token, so Install and Build run with none, as with the secrets.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]
            | select((.draft | not) and (.prerelease | not) and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))
            | .tag_name' | sed 's/^v//' | sort -V | tr '\n' ' ')
          if [ -z "$published" ]; then
            echo "::error::No published release of ilo listed, so the changelog would show none."
            exit 1
          fi
          echo "ILO_PUBLISHED=$published" >> "$GITHUB_ENV"
          echo "Published: $published" >> "$GITHUB_STEP_SUMMARY"
          node site/tools/numbers.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      # Without the dependency cache, so the job that holds the token runs nothing another run wrote.
      - if: ${{ steps.switch.outputs.mode != 'none' }}
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          working-directory: site
          run-install: false

      # wrangler too comes from the lockfile, hashes and all, not from the registry at deploy.
      - name: Install
        if: ${{ steps.switch.outputs.mode != 'none' }}
        working-directory: site
        run: vp install --frozen-lockfile

      # Neither secret here: only the Deploy step's wrangler gets them, not the build's plugins.
      - name: Build
        if: ${{ steps.switch.outputs.mode != 'none' }}
        working-directory: site
        run: |
          : "${ILO_PUBLISHED:?The Releases and counts step sets it; a build without it would publish every dated entry}"
          vp build

      - name: Deploy
        if: ${{ steps.switch.outputs.mode != 'none' }}
        working-directory: site
        env:
          MODE: ${{ steps.switch.outputs.mode }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$MODE" = live ]; then
            vp exec wrangler deploy
          else
            vp exec wrangler deploy --env preview
          fi
