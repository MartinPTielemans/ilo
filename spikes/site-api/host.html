<!doctype html>
<html><head><meta charset=utf-8><title>{{page}}</title>
<style>
  :root { color-scheme: light dark; font: 13px/1.4 system-ui, sans-serif; }
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; background: Canvas; }
  header { display: flex; gap: 12px; align-items: center; padding: 6px 12px; border-bottom: 1px solid #8884; }
  header b { font-weight: 600; } header span { opacity: .7; }
  header button { margin-left: auto; font: inherit; }
  iframe { flex: 1; border: 0; width: 100%; }
</style></head>
<body>
<header><b>{{page}}</b><span>Can read: {{grants}}</span><span>Seal {{seal}}</span><button id=refresh>Refresh</button></header>
<iframe id=page data-page="{{page}}" data-grants="{{grants}}" {{sandbox}} src="{{src}}"></iframe>
<script src="/host.js"></script>
</body></html>
