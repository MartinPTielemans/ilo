[package]
name = "browser"
version = "0.2.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# The browser: the UI on our engine, in build/Browser.app.
[[bin]]
name = "Browser"
path = "src/main.rs"

# The UI alone with made-up tabs, for working on how it looks without the engine.
[[bin]]
name = "preview"
path = "src/preview.rs"

# What an MCP client runs to reach the browser's agents (src/agents/bridge.rs).
[[bin]]
name = "mcp-bridge"
path = "src/bridge.rs"

[features]
# The build for daily use (`build.sh prod`): the user's profile and the real Keychain.
prod = []

[dependencies]
gpui = { path = ".deps/zed/crates/gpui" }
# Without threads, which on the web need nightly Rust and a cross-origin-isolated page.
gpui_platform = { path = ".deps/zed/crates/gpui_platform", default-features = false, features = ["font-kit", "runtime_shaders"] }
# The version GPUI decodes with, for a favicon's pixels and the images drawn from them.
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
unicode-segmentation = "1.10"
# Which characters make a word for a field's word moves, as AppKit's: letters, numbers, marks
# and symbols. Already in the tree through GPUI's dependencies.
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
# The emoji picker's table: names, groups and shortcodes, built in as static data.
emojis = "0.9"
# Arc's sidebar and Chromium's Local State, read by the import, and the agents' MCP server's
# JSON-RPC messages.
serde_json = "1"
# The agents' MCP server: the channel its threads hand calls to the UI thread on, and the agents'
# tokens. The server itself is the app's own (src/agents/server.rs).
futures = "0.3"
getrandom = "0.3"
# Safari's bookmarks, a property list.
plist = { version = "1", default-features = false }
# std's clock, which panics on the web, where this one reads the page's.
web-time = "1"
# The local time an agent task's limit resets at. GPUI's dependencies bring it already.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The browser's own ad blocker (src/ad_block.rs), Brave's, MPL-2.0. Without its single-thread
# feature its engine is Send and Sync, as the core asks it on a sequence of its own.
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
# uBlock Origin's response-time filters (src/ad_block/responses.rs), whose regular expressions are
# JavaScript's and some look ahead or behind, which the regex crate doesn't. MIT.
fancy-regex = "0.14"
# The screenshots a task's trace shows, which the core hands over in base64. GPUI's dependencies
# bring it already.
base64 = "0.22"
# Capture's Edit: its marks' round ends, as GPUI strokes with lyon's options, and the marks drawn
# into the picture. GPUI's dependencies bring both already.
lyon = "1.0"
tiny-skia = "0.11"

# What the web's demo has no use for, and can't build: the import's reader of the other browsers'
# history, whose SQLite's C would have to be built for the web.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The other browsers' history, in SQLite files, built in so every system reads them alike.
rusqlite = { version = "0.41", features = ["bundled"] }

# The preview on the web, for the site: GPUI's web platform draws it in a canvas the page hands it.
[target.'cfg(target_family = "wasm")'.dependencies]
# The page's canvas, which the demo draws in (patches/gpui-web-page.patch).
gpui_web = { path = ".deps/zed/crates/gpui_web", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Performance", "Response", "Window", "console"] }
# The browser's random numbers and clock, for the agents' tokens and a task's local time.
getrandom = { version = "0.3", features = ["wasm_js"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

# The session and the timeout of the shell Connect reads the user's PATH from
# (src/agents/clients.rs), in the version GPUI's already brings.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { path = ".deps/zed/crates/gpui_macos" }

# Windows' GPUI platform, for the window the browser embeds GPUI in.
[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { path = ".deps/zed/crates/gpui_windows" }
# The agents' MCP server's named pipe (src/agents/pipe.rs), and the PATH Connect finds Claude Code
# on (src/agents/clients.rs), in the version GPUI's already brings.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

# Zed's workspace takes GPUI's Linux platform without its window systems, so it runs headless
# unless they're asked for here.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { path = ".deps/zed/crates/gpui_platform", features = ["wayland", "x11"] }
# For running GPUI inside Chromium's loop and its window inside the browser's (patches/).
gpui_linux = { path = ".deps/zed/crates/gpui_linux" }
# The wgpu instance, made on a thread while Chromium starts (src/main.rs, launching).
gpui_wgpu = { path = ".deps/zed/crates/gpui_wgpu" }
# Flatpak's portal, for updates (src/flatpak.rs): the D-Bus GPUI's portals already use.
zbus = { version = "5.13", default-features = false, features = ["async-io"] }
futures-lite = "2"
# The wait on the portal's answer (src/flatpak.rs), on the timers zbus already runs on.
async-io = "2"
# The driver's keys and pointer on X11 (platform/linux/drive.rs) and the windows' frames
# (frames.rs), as linux/Cargo.toml has it for the library.
x11rb = { version = "0.13", features = ["xkb", "randr", "xtest"] }
# The driver's pointer and keyboard in the headless sway session (platform/linux/drive_wayland.rs).
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = "0.8"

[build-dependencies]
# 0.73 accepts syn 3 but only builds with syn 2, which 0.72 asks for.
bindgen = "0.72"
cc = "1"

[dev-dependencies]
# The tests draw the UI in GPUI's test windows, with no engine, and simulate the keys typed.
gpui = { path = ".deps/zed/crates/gpui", features = ["test-support"] }

# A fake of Flatpak's portal on a connection of its own, for the updater's tests.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5.13", default-features = false, features = ["async-io", "p2p"] }

# The accessibility adapters GPUI uses, with what they lack upstream (setup.sh): the Mac's with
# VO-Shift-M's menu and a folder's open state (patches/accesskit-macos-actions.patch), and AT-SPI's
# with the expanded state (patches/accesskit-atspi-expanded.patch).
[patch.crates-io]
accesskit_macos = { path = ".deps/accesskit_macos" }
accesskit_atspi_common = { path = ".deps/accesskit_atspi_common" }

# The site's demo, which every visitor downloads, so small over quick to build:
# `cargo build --profile web --target wasm32-unknown-unknown --bin preview`.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
