# The window is the HUD window's material, behind the window, under black at `tint` on a dark
# window and white at `light-tint` on a light one, then the Space's glow (#4087). How see-through
# it is is the user's, in three levels: Less, Standard (`tint`) and More. 0.44 is the dark scale's
# floor, where Paper at 0.6 still holds 3:1, so there's no level under it and none between.
tint-less = 0.64
tint = 0.52
tint-more = 0.44
# What text holds over the window's worst backdrop at each level: primary text (titles, a field's
# own text, a button's label, a chip's key) the palette's 4.5:1 at all three, and gray text
# (placeholders, section labels, a row's detail) these, as the page shows through more. Where
# primary text misses it, the plate right under it takes the least shade of the tint that brings
# it back (#4090).
gray-text-less = 4.5
gray-text = 3.0
gray-text-more = 3.0
# Gray text on a plate in a dark window (the foot's card's second line while the card is shown or
# under the pointer, a page's word on its shown row's plate): the plate is lighter than the window
# beside it, so the gray that reads off it reads less on it, and on a plate it is Paper at this,
# one ink wherever that is. It is Paper itself, the title's ink, as nothing under it holds the
# palette's 4.5:1 and its margin on the shown card's plate at its lightest measured, with a white
# window behind (#6d6d6b at Standard, from the real app's own pixels at 469483355): 4.55, where
# 0.97 reads 4.40 and the state line's 0.75 read 3.39. Over the check VM's desktop alone (#6b6a65
# at Standard, #696762 at More, at f98ded880) it reads 4.76 and 4.96, where the state line read
# 3.51 and 4.28. A light window's gray reads 7.7 or more on its white plate and stays as it is.
plate-gray = 1.0
# The HUD window's material alone, untinted, over a window of white, grey 128 and black behind
# it, on a black desktop, as the app draws it on a Mac with the tint off, measured from its
# window's pixels: the darkest the window can be. The desktop picture comes through what's behind
# as well, and a light one lifts the material over each by up to `material-lift` levels of 255 (13
# over the check VM's own picture, 12 to 13 at every grey). These are the reads with the Mac's
# desktop tinting on, the system's default; with it off there's no lift, and the material reads
# between these and the lifted ones in both looks, so the same range holds it. The window's ground
# over each is the tint's colour at its alpha over these; its lightest is over white, lifted.
material-over-white = 0xa0a0a0
material-over-grey = 0x585858
material-over-black = 0x131313
material-lift = 13.0
# What stands in for the material where the window's look has to be opaque, under rows it covers
# or in the reveal's panel over the page: the ground over grey at Standard. The palette works out
# each level's from the tokens above; this one is for what reads it without a palette, and a test
# holds it to the palette's.
stand-in = 0x303030
# What AppKit draws in the material's place with Reduce Transparency or Increase Contrast, at every
# level: an opaque ground, nothing behind it showing through, so gray text on it holds what it does
# at Less. The window background material's, from the VM's run 6, stands in until the VM reads the
# HUD window's under those settings.
material-solid = 0x333332
# The Space's colour is a glow from the sidebar's foot, not a wash over the window (#4089): an
# ellipse `glow-width` by `glow-height` (its radii) centred on the window's bottom left corner, the
# main colour at `gradient-alpha` there, going in a straight line to nothing at `glow-fade` of the
# way out; and a faint one `far-glow-width` by `far-glow-height` on the top right, the second
# colour (or the main one) at `far-glow`, gone by `far-glow-fade`. The alphas are at the intensity
# a theme starts with; a neutral theme's, under this HSL saturation, is a third as strong.
