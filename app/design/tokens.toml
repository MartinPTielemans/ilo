[radius]
# ilo's four corner radii (ours, #315), and the rule that joins them: a corner nested inside
# another is concentric, so the inner radius is the outer one less the inset between them. Every
# other `radius` key in this file holds one of these, or is derived by that rule, or is the shape
# of a beak, a glyph or a pill (half its height). tokens/tests.rs holds the file to it.
# Buttons, chips, the find bar, the header's plates.
control = 6.0
# The sidebar's plates (Arc's 12, measured), the favorites' tiles, and rows and fields like them.
row = 12.0
# A card that floats: the dialog, the toast, the site controls.
panel = 16.0
# A sheet the user types into, or sorts things in: the command bar, the pickers.
sheet = 20.0

[palette]
# The chrome's text and glyphs, Ink on a light window and Paper on a dark one (#320).
ink = 0x16140f
paper = 0xf3f0e8
# The window is its material under black at `tint`, then the Space's colours. Dia's tint is 0.4,
# but material 29 draws darker in our window than Dia's measures, so the lighter tint brings the
# window to Dia's composite; check/window.sh measures it. The train's window run reads that ground
# as these over a black and over a white backdrop, the extremes the chrome is checked over.
tint = 0.25
ground-over-black = 0x0e0e0e
ground-over-white = 0x3d3d3d
# What stands in for the material where the window's look has to be opaque, under rows it covers
# or in the reveal's panel over the page: Dia's composite over grey 20, before the gradient (ours).
stand-in = 0x131313
# How opaque a theme's colours lie over the window at the intensity a theme starts with, and a
# neutral one's, under this HSL saturation (ours: Dia's line isn't measured).
gradient-alpha = 0.18
neutral-gradient-alpha = 0.06
neutral = 0.1
# What floats over the window: the command bar, a menu and the theme picker's panel, and a
# dialog.
overlay-dark = 0x1f1d17
dialog-dark = 0x2a2720
# The light window, Dia's light layers: material 13 under white at `light-tint`, read before the
# gradient as Dia's composite gives it over a black and a white backdrop, 0.8·255 + 0.2·(137, 243)
# (interim, until the window run measures ours). A theme's colours lie over it at 0.75 of the
# gradient's 0.36, and a neutral one's of its 0.12. The stand-in is Dia's light composite over
# grey 20 (ours, as the dark one).
light-tint = 0.8
light-ground-over-black = 0xe7e7e7
light-ground-over-white = 0xfdfdfd
light-stand-in = 0xe9e9e9
light-gradient-alpha = 0.27
light-neutral-gradient-alpha = 0.09
# What floats over a light window: Paper, the light menu's fill, and a dialog a step lighter, as
# the dark dialog is a step lighter than the dark overlay (ours).
overlay-light = 0xf3f0e8
dialog-light = 0xfbf9f4
# The accent of a Space without a theme starts from ilo green (#0B8045), lighter, so Ink reads on
# it at 4.6:1 where Paper on #0B8045 is 4.4:1. On the measured window over a white backdrop it's
# 2.7:1, so the palette takes it lighter still at its hue, to #57B97A, as it does a theme's colour.
no-theme-accent = 0x289054
# Two colours go from the main one at the window's top left to the second this far along its
# diagonal (Arc 1.170 rec at 2×, with Ardia's account of Arc's rule: OKLab, 45°, to 75 %).
second-at = 0.75
# How strongly the window takes a theme's colours at intensity `i`: in proportion to
# `INTENSITY_FLOOR + INTENSITY_SPAN * i`, so the slider's start is the colour as before themes
# and its left end washes most of it out (ours, fitted to Arc's window at 0.81 and 0.24).
intensity-floor = 0.2
intensity-span = 0.55
# A Space swatch's ring, a hairline.
ring = 1.0
# A Space swatch of two colours holds its main colour, the one the Space's accents take, solid
# this far along its 135° diagonal, then reaches the second at its far edge: about two thirds of
# the disc is nearer the main colour, where the window's own 75 % would leave it a third (ours,
# #1849).
swatch-main-to = 0.25
# The accent under the pointer, each channel at this, darker as every filled button goes (the
# owner, 2026-10-26); pressed, each channel at this, a step darker again, whatever the label (the
# owner, #707); and a text selection, the accent at this.
accent-hovered = 0.9
accent-pressed = 0.8
selection = 0.28
# One ladder of states for every control whose states Arc wasn't recorded with, but the accent's
# (#318): pressed, under the pointer, selected, and selected under the pointer. They're the
# sidebar's rows', measured from Arc (`[shell]`: pressed, hovered, selected and selected-hovered),
# as plates of the ink in Paper's terms, laid over a control's own resting plate. Arc's measured
# states elsewhere, such as the command bar's row, stay theirs.
state-pressed = 0.065
state-hovered = 0.12
state-selected = 0.2
state-selected-hovered = 0.36
# On a light window the tab shown lies on white 0.85 over a black 0.20 shadow rather than on a plate
# of Ink (Arc's light `TabCellBackgroundCurrent`). Ours, as Arc's light rows aren't recorded: the
# shadow 1 down and blurred 2, and the plate white 1 under the pointer.
light-selected = 0.85
light-selected-hovered = 1.0
light-selected-shadow = 0.2
light-selected-shadow-y = 1.0
light-selected-shadow-blur = 2.0

