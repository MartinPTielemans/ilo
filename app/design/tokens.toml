# foot Chromium's settings, 8 up from the window's bottom. Each section is the sidebar's row, 36
# tall on a plate 8 in at the row radius, 2 apart, its glyph 10 in and 9 before its name. The
# mock's rows are 30 tall; they keep the sidebar's 36 so no hit area shrinks.
