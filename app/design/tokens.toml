# A Space's swatch of two colours runs from the main one to the second this far along its
# diagonal, as the window's wash did (Arc 1.170 rec at 2×, with Ardia's account of Arc's rule:
# OKLab, 45°, to 75 %); a swatch's ring is judged over that run.
second-at = 0.75
# How strongly the window takes a theme's colours at intensity `i`: in proportion to
# `INTENSITY_FLOOR + INTENSITY_SPAN * i`, so the slider's start is the colour as before themes
# and its left end washes most of it out (ours, fitted to Arc's window at 0.81 and 0.24).
intensity-floor = 0.2
intensity-span = 0.55
# A Space swatch's ring, a hairline.
ring = 1.0
# A Space swatch of two colours holds its main colour, the one the Space's accents take, solid
# this far along its 135° diagonal, then reaches the second at its far edge: about two thirds of
# the disc is nearer the main colour, where the window's own 75 % would leave it a third (ours,
# #1849).
swatch-main-to = 0.25
# The accent under the pointer, each channel at this, darker as every filled button goes (the
# owner, 2026-10-26); pressed, each channel at this, a step darker again, whatever the label (the
# owner, #707); and a text selection, the accent at this. Where the accent is the text's ink, in a
# Space without a theme and in a field whose owner gives it none, a selection is the text at
# `no-theme-selection`.
accent-hovered = 0.9
accent-pressed = 0.8
# A button filled with the text's ink, a Space's without a theme and Settings' main one, has no
# darker to go to in a light window, where 0.9 of Ink is 1.02:1 from Ink. Under the pointer its
# fill goes this far toward its label's colour, `on-primary`, and pressed this far, in both looks
# (the lead, spec-bar-composer.md, The greens, 3).
ink-hover-mix = 0.12
ink-pressed-mix = 0.2
selection = 0.28
no-theme-selection = 0.24
# One ladder of states for every control whose states Arc wasn't recorded with, but the accent's
# (#318): pressed, under the pointer, selected, and selected under the pointer. They're the
# sidebar's rows', measured from Arc (`[shell]`: pressed, hovered, selected and selected-hovered),
# as plates of the ink in Paper's terms, laid over a control's own resting plate. Arc's measured
# states elsewhere, such as the command bar's row, stay theirs.
state-pressed = 0.065
state-hovered = 0.12
state-selected = 0.2
state-selected-hovered = 0.36
# On a light window the selected plate is the ink too, a step weaker (#4276): dark ink over a light
# glass weighs more than light ink over a dark one. No white plate lies on a light window, and
# nothing lifts this one but its own strength, which it keeps under the pointer.
light-state-selected = 0.16
# The tab shown keeps the Space's colour on its row, the only colour in the chrome (#4089): its
# main colour at `shown` on a dark window and `light-shown` on a light one, and a step firmer under
# the pointer (ours: the mock has no hovered shown row). Where the ink wouldn't read on it at 4.5:1
# over every point of the window, the colour moves in OKLab lightness, its hue kept, until it does.
# A Space with no colour has the ladder's selected plate.
shown = 0.3
shown-hovered = 0.38
light-shown = 0.22
light-shown-hovered = 0.28
# The neutrals every surface of the new look draws with (#4089), in the ink, Paper on dark and Ink
# on light: text at three strengths, and a card's, a field's and a button's plate. Text at
# `text-tertiary` is under 3:1 on a light window and on a dark one over white, so it's only for
# what nobody has to read, never a label alone.
text-primary = 1.0
text-secondary = 0.6
text-tertiary = 0.42
# The two quiet inks are a step firmer on a light window, where dark ink over a bright desktop
# falls under its reading floor sooner than light ink does over a dark one.
light-text-secondary = 0.65
light-text-tertiary = 0.5
card-plate = 0.065
field-plate = 0.085
button-plate = 0.1

